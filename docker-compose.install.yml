name: gtmworks-install
services:
  db:
    image: supabase/postgres:17.6.1.136@sha256:f371b5f3f2ac0a05703f33d6e6134515fb2498cab708fb948a0aeb7481467c00
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/install.sh}
      PGSODIUM_ROOT_KEY: ${PGSODIUM_ROOT_KEY:?Run scripts/install.sh}
      POSTGRES_DB: postgres
      JWT_SECRET: ${SUPABASE_JWT_SECRET:?Run scripts/install.sh}
      JWT_EXP: 3600
    volumes:
      - database:/var/lib/postgresql/data
      - database-config:/etc/postgresql-custom
      - ./scripts/install-db.sql:/docker-entrypoint-initdb.d/init-scripts/99-install.sql:ro
      - ./scripts/local-default-privileges.sql:/bootstrap-grants.sql:ro
      - ./scripts/install-key.sh:/install-key.sh:ro
      - ./supabase/migrations:/migrations:ro
    command: [postgres, -c, config_file=/etc/postgresql/postgresql.conf, -c, pgsodium.getkey_script=/install-key.sh]
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, postgres]
      interval: 5s
      timeout: 5s
      retries: 60
  auth:
    image: supabase/gotrue:v2.197.0@sha256:1736a63078f5922b198c4cbe50f80ab9a2d3b54fe8b7b6cfb2e9dc5dbbc12c6b
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${SUPABASE_PUBLIC_URL}/auth/v1
      GOTRUE_SITE_URL: ${APP_ORIGIN}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_DISABLE_SIGNUP: "true"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_SMTP_HOST: mail
      GOTRUE_SMTP_PORT: 1025
      GOTRUE_SMTP_ADMIN_EMAIL: no-reply@gtmworks.local
      # Emailed links resolve these paths against API_EXTERNAL_URL, whose /auth/v1 an absolute path replaces; the gateway
      # serves Auth under /auth/v1, so the default "/verify" would open the app instead (magic links use the recovery path).
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify
      GOTRUE_MFA_TOTP_ENROLL_ENABLED: "true"
      GOTRUE_MFA_TOTP_VERIFY_ENABLED: "true"
      # Passwords: the rule gtmworks shows (lib/password.mjs), a reset link that works for 24 hours, and a sign-in that
      # lasts 30 days. Repeated wrong passwords are limited by GoTrue's own sign-in rate limit.
      GOTRUE_PASSWORD_MIN_LENGTH: "10"
      GOTRUE_MAILER_OTP_EXP: "86400"
      GOTRUE_SESSIONS_TIMEBOX: 720h
      # GoTrue applies its rate limits only to requests carrying this header, one allowance per value. The gateway writes
      # it from the visitor's address (scripts/install-nginx.conf); browsers sign in through the gateway.
      GOTRUE_RATE_LIMIT_HEADER: X-Real-IP
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:9999/health]
      interval: 5s
      timeout: 5s
      retries: 60
  rest:
    image: postgrest/postgrest:v14.18@sha256:c7cd7e265a85b05248abf53f4473fcec7e327c282d0bd0cf60f1551996d09fcf
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_EXTRA_SEARCH_PATH: public,extensions
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${SUPABASE_JWT_SECRET}
  storage:
    image: supabase/storage-api:v1.89.12@sha256:8526956cb462e9f7d392e9848ec77133b2769982ed614e9753cc687e8e4339a6
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
    environment:
      ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SERVICE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      AUTH_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      POSTGREST_URL: http://rest:3000
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      FILE_SIZE_LIMIT: 52428800
      TENANT_ID: gtmworks
      REGION: local
      GLOBAL_S3_BUCKET: gtmworks
      ENABLE_IMAGE_TRANSFORMATION: "false"
      S3_PROTOCOL_ENABLED: "false"
    volumes:
      - files:/var/lib/storage
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:5000/status]
      interval: 5s
      timeout: 5s
      retries: 60
  mail:
    image: axllent/mailpit:v1.27.10@sha256:b1f1be18af530d939a11ee8820b379e0c88eeec204d904bfad68862adced3a5a
    restart: unless-stopped
    ports: [127.0.0.1:8025:8025]
  gateway:
    image: nginx:1.28.0-alpine@sha256:30f1c0d78e0ad60901648be663a710bdadf19e4c10ac6782c235200619158284
    restart: unless-stopped
    ports: [127.0.0.1:3000:8080]
    # Before nginx starts, write whom it believes when a request names its visitor: only the install network's bridge
    # gateway, read from this container's routes each start, so it follows the network with no setting to keep.
    entrypoint: [sh, -ec, 'sh /gtmworks/gateway-real-ip.sh /etc/nginx/gtmworks-real-ip.conf; exec /docker-entrypoint.sh "$$@"', gateway]
    command: [nginx, -g, daemon off;]
    volumes:
      - ./scripts/install-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./scripts/install-gateway-real-ip.sh:/gtmworks/gateway-real-ip.sh:ro
  web:
    build: .
    image: gtmworks-local:237
    restart: unless-stopped
    # Only the values the app reads, each by name (#446, lib/install-env.mjs CONTAINER_ENV): never the whole .env.install,
    # so the database password, pgsodium's root key and the JWT secret are not in this container. No Engine address or key
    # either (#385, ADR 0018): the app asks its Company's Engine record, and each Engine's key is in that Engine's own file.
    environment:
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?Run scripts/install.sh}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?Run scripts/install.sh}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?Run scripts/install.sh}
      WEBHOOK_ENCRYPTION_KEY: ${WEBHOOK_ENCRYPTION_KEY:?Run scripts/install.sh}
      APP_ORIGIN: ${APP_ORIGIN:?Run scripts/install.sh}
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL:?Run scripts/install.sh}
      SETUP_CODE: ${SETUP_CODE:?Run scripts/install.sh}
      # Optional (#914): this install's own Meta app, for Meta Ads (docs/connect-meta-ads.md).
      META_ADS_CLIENT_ID: ${META_ADS_CLIENT_ID:-}
      META_ADS_CLIENT_SECRET: ${META_ADS_CLIENT_SECRET:-}
      GTMWORKS_SELF_HOSTED: "true"
    command: [sh, -c, "node lib/install-env.mjs validate web && exec node scripts/web-server.mjs"]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(response=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 10s
      retries: 60
  worker:
    image: gtmworks-local:237
    restart: unless-stopped
    # The worker's own list (#446): what the app gets, less the setup code and the public address it never reads.
    environment:
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?Run scripts/install.sh}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?Run scripts/install.sh}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?Run scripts/install.sh}
      WEBHOOK_ENCRYPTION_KEY: ${WEBHOOK_ENCRYPTION_KEY:?Run scripts/install.sh}
      APP_ORIGIN: ${APP_ORIGIN:?Run scripts/install.sh}
      GTMWORKS_SELF_HOSTED: "true"
    command: [sh, -c, "node lib/install-env.mjs validate worker && exec node worker/index.mjs"]
volumes:
  database:
  database-config:
  files:
