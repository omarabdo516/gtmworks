.inv-card .inv .set-hint { display: none; }

/* company knowledge, learning, skills, usage, backups, apps inside cards */
.sx-card .know-body { border-top: 0; padding-top: var(--s4); }
.sx-card .know-edit-row { padding: var(--s3) var(--s4) var(--s4); }
.sx-card .ln-list { list-style: none; margin: 0; padding: var(--s1) var(--s2); display: flex; flex-direction: column; }
.sx .sk-diff { margin: 0; }
.use-bar { width: 96px; height: 6px; flex: none; }
.sx-card .use-num { display: grid; gap: 0; min-width: 104px; text-align: end; font-size: var(--fs-sm); white-space: nowrap; }
.sx-card .use-num > :last-child { font-size: var(--fs-xs); color: var(--text-3); }
.sx-head .bk-run { width: 200px; }
.sov-apps .apps-head { padding: 0 0 var(--s4); background: transparent; }
.sov-apps .apps-body { overflow: visible; padding: var(--s4) 0 0; }
.sov-apps .modal__foot { background: transparent; padding-inline: 0; margin-top: var(--s4); border-top: 0; }
.sov-apps { display: flex; flex-direction: column; gap: var(--s8); height: auto; }

/* Providers: one card, master on the start side, the selected Provider on the end side */
.prv { display: grid; grid-template-columns: 312px minmax(0, 1fr); align-items: stretch; }
.sx-card.prv > * + * { border-top: 0; }
.prv-list { list-style: none; margin: 0; padding: var(--s2); display: flex; flex-direction: column; gap: 2px; border-inline-end: 0.5px solid var(--border-2); }
.prv-row { display: flex; align-items: center; gap: 6px; padding-inline-end: 2px; border-radius: var(--r-sm); transition: background-color var(--dur-fast) var(--ease-out); }
@media (hover: hover) { .prv-row:hover { background: var(--bg-hover); } }
.prv-row.is-sel { background: var(--bg-active); }
.prv-row.is-drag { opacity: .55; }
.prv-pick { flex: 1 1 0; min-width: 0; display: flex; align-items: center; gap: var(--s3); min-height: 56px; padding: var(--s2); border-radius: var(--r-sm); text-align: start; }
.prv-glyph { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; flex: none; border-radius: var(--r-sm); background: var(--bg-tertiary); color: var(--text-2); --od-icon-size: 17px; }
/* provider logos (Lobe Icons): same 32px tile; the mark keeps its own colours, OpenAI/Anthropic take the text colour */
.prv-glyph--logo { color: var(--text-1); }
.pv-mark { display: block; flex: none; width: 18px; height: 18px; }
.pv-mark--val { width: 16px; height: 16px; color: var(--text-1); }
.sr-sel-mark { position: absolute; inset-inline-start: 10px; display: inline-flex; color: var(--text-1); pointer-events: none; }
.sr-sel-mark .pv-mark { width: 16px; height: 16px; }
.sr-sel--logo .sr-select { padding-inline-start: 34px; }
.sr-sel--logo:has(.sr-sel-mark:empty) .sr-select { padding-inline-start: 10px; }
.sr-sel--logo:has(.sr-select:disabled) .sr-sel-mark { opacity: .5; }
.prv-name { font-size: var(--fs-sm); line-height: 1.5; color: var(--text-1); font-weight: var(--w-strong); }
.prv-st { font-size: var(--fs-xs); line-height: 1.5; color: var(--text-3); overflow-wrap: anywhere; }
.prv-grip { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 36px; flex: none; border-radius: var(--r-xs); color: var(--text-4); cursor: grab; touch-action: none; --od-icon-size: 16px; }
.prv-grip:active { cursor: grabbing; }
@media (hover: hover) { .prv-grip:hover { color: var(--text-1); background: var(--bg-hover); } }

.prv-addrow { display: flex; align-items: center; gap: var(--s3); width: 100%; min-height: 44px; padding: var(--s2) var(--s3); border-radius: var(--r-sm); font-size: var(--fs-sm); color: var(--text-2); --od-icon-size: 16px; }
@media (hover: hover) { .prv-addrow:hover { background: var(--bg-hover); color: var(--text-1); } }
.prv-detail { min-width: 0; display: flex; flex-direction: column; }
.prv-detail > * + * { border-top: 0.5px solid var(--border-3); }
.prv-dh { display: flex; align-items: center; gap: var(--s3); min-height: 60px; padding: var(--s2) var(--s3) var(--s2) var(--s4); }
.prv-dt { margin: 0; flex: 1 1 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: var(--fs-msg); font-weight: var(--w-strong); line-height: 1.5; }
.prv-dt:focus { outline: none; }
.prv-sub { padding: var(--s4) var(--s4) var(--s1); font-size: var(--fs-xs); line-height: 1.5; color: var(--text-3); }

/* the small dialog over the overlay */

}

  .sov-nav__hit { padding-block: var(--s2); font-size: var(--fs-sm); }
  .sov-bar { padding-inline: var(--s1) var(--s2); gap: var(--s1); }

  .sov-crumb__cur { font-size: var(--fs-msg); }

  .sr-ta { font-size: 16px; }
  .sr-seg { width: 100%; }
  #sr-ac-theme { flex-wrap: wrap; }
  #sr-ac-theme .sr-ctl { flex: 1 1 100%; max-width: none; }
  .sr:has(.use-bar) { flex-wrap: wrap; }
  .sr:has(.use-bar) .sr-ctl { flex: 1 1 100%; max-width: none; justify-content: space-between; padding-inline-start: 40px; }
  .use-bar { flex: 1 1 auto; width: auto; }
  .switch, .sx-more, .prv-grip, .sx-add { position: relative; }
  .switch::before, .sx-more::before, .prv-grip::before { content: ""; position: absolute; inset: -8px -6px; }
  /* 44 × 44 hit areas around the small glyphs, drawn size unchanged; neighbours keep their centres 44px apart */
  .sx-add::before { content: ""; position: absolute; inset: -8px; }
  .sx-head .tip-btn + .sx-add { margin-inline-start: var(--s3); }

/* the teal ring is for keyboard focus only: after a click or a tap, a control keeps just its selected fill */
html[data-input="pointer"] :is(.sov, .sov-dlg) :focus-visible { outline: none; }
html[data-input="pointer"] .sov .sr-select:focus-visible { box-shadow: none; border-color: var(--border-2); }
/* a Latin value in an Arabic field lines up with the Arabic ones (dir="auto" still places the caret) */
html[dir="rtl"] :is(.sov, .sov-dlg) :is(input, textarea)[dir="auto"] { text-align: right; }
html[dir="ltr"] :is(.sov, .sov-dlg) :is(input, textarea)[dir="auto"] { text-align: left; }
/* dark: muted text, borders, the off switch and the selected row read clearly inside settings */
:root[data-theme="dark"] :is(.sov, .sov-dlg) {
  --text-2: #F5F5F5D1; --text-3: #F5F5F5B8; --text-4: #F5F5F59E;
  --border-2: #F5F5F538; --border-3: #F5F5F51F; --bg-active: #F5F5F526;
  --danger-text: #FF7B7A; /* stays ≥ 4.5:1 on the selected row too */
}
:root[data-theme="dark"] :is(.sov, .sov-dlg) .switch[aria-checked="false"] { background: #F5F5F51F; box-shadow: inset 0 0 0 1px #F5F5F58C; }
:root[data-theme="dark"] :is(.sov, .sov-dlg) .switch[aria-checked="false"]::after { background: #BDBDBD; box-shadow: none; }
@media (prefers-reduced-motion: reduce) { .sov[open], .sov-tip, .sr.is-spot, .sx.is-spot, .sr.is-flash, .ln-row.is-spot, .sx-check.is-busy .od-icon, .sr-adv__chev { animation: none; transition: none; } }
/* Arabic content inside the English interface keeps its own direction */
[dir="ltr"] :is(.lg-note, .lg-val, .mcard__q, .ch-intro__h, .lg-card .od-truncate) { unicode-bidi: plaintext; }

/* ================= Coder: code cards on the same board (round 5) =================
   Ink only. Orange stays «مستنيك». Failed tests read as an ink pill with an x and a word, never as red. */
.kcard__kind { display: flex !important; align-items: center; gap: 6px; flex-wrap: wrap; }
.kmark {
  display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 6px; border-radius: var(--r-xs);
  font-size: var(--fs-xs); font-weight: var(--w-strong); line-height: 1; color: var(--text-1); white-space: nowrap;
  background: var(--bg-tertiary); box-shadow: var(--border-2) 0 0 0 0.5px inset; --od-icon-size: 13px;
}
.kmark--sens { background: transparent; box-shadow: var(--border-1) 0 0 0 1px inset; }
.kc-st { display: grid !important; gap: 2px; padding-top: var(--s2); border-top: 0.5px solid var(--border-2); }
.kc-st__r { display: flex; align-items: center; justify-content: space-between; gap: var(--s2); min-height: 22px; font-size: var(--fs-xs); }
.kc-st__l { color: var(--text-3); }
.cst { display: inline-flex; align-items: center; gap: 4px; font-size: var(--fs-xs); line-height: 1.5; color: var(--text-1); white-space: nowrap; --od-icon-size: 13px; }
.cst .dot { width: 6px; height: 6px; }
.cst--none, .cst--waiting { color: var(--text-2); }
.cst--none { color: var(--text-3); }
.cst--notes { font-weight: var(--w-strong); }
.cst--failed { height: 20px; padding: 0 var(--s2) 0 6px; border-radius: var(--r-full); background: var(--primary); color: var(--on-primary); font-weight: var(--w-strong); }
/* the board filter: الكل / تسويق / كود */
.kind-seg { flex: none; padding: 2px; border-radius: var(--r-full); box-shadow: var(--border-2) 0 0 0 0.5px inset; }
.kind-seg button { display: inline-flex; align-items: center; gap: 6px; min-height: 30px; padding: 0 var(--s3); --od-icon-size: 14px; }
.kind-seg button[aria-pressed="true"] { font-weight: var(--w-strong); }
.kind-seg__n { font-size: var(--fs-xs); color: var(--text-3); }
/* Coder's empty chat */
.coder-steps { list-style: none; margin: var(--s2) 0 0; padding: 0; width: 100%; max-width: 560px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s2); text-align: start; }
.coder-step { display: flex; align-items: flex-start; gap: 10px; padding: var(--s3); border-radius: var(--r-lg); background: var(--bg-pane); box-shadow: var(--border-3) 0 0 0 1px inset; }
.coder-step__n { flex: none; width: 24px; height: 24px; border-radius: var(--r-sm); background: var(--bg-tertiary); display: inline-flex; align-items: center; justify-content: center; font-size: var(--fs-xs); color: var(--text-2); }
.coder-step__t { display: grid; gap: 2px; min-width: 0; }
.coder-step__t b { font-size: var(--fs-sm); line-height: 1.5; }
.coder-step__t span { font-size: var(--fs-xs); line-height: 1.6; color: var(--text-3); }
.coder-empty .empty-chat__hand { max-width: 52ch; }
.coder-empty__board { margin-top: var(--s1); }
.coder-empty__board .num { color: var(--text-3); }
/* the card sheet: «الطلب» */
.code-pane { padding: var(--s5) var(--s5) var(--s6); }
.cx { display: grid; gap: var(--s5); }
.cx-card .card__head > .face { flex: none; margin-top: 2px; }
.cx-q { margin: var(--s2) var(--s4) 0; padding: var(--s3) var(--s4); border-radius: var(--r-md); background: var(--bg-tertiary); font-size: var(--fs-msg); line-height: var(--lh-ar); overflow-wrap: anywhere; }
.cx-q--done { margin-top: var(--s4); font-size: var(--fs-sm); color: var(--text-2); }
.cx-ans { display: grid; gap: 6px; padding: var(--s3) var(--s4) 0; }
.cx-quick { display: flex; flex-wrap: wrap; gap: var(--s2); margin-bottom: var(--s2); }
.cx-quick .chip { height: auto; min-height: 34px; padding-block: 6px; white-space: normal; text-align: start; line-height: 1.5; }
.cx-ans__t { min-height: 72px; }
.cx-sec { display: grid; gap: var(--s2); }
.cx-h { padding-inline: var(--s1); gap: var(--s2); }
.cx-h .badge { align-self: center; }
.cx-box { padding: var(--s3) var(--s4); gap: var(--s3); }
.cx-kv { margin: 0; display: grid; gap: var(--s2); }
.cx-kv__r { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: var(--s3); font-size: var(--fs-sm); line-height: 1.7; }
.cx-kv dt { color: var(--text-3); }
.cx-kv dd { margin: 0; color: var(--text-1); overflow-wrap: anywhere; }
.cx-acc { display: grid; gap: var(--s2); padding-top: var(--s3); border-top: 0.5px solid var(--border-2); }
.cx-acc__h { margin: 0; display: flex; align-items: baseline; gap: var(--s2); font-size: var(--fs-sm); font-weight: var(--w-strong); }
.cx-acc__n { font-size: var(--fs-xs); font-weight: var(--w-regular); color: var(--text-3); }
.cx-check { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--s2); }
.cx-check__i { display: flex; align-items: flex-start; gap: 10px; font-size: var(--fs-sm); line-height: 1.6; color: var(--text-1); }
.cx-check__b { flex: none; width: 18px; height: 18px; margin-top: 2px; border-radius: var(--r-xs); box-shadow: var(--border-1) 0 0 0 1px inset; display: inline-flex; align-items: center; justify-content: center; --od-icon-size: 13px; }
.cx-check__i.is-ok .cx-check__b { background: var(--primary); color: var(--on-primary); box-shadow: none; }
.cx-check__t { flex: 1 1 0; min-width: 0; overflow-wrap: anywhere; }
.cx-new { display: block; font-size: var(--fs-xs); color: var(--text-3); }
.cx-live { margin: 0; display: flex; align-items: center; gap: var(--s2); padding-inline: var(--s1); font-size: var(--fs-sm); color: var(--text-2); }
.cx-sens { margin: 0; display: flex; align-items: flex-start; gap: var(--s2); padding: var(--s3) var(--s4); border-radius: var(--r-md); box-shadow: var(--border-1) 0 0 0 1px inset; font-size: var(--fs-sm); line-height: 1.7; color: var(--text-2); --od-icon-size: 16px; }
.cx-sens .od-icon { flex: none; margin-top: 4px; color: var(--text-1); }
.cx-sens b { color: var(--text-1); }
.cx-st { margin: 0; padding: 2px var(--s3); }
.cx-st__r { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: var(--s3); align-items: start; padding: 10px 0; font-size: var(--fs-sm); }
.cx-st__r + .cx-st__r { border-top: 0.5px solid var(--border-2); }
.cx-st dt { color: var(--text-3); line-height: 24px; }
.cx-st dd { margin: 0; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px var(--s2); line-height: 24px; }
.cx-st .cst { font-size: var(--fs-sm); --od-icon-size: 14px; }
.cx-st .cst--failed { height: 24px; }
.cx-meta { font-size: var(--fs-xs); color: var(--text-3); }
.cx-who { display: inline-flex; align-items: center; gap: 6px; color: var(--text-1); }
.cx-mono { font-family: var(--font-mono); font-size: var(--fs-xs); direction: ltr; unicode-bidi: isolate; }
.cx-branch { color: var(--text-3); overflow-wrap: anywhere; }
.cx-mr { margin-inline: -6px; color: var(--text-1); gap: 6px; flex-wrap: wrap; }
.cx-mr .cx-mono { font-size: var(--fs-sm); font-weight: var(--w-strong); }
.cx-repo { font-size: var(--fs-xs); color: var(--text-3); }

.cx-fail__l { font-size: var(--fs-xs); color: var(--text-3); }

.cx-extra { flex-basis: 100%; display: flex; align-items: flex-start; gap: 6px; font-size: var(--fs-xs); line-height: 1.6; color: var(--text-2); --od-icon-size: 13px; }

[dir="ltr"] :is(.cx-q, .cx-check__t, .cx-kv dd, .cx-note__t span, .cx-fail__w) { unicode-bidi: plaintext; }

/* ================= round 6: the Card window, the board, New card, all conversations =================
   Same tokens, type sizes, radii and motion as the rest of the prototype. */
/* the Card: a centred window over the board, two columns; one column at full screen on a phone */
.cw {
  margin: auto; padding: 0; border: 0; inset: 0;
  width: min(1040px, calc(100vw - 48px)); height: min(820px, calc(100dvh - 48px)); max-width: none; max-height: none;
  border-radius: var(--r-lg); background: var(--bg-chrome); color: var(--text-1); box-shadow: var(--shadow-modal); overflow: hidden;
}
.cw::backdrop { background: var(--bg-scrim, #00000066); }
.cw[open] { animation: rise var(--dur-slow) var(--ease-out); }
.cw.is-closing { animation: modalOut 190ms var(--ease-in) forwards; }
.cw__inner { display: grid; grid-template-rows: auto minmax(0, 1fr); height: 100%; min-height: 0; }
.cw-head { display: grid; gap: var(--s2); padding: var(--s4) var(--s5) var(--s3); border-bottom: 0.5px solid var(--border-3); }
.cw-head__row { display: flex; align-items: center; gap: var(--s2); min-height: 36px; }
.cw-head__row .badge { align-self: center; --od-icon-size: 13px; }
.cw-status {
  display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: var(--r-full);
  background: var(--bg-tertiary); color: var(--text-1); font-size: var(--fs-sm); font-weight: var(--w-strong); white-space: nowrap; --od-icon-size: 14px;
  transition: background-color var(--dur-fast) var(--ease-out);
}
.cw-status .od-icon { color: var(--text-3); }
.cw-status.is-wait { background: var(--wait-bg); color: var(--wait-text); }
.cw-status .dot { width: 7px; height: 7px; }
@media (hover: hover) { button.cw-status:hover { background: var(--bg-secondary-hover); } button.cw-status.is-wait:hover { background: var(--wait-bg); box-shadow: var(--border-2) 0 0 0 0.5px inset; } }
.cw-title { margin: 0; font-size: var(--fs-xl); line-height: 1.45; overflow-wrap: anywhere; }
.cw-title:focus { outline: none; }
.cw-title-btn { display: block; width: calc(100% + 12px); margin-inline: -6px; padding: 0 6px; border-radius: var(--r-sm); font: inherit; text-align: start; transition: background-color var(--dur-fast) var(--ease-out); }
@media (hover: hover) { .cw-title-btn:hover { background: var(--bg-hover); } }
.cw-title-edit { display: grid; gap: var(--s2); }
.cw-title-in { font-size: var(--fs-lg); font-weight: var(--w-strong); height: 44px; }
.cw-edit-row { display: flex; justify-content: flex-end; gap: var(--s2); flex-wrap: wrap; }
.cw-body { display: grid; grid-template-columns: minmax(0, 1fr) 288px; min-height: 0; }
.cw-main { overflow-y: auto; min-height: 0; overscroll-behavior: contain; padding: var(--s5) var(--s6) var(--s8); display: flex; flex-direction: column; gap: var(--s6); }
.cw-top { display: flex; flex-direction: column; gap: var(--s5); }
.cw-side {
  overflow-y: auto; min-height: 0; overscroll-behavior: contain; padding: var(--s5) var(--s5) var(--s8);
  border-inline-start: 0.5px solid var(--border-3); display: flex; flex-direction: column; gap: var(--s5);
}
.cw-feed { display: grid; gap: var(--s3); align-content: start; }
.cw-list:focus { outline: none; }
.cw-tabs { justify-content: flex-start; padding: 0; margin-inline-start: -4px; flex-wrap: wrap; }
.cw-tabs__n { color: var(--text-3); }
.cw-comp { display: grid; gap: var(--s2); }
.cw-comp .composer { max-width: none; width: 100%; margin: 0; }
[dir="ltr"] .cw #ta-note:placeholder-shown { direction: ltr; }
.kcard > .kcard__foot { flex-wrap: wrap; row-gap: 4px; }
.cw-comp .ro-line { justify-content: flex-start; padding-inline: 0; }
.cw .note-hint { justify-content: flex-start; text-align: start; margin: 0; max-width: none; align-items: flex-start; }
.cw .note-hint .od-icon { margin-top: 2px; }

/* main column: callout, description, result */
.cw-call { display: grid; gap: var(--s3); padding: var(--s4); border-radius: var(--r-md); background: var(--bg-tertiary); }
.cw-call--wait { background: var(--wait-bg); }
.cw-call__head { display: flex; align-items: flex-start; gap: var(--s3); }
.cw-call__head > :first-child { margin-top: 1px; }
.cw-call__ic { width: 28px; height: 28px; flex: none; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; background: var(--bg-pane); color: var(--text-2); --od-icon-size: 16px; }
.cw-call__t { margin: 0; font-size: var(--fs-base); font-weight: var(--w-strong); line-height: 1.55; }
.cw-call__s { margin: 0; font-size: var(--fs-xs); line-height: 1.6; color: var(--text-2); }
.cw-call__q { margin: 0; font-size: var(--fs-msg); line-height: var(--lh-ar); white-space: pre-wrap; overflow-wrap: anywhere; }
.cw-call__acts { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2); }
.cw-call .card__outcome { margin: 0; }
.cw-btn-t { max-width: 320px; }
.cw-opts { display: grid; gap: var(--s2); }
.cw-opt {
  display: grid; gap: 2px; padding: 10px var(--s3); border-radius: var(--r-sm); text-align: start;
  background: var(--bg-pane); box-shadow: var(--border-3) 0 0 0 0.5px inset; transition: background-color var(--dur-fast) var(--ease-out);
}
@media (hover: hover) { .cw-opt:hover:not(:disabled) { background: var(--bg-elevated-hover); } }
.cw-opt__t { font-size: var(--fs-base); font-weight: var(--w-strong); line-height: 1.5; }
.cw-opt__d { font-size: var(--fs-sm); line-height: 1.6; color: var(--text-2); }
.cw-opt__tag { font-size: var(--fs-xs); color: var(--text-3); }
.cw-ans { display: grid; gap: 6px; }
.cw-ans .set-textarea { min-height: 64px; }
.cw-kv { margin: 0; display: grid; gap: 4px; }
.cw-kv__r { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: var(--s3); font-size: var(--fs-sm); line-height: 1.6; }
.cw-kv dt { color: var(--text-2); }
.cw-kv dd { margin: 0; overflow-wrap: anywhere; }
.cw-live { margin: 0; display: flex; align-items: center; gap: var(--s2); font-size: var(--fs-sm); line-height: 1.6; color: var(--text-2); }
.cw-live b { color: var(--text-1); }
.cw-sec { display: grid; gap: var(--s2); }
.cw-sec__h { display: flex; align-items: center; gap: var(--s2); min-height: 28px; }
.cw-sec__h h3 { margin: 0; flex: 1 1 0; font-size: var(--fs-sm); font-weight: var(--w-strong); line-height: 1.5; color: var(--text-2); }
.cw-desc { margin: 0; font-size: var(--fs-msg); line-height: var(--lh-ar); white-space: pre-wrap; overflow-wrap: anywhere; }
.cw-desc--btn, .cw-empty--btn { display: block; width: calc(100% + 16px); margin-inline: -8px; padding: 4px 8px; border-radius: var(--r-sm); text-align: start; transition: background-color var(--dur-fast) var(--ease-out); }
@media (hover: hover) { .cw-desc--btn:hover, .cw-empty--btn:hover { background: var(--bg-hover); } }
.cw-desc-in { min-height: 120px; }
.cw-empty { margin: 0; font-size: var(--fs-sm); line-height: 1.6; color: var(--text-3); }
.cw-result { display: grid; gap: var(--s3); padding: var(--s4); border-radius: var(--r-md); background: var(--bg-pane); border: 0.5px solid var(--border-3); }
.cw-sum { margin: 0; font-size: var(--fs-base); line-height: var(--lh-ar); overflow-wrap: anywhere; }
.cw-files { display: flex; flex-wrap: wrap; gap: 6px; }
.cw-file { cursor: pointer; max-width: 100%; }
@media (hover: hover) { .cw-file:hover { background: var(--bg-secondary-hover); } }
.cw-h4 { margin: 0 0 2px; font-size: var(--fs-xs); font-weight: var(--w-regular); color: var(--text-3); }
.cw-vers { list-style: none; margin: 0; padding: 0; }
.cw-ver { display: flex; flex-wrap: wrap; align-items: center; gap: 2px var(--s3); padding: var(--s2) 0; border-top: 0.5px solid var(--border-2); }
.cw-ver > .od-field { flex: 1 1 200px; }
.cw-ver__n { font-size: var(--fs-sm); font-weight: var(--w-strong); line-height: 1.5; }
.cw-ver__d { font-size: var(--fs-xs); color: var(--text-3); }
.cw-ver__st { display: inline-flex; align-items: center; gap: 4px; font-size: var(--fs-xs); color: var(--text-2); --od-icon-size: 14px; white-space: nowrap; }
.cw-ver__st.is-wait { color: var(--wait-text); font-weight: var(--w-strong); }
.cw-ver__st .dot { width: 6px; height: 6px; }
.cw-ver__r { flex-basis: 100%; font-size: var(--fs-sm); line-height: 1.6; color: var(--text-2); }
.cw-hint { margin: 0; font-size: var(--fs-xs); line-height: 1.6; color: var(--text-3); overflow-wrap: anywhere; }
.cw-hint--ok { display: flex; align-items: flex-start; gap: 6px; color: var(--text-2); --od-icon-size: 14px; }
.cw-hint--ok .od-icon { margin-top: 2px; }
.cw-code .cx { gap: var(--s5); }

/* side column: one label over one value */
.cw-field { display: grid; gap: 6px; align-content: start; }
.cw-label { margin: 0; font-size: var(--fs-xs); font-weight: var(--w-regular); line-height: 1.5; color: var(--text-3); }
.cw-val { display: grid; gap: 6px; justify-items: start; min-width: 0; }
.cw-val > * { max-width: 100%; }
.cw-v { font-size: var(--fs-sm); line-height: 1.6; color: var(--text-1); overflow-wrap: anywhere; }
.cw-v--row { display: inline-flex; align-items: center; gap: var(--s2); }
.cw-pick {
  display: flex; align-items: center; gap: var(--s2); width: calc(100% + 16px); min-height: 36px; margin-inline: -8px; padding: 4px 8px;
  border-radius: var(--r-sm); font-size: var(--fs-sm); text-align: start; --od-icon-size: 14px; transition: background-color var(--dur-fast) var(--ease-out);
}
.cw-pick > .od-truncate { flex: 1 1 0; }
.cw-pick > .od-icon { color: var(--text-3); }
@media (hover: hover) { .cw-pick:hover { background: var(--bg-hover); } }
.cw-pick[aria-expanded="true"] { background: var(--bg-active); }
.cw-noone { width: var(--av, 22px); height: var(--av, 22px); flex: none; border-radius: 50%; display: inline-block; box-shadow: var(--border-1) 0 0 0 1px inset; background: transparent; }
.cw-input { width: 100%; height: 36px; font-size: var(--fs-sm); }
.cw-runctl { display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap; width: 100%; }
.cw-runctl__t { display: inline-flex; align-items: center; gap: 6px; flex: 1 1 auto; font-size: var(--fs-xs); color: var(--text-2); }
.cw-runctl .btn { --od-icon-size: 14px; }
.cw-chips { display: flex; flex-wrap: wrap; gap: 6px; max-width: 100%; }
.cw-chip { display: inline-flex; align-items: center; max-width: 100%; min-height: 30px; border-radius: var(--r-full); background: var(--bg-tertiary); font-size: var(--fs-xs); --od-icon-size: 13px; }
.cw-chip__open { display: inline-flex; align-items: center; gap: 6px; min-width: 0; min-height: 30px; padding-inline: 10px 8px; border-radius: var(--r-full); text-align: start; }
.cw-chip__open .dot { width: 6px; height: 6px; }
.cw-chip__open .od-truncate { max-width: 190px; }
.cw-chip__x { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; flex: none; margin-inline-end: 2px; border-radius: 50%; color: var(--text-3); }
@media (hover: hover) { .cw-chip__open:hover { background: var(--bg-secondary-hover); } .cw-chip__x:hover { color: var(--text-1); background: var(--bg-secondary-hover); } }
.cw-add { margin-inline-start: -6px; --od-icon-size: 14px; }
.cw-fls { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; width: 100%; }
.cw-fl { display: grid; gap: 2px; justify-items: start; }
.cw-fl .file-chip { max-width: 100%; }
.cw-fl__d { font-size: var(--fs-xs); color: var(--text-3); }
.cw-from { margin-inline-start: -6px; max-width: 100%; }
.cw-from .od-truncate { max-width: 200px; }
.lg-files { margin: 0; display: flex; flex-wrap: wrap; gap: 6px; }

/* runs */
.cw-runs { list-style: none; margin: 0; padding: 2px var(--s4); border-radius: var(--r-md); background: var(--bg-pane); border: 0.5px solid var(--border-3); }
.cw-run { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: var(--s3); align-items: start; padding: var(--s3) 0; }
.cw-run + .cw-run { border-top: 0.5px solid var(--border-2); }
.cw-run__t { font-size: var(--fs-base); line-height: 1.6; }
.cw-run__o { color: var(--text-2); display: inline-flex; align-items: center; gap: 6px; }
.cw-run__o.is-fail { color: var(--danger-text); font-weight: var(--w-strong); }
.cw-run__o.is-run { color: var(--text-1); font-weight: var(--w-strong); }
.cw-run__d { font-size: var(--fs-xs); color: var(--text-3); }
.cw-run__n { font-size: var(--fs-sm); line-height: 1.6; color: var(--text-2); }

/* the popover every menu of this round uses */
.menu.cw-pop { position: fixed; bottom: auto; inset-inline-start: auto; z-index: 60; width: 260px; max-height: min(420px, 70vh); }
.menu.cw-pop--wide { width: 340px; }
.cw-pop .menu__item { min-height: 36px; }
.cw-pop .menu__item[aria-disabled="true"] { opacity: .55; cursor: default; }
.cw-pop .menu__item .dot { margin-inline: 7px; }
.cw-pop .menu__item > .face, .cw-pop .menu__item > .me__av, .cw-pop .menu__item > .cw-noone { flex: none; }
.cw-pop__empty { padding: var(--s3) 10px; line-height: 1.6; }
.cw-pop .menu__t .mention { font-weight: var(--w-strong); }

/* board: tile, tools, select several, archived list */
.board { display: flex; flex-direction: column; height: 100%; }
.board > .board-cols, .board > .arch { flex: 1 1 0; min-height: 0; }
.page-head__acts { margin-inline-start: auto; display: inline-flex; align-items: center; gap: var(--s2); flex-wrap: wrap; }
.page-head__act { --od-icon-size: 16px; }
.kcard { position: relative; }
.kcard > .kt-live { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: var(--fs-sm); line-height: 1.6; color: var(--text-2); }
.kt-live .od-truncate { flex: 1 1 0; }
.kcard > .kt-note { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-xs); color: var(--text-2); --od-icon-size: 13px; }
.kcard .badge { --od-icon-size: 12px; }
.kt-metas { margin-inline-start: auto; display: inline-flex; align-items: center; gap: var(--s2); flex: none; }
.kt-m { display: inline-flex; align-items: center; gap: 3px; --od-icon-size: 13px; }
.kt-m--wait { color: var(--text-2); }
.kcard > .kt-check {
  position: absolute; top: 12px; inset-inline-end: 12px; width: 20px; height: 20px; border-radius: 6px;
  display: inline-flex; align-items: center; justify-content: center; background: var(--bg-pane); box-shadow: var(--border-1) 0 0 0 1.5px inset; --od-icon-size: 14px;
}
.kcard.is-sel .kcard__title { padding-inline-end: 28px; }
.kcard[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--text-1); }
.kcard[aria-pressed="true"] > .kt-check { background: var(--primary); color: var(--on-primary); box-shadow: none; }
.col__head .col__act { margin-inline-start: auto; font-size: var(--fs-xs); }
.chip--menu { gap: 6px; --od-icon-size: 14px; }
.chip--menu b { font-weight: var(--w-strong); max-width: 160px; overflow: hidden; text-overflow: ellipsis; }
.chip--menu > .od-icon { color: var(--text-3); }
.chip--menu[aria-expanded="true"] { background: var(--bg-active-solid); }
.board-tools .chip { --od-icon-size: 14px; }
.chip[aria-pressed="true"] .od-icon { color: inherit; }
.bt-search { position: relative; display: flex; align-items: center; color: var(--text-3); --od-icon-size: 16px; }
.bt-search .od-icon { position: absolute; inset-inline-start: 12px; pointer-events: none; }
.bt-search input {
  width: 200px; height: 34px; padding: 0 var(--s3); padding-inline-start: 36px; border-radius: var(--r-full); border: 0.5px solid var(--border-2);
  background: var(--bg-pane); color: var(--text-1); font-size: var(--fs-sm); outline: none;
  transition: border-color var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out);
}
.bt-search input:focus { border-color: var(--border-1); box-shadow: 0 0 0 3px var(--bg-active); }
.bt-search input::placeholder { color: var(--text-4); opacity: 1; }
.bt-end { margin-inline-start: auto; display: inline-flex; align-items: center; gap: var(--s2); flex-wrap: wrap; }
.bt-end .board-tools__summary { margin-inline-start: 0; }
.bt-wait { color: var(--wait-text); font-weight: var(--w-strong); }
.bt-wait .dot { width: 7px; height: 7px; }
.bsel { display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap; margin: 0 var(--s8) var(--s4); padding: var(--s2) var(--s2) var(--s2) var(--s4); padding-inline: var(--s4) var(--s2); border-radius: var(--r-full); background: var(--bg-pane); box-shadow: var(--shadow-card); font-size: var(--fs-sm); --od-icon-size: 14px; }
.bsel__n b { font-weight: var(--w-strong); }
.arch { overflow-y: auto; padding: 0 var(--s8) var(--s8); }
.arch-list { max-width: 880px; padding: 4px; }
.arch-row { display: flex; align-items: center; gap: var(--s2); min-height: 56px; padding: 4px; }
.arch-row + .arch-row { border-top: 0.5px solid var(--border-2); }
.arch-open { flex: 1 1 0; min-width: 0; display: flex; align-items: center; gap: var(--s3); padding: 6px var(--s2); border-radius: var(--r-sm); text-align: start; }
@media (hover: hover) { .arch-open:hover { background: var(--bg-hover); } }
.arch-t { font-size: var(--fs-base); font-weight: var(--w-strong); line-height: 1.5; overflow-wrap: anywhere; }
.arch-d { font-size: var(--fs-xs); line-height: 1.5; color: var(--text-3); }
.arch-row .btn { flex: none; --od-icon-size: 14px; }
.arch-empty { max-width: 560px; margin: 0; }
.sel-box { width: 44px; height: 44px; flex: none; display: inline-flex; align-items: center; justify-content: center; border-radius: var(--r-sm); }
.sel-box > span { width: 20px; height: 20px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; box-shadow: var(--border-1) 0 0 0 1.5px inset; --od-icon-size: 14px; }
.sel-box[aria-checked="true"] > span { background: var(--primary); color: var(--on-primary); box-shadow: none; }
@media (hover: hover) { button.sel-box:hover { background: var(--bg-hover); } }

/* confirm and New card dialogs */
.cf-list { list-style: none; margin: 0 0 var(--s4); padding: 0; display: grid; gap: var(--s3); }
.cf-row { display: flex; align-items: flex-start; gap: var(--s3); font-size: var(--fs-base); line-height: 1.6; }
.cf-row > :first-child { margin-top: 1px; }
#cw-confirm .modal__body, #newcard .modal__body { padding-top: var(--s1); }
.nc-form { display: grid; gap: var(--s4); }
.nc-field { display: grid; gap: 6px; justify-items: stretch; }
.nc-field > .link-btn { justify-self: start; }
.nc-req { color: var(--text-3); font-weight: var(--w-regular); }
.nc-field select.set-input { height: 38px; }
.nc-line { margin: 0; display: flex; align-items: flex-start; gap: 6px; padding: var(--s3); border-radius: var(--r-md); background: var(--bg-tertiary); font-size: var(--fs-sm); line-height: 1.6; color: var(--text-1); --od-icon-size: 16px; }
.nc-line .od-icon { margin-top: 2px; color: var(--text-2); }

/* sidebar: a menu on each recent chat, and the way to every conversation */
.thread-row { position: relative; display: flex; align-items: center; }
.thread-row > .thread-item { flex: 1 1 0; min-width: 0; }
.thread-more {
  position: absolute; top: 4px; inset-inline-end: 4px; width: 28px; height: 28px; border-radius: var(--r-xs);
  display: inline-flex; align-items: center; justify-content: center; color: var(--text-2); --od-icon-size: 16px; opacity: 0;
  transition: opacity var(--dur-fast) var(--ease-out), background-color var(--dur-fast) var(--ease-out);
}
.thread-row:hover .thread-more, .thread-row:focus-within .thread-more, .thread-more[aria-expanded="true"] { opacity: 1; }
.thread-row:hover .thread-item__time, .thread-row:focus-within .thread-item__time, .thread-row:has(.thread-more[aria-expanded="true"]) .thread-item__time { visibility: hidden; }
@media (hover: hover) { .thread-more:hover { background: var(--bg-active); color: var(--text-1); } }
@media (hover: none) { .thread-more { opacity: 1; } .thread-row .thread-item__time { visibility: hidden; } }
.sb-all { color: var(--text-2); margin-bottom: var(--s3); }
.sb-all .od-icon:last-child { color: var(--text-3); --od-icon-size: 14px; }

/* the conversation's head and its archived line */
.chat__start { position: absolute; inset-inline-start: var(--s3); top: 14px; z-index: 6; }
.arc-line { display: flex; align-items: center; justify-content: center; gap: 6px; max-width: var(--chat-col); margin: 0 auto var(--s2); font-size: var(--fs-xs); line-height: 1.6; color: var(--text-2); text-align: center; --od-icon-size: 14px; }
.ch-arc { display: grid; gap: var(--s2); padding: var(--s3); justify-items: start; }
.ch-arc .set-hint { margin: 0; }

/* All conversations */
.cvp { height: 100%; overflow-y: auto; }
.cv-tools { gap: var(--s3); }
.cv-seg { flex: none; padding: 2px; border-radius: var(--r-full); box-shadow: var(--border-2) 0 0 0 0.5px inset; }
.cv-seg button { min-height: 30px; padding: 0 var(--s3); display: inline-flex; align-items: center; gap: 6px; }
.cv-seg button[aria-pressed="true"] { font-weight: var(--w-strong); }
.cv-body { padding: 0 var(--s8) var(--s8); }
.cv-list { max-width: 880px; padding: 4px; }
.cv-row { display: flex; align-items: center; gap: var(--s2); padding: 2px; }
.cv-row + .cv-row { border-top: 0.5px solid var(--border-2); }
.cv-open { flex: 1 1 0; min-width: 0; display: flex; align-items: center; gap: var(--s3); min-height: 56px; padding: 6px var(--s2); border-radius: var(--r-sm); text-align: start; }
@media (hover: hover) { .cv-open:hover { background: var(--bg-hover); } }
.cv-open > .od-field { flex: 1 1 0; }
.cv-t { font-size: var(--fs-base); font-weight: var(--w-strong); line-height: 1.5; }
.cv-d { font-size: var(--fs-xs); line-height: 1.5; color: var(--text-3); }
.cv-time { flex: none; display: inline-flex; align-items: center; gap: 4px; font-size: var(--fs-xs); color: var(--text-3); --od-icon-size: 13px; }
.cv-act { flex: none; --od-icon-size: 16px; }
.cv-row .hp-hash { width: 28px; height: 28px; }

[dir="ltr"] :is(.cw-desc, .cw-sum, .cw-call__q, .cw-opt__t, .cw-opt__d, .cw-ver__r, .cw-run__n) { unicode-bidi: plaintext; }

@media (max-width: 1023px) {
  .bsel { margin-inline: var(--s5); }
  .arch, .cv-body { padding-inline: var(--s5); }
  .cw-body { grid-template-columns: minmax(0, 1fr) 256px; }
}
@media (max-width: 767px) {
  .cw { width: 100vw; height: 100dvh; max-height: none; border-radius: 0; }
  .cw-head { padding: var(--s3) var(--s4); }
  .cw-title { font-size: var(--fs-lg); }
  .cw-body { display: flex; flex-direction: column; overflow-y: auto; overscroll-behavior: contain; }
  .cw-main { display: contents; }
  .cw-top { order: 1; padding: var(--s4) var(--s4) 0; }
  .cw-side { order: 2; overflow: visible; min-height: auto; flex: none; margin-top: var(--s5); padding: var(--s4); gap: var(--s4); border-inline-start: 0; border-block: 0.5px solid var(--border-3); }
  .cw-field { grid-template-columns: 112px minmax(0, 1fr); gap: var(--s3); align-items: start; }
  .cw-label { padding-top: 8px; }
  .cw-feed { order: 3; padding: var(--s5) var(--s4) var(--s8); }
  .cw-chip__open .od-truncate { max-width: 150px; }
  .cw-kv__r { grid-template-columns: 80px minmax(0, 1fr); }
  .bsel { margin-inline: var(--s4); border-radius: var(--r-lg); }
  .arch, .cv-body { padding-inline: var(--s4); }
  .cv-open { flex-wrap: wrap; row-gap: 2px; }
  .cv-time { flex-basis: 100%; padding-inline-start: 40px; }
  .arch-row { flex-wrap: wrap; }
  .arch-row .btn { margin-inline-start: 44px; }
  .bt-search, .bt-search input { width: 100%; }
  .bt-search { flex: 1 1 100%; }

.cw-fact--lead { display: block; color: var(--text-1); }
.cwp .cw-fl { min-width: 0; max-width: 100%; }
.cwp .cw-file { max-width: 100%; min-width: 0; }
.cwp .cw-file bdi { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cw-fact--d { display: inline-flex; align-items: center; gap: 4px; vertical-align: bottom; --od-icon-size: 14px; }
.cw-live .cw-call__face { align-self: center; }
.cx-ask .cw-call__head { margin-bottom: var(--s3); }
.cx-ask .cx-q { margin: 0; }
.cw-desc-row { display: flex; align-items: flex-start; gap: var(--s2); }
.cw-desc-row > .de-host { flex: 1 1 0; min-width: 0; }
.cw-pen { opacity: 0; transition: opacity var(--dur-fast) var(--ease-out), background-color var(--dur-fast) var(--ease-out); }
.cw-desc-sec:hover .cw-pen, .cw-pen:focus-visible { opacity: 1; }
@media (hover: none) { .cw-pen { opacity: 1; } }
.cw-desc-sec.is-empty .cw-empty--btn { width: 100%; margin-inline: 0; padding-inline: 0; }
.cw-desc-sec.is-edit > .cw-sec__h { gap: var(--s2); }
.cw-ver__st { gap: 6px; }
.cw-ver__st .sym { --od-icon-size: 15px; }
.cw-tab { position: relative; display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 4px 12px; --od-icon-size: 16px; }
.cw-tab::before { content: ""; position: absolute; inset: -6px 0; }
.cw-tab[aria-selected="true"] { font-weight: var(--w-strong); }
.cw-csym { align-self: center; margin-inline: 2px; }
.cwp-list { display: grid; gap: var(--s2); }
.cwp { position: relative; display: flex; align-items: center; gap: var(--s1); min-width: 0; min-height: 36px; }
.cwp__b, .cwp__s { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: var(--s2); min-height: 36px; padding: 0 var(--s2); border-radius: var(--r-sm); font-size: var(--fs-sm); line-height: 1.5; color: var(--text-1); text-align: start; }
button.cwp__b { position: relative; transition: background-color var(--dur-fast) var(--ease-out); }
button.cwp__b::before { content: ""; position: absolute; inset: -4px 0; }
@media (hover: hover) { button.cwp__b:hover { background: var(--bg-hover); } }
.cwp__b[aria-expanded="true"] { background: var(--bg-active); }
.cwp__ic { display: inline-flex; align-items: center; justify-content: center; width: 20px; flex: none; color: var(--text-2); --od-icon-size: 18px; }
.cwp > .cwp__ic { margin-inline-start: var(--s2); }
.cwp__b.is-empty { color: var(--text-3); }
.cwp__b.is-empty .cwp__ic { color: var(--text-3); }
.cwp__add { opacity: 0; transition: opacity var(--dur-fast) var(--ease-out); }
.cwp__b:hover .cwp__add, .cwp__b:focus-visible .cwp__add { opacity: 1; }
@media (hover: none) { .cwp__add { opacity: 1; } }
.cwp--chips { align-items: flex-start; gap: var(--s2); }
.cwp--chips > .cwp__ic { height: 38px; }
.cwp--chips > .cw-chips, .cwp--chips > .cw-fls { flex: 1 1 0; min-width: 0; padding-block: 4px; }
.cwp__date { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; padding: 0; border: 0; opacity: 0; pointer-events: none; }
.cwp--made .cwp__s { color: var(--text-2); font-size: var(--fs-xs); }
.cwp__src { width: 32px; height: 32px; color: var(--text-3); --od-icon-size: 16px; }
.cw-fls { gap: 6px; }
.cw-chip__open, .cw-chip__x { position: relative; }
.cw-chip__x::before { content: ""; position: absolute; inset: -7px -4px; }

/* New card: placeholders instead of labels; the assignee is the prototype's own menu */
.nc-title { height: 44px; font-size: var(--fs-lg); font-weight: var(--w-strong); }
.nc-row { display: flex; align-items: center; gap: var(--s2); }
.nc-pick {
  position: relative; display: inline-flex; align-items: center; gap: var(--s2); min-width: 0; max-width: 100%; min-height: 36px; padding: 0 var(--s3) 0 var(--s2);
  border-radius: var(--r-full); background: var(--bg-tertiary); color: var(--text-1); font-size: var(--fs-sm); --od-icon-size: 14px;
  transition: background-color var(--dur-fast) var(--ease-out);
}
.nc-pick::before { content: ""; position: absolute; inset: -4px 0; }
.nc-pick > .od-icon { color: var(--text-3); flex: none; }
@media (hover: hover) { .nc-pick:hover { background: var(--bg-secondary-hover); } }
.nc-pick[aria-expanded="true"] { background: var(--bg-active); }
#nc-bolt { --od-icon-size: 18px; }
#nc-files:empty { display: none; }

/* All conversations: icons with numbers; archive shows on hover and focus, always on touch */
.cv-tools { gap: var(--s2); }
.cv-seg button { position: relative; min-width: 44px; justify-content: center; --od-icon-size: 16px; }
.cv-seg button::before { content: ""; position: absolute; inset: -6px 0; }
.cv-face { display: inline-flex; flex: none; }
.cv-act { opacity: 0; transition: opacity var(--dur-fast) var(--ease-out), background-color var(--dur-fast) var(--ease-out); }
.cv-row:hover .cv-act, .cv-row:focus-within .cv-act { opacity: 1; }
@media (hover: none) { .cv-act { opacity: 1; } }
.cv-row .cv-d { color: var(--text-2); }

/* every control of this round keeps a 44px hit area, without growing its look */
.bt-new, .cw-status, .cw-title-btn, .cw-call .btn, .cw-chip__open, .cwp .cw-file, .cw .circle-btn, #newcard .circle-btn, #newcard .modal__foot .btn, #cw-confirm .modal__foot .btn, .cw-comp .composer__btn, .cw-comp .composer__send, .cv-seg button { position: relative; }
.cw-chip__open::before { content: ""; position: absolute; inset: -7px 0; }
.bt-new::before, .cw-status::before, .cw-call .btn::before, .cwp .cw-file::before, #newcard .modal__foot .btn::before, #cw-confirm .modal__foot .btn::before { content: ""; position: absolute; inset: -8px 0; }
.cw-head { gap: var(--s3); }
.cw-title-btn::before { content: ""; position: absolute; inset: -4px 0 -8px; }
.cw-chip__x::before { inset: -9px; }
.de-more { position: relative; }
.de-more::before { content: ""; position: absolute; inset: -10px 0; }
.cw-result .cw-file { position: relative; }
.cw-result .cw-file::before { content: ""; position: absolute; inset: -8px 0; }
.cw .circle-btn::before, #newcard .circle-btn::before { content: ""; position: absolute; inset: -4px; }
.cw-comp .composer__btn::before, .cw-comp .composer__send::before { content: ""; position: absolute; inset: -8px; }
.cv-seg button::before { inset: -7px 0; }
.nc-row .ib { min-width: 44px; }
.nc-row .ib::before { inset: -4px 0; }
@media (max-width: 767px) {
  .board-tools.bt2 { padding: var(--s3) var(--s4); }
  .bt2 .ib.bt-filter { display: inline-flex; }
  .bt2 .board-nav { display: none !important; } /* a finger swipes the columns; the toolbar stays one row */
  .bt2 .bt-search.is-open { order: -2; flex: 1 1 100%; }
  .bt2 .bt-search.is-open input { width: 100%; }
  .bt-new { width: 36px; height: 36px; padding: 0; }
  .bt-new::before { inset: -4px; }
  .cw-title-btn::before { inset: -4px 0 -15px; }
  .bt-new__t { display: none; }
  .cv-open { flex-wrap: nowrap; }
  .cv-time { flex-basis: auto; padding-inline-start: 0; }
}
@media (prefers-reduced-motion: reduce) { .sym__dot::after, .gtip.is-in, .sym.is-new { animation: none; } }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="mobilebar">
    <button type="button" class="circle-btn" data-action="open-sidebar" aria-label="Open menu" aria-controls="sidebar" aria-expanded="false" id="mobile-menu"></button>
    <span class="mobilebar__t" id="mobile-title">Chats</span>
  </header>

  <aside class="sidebar" id="sidebar" aria-label="Main menu">
    <div class="sb-top">
      <div class="ws">
        <svg class="ws__mark" viewBox="0 0 32 32" width="28" height="28" role="img" aria-label="gtmworks logo">
          <rect width="32" height="32" rx="9" fill="var(--accent)"/>
          <path d="M21.5 11.5a7 7 0 1 0 1 7.5h-6.5" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div class="od-field">
          <bdi class="ws__name">gtmworks</bdi>
        </div>
      </div>
      <div class="sb-icons">
        <button type="button" class="circle-btn" data-action="toggle-search" id="btn-search" aria-label="Search chats" aria-controls="sb-search" aria-expanded="false"></button>
        <button type="button" class="circle-btn" data-action="new-chat" id="btn-newchat" aria-label="New chat" title="New chat (N)"></button>
      </div>
    </div>
    <div class="sb-search" id="sb-search" hidden>
      <label class="sr-only" for="sb-q">Search chats</label>
      <input type="search" id="sb-q" autocomplete="off" placeholder="Search chats" dir="auto">
    </div>
    <nav class="sb-scroll" aria-label="Navigation">
      <div class="sb-nav" id="sb-nav"></div>
      <section class="sb-sec" aria-labelledby="lbl-agents">
        <h2 class="sb-label" id="lbl-agents">Agents</h2>
        <div class="agent-grid" id="sb-agents" role="list"></div>
      </section>
      <section class="sb-sec" id="sb-recent" aria-label="Recent chats">
        <div id="sb-threads"></div>
      </section>
    </nav>
    <div class="sb-foot">
      <button type="button" class="sb-item sb-apps" data-action="open-apps" id="btn-apps" aria-haspopup="dialog"></button>
      <!-- the account of the person the prototype is shown as: workspace settings, «شايف كـ», language -->
      <div class="menu me-menu" id="me-menu" role="menu" aria-labelledby="btn-me" hidden></div>
      <button type="button" class="me" data-action="me-menu" id="btn-me" aria-haspopup="menu" aria-expanded="false" aria-controls="me-menu">
        <span class="me__av" aria-hidden="true">S</span>
        <span class="me__text">
          <span class="me__name od-truncate">Sara Mansour</span>
          <span class="me__role od-truncate">Marketing manager</span>
        </span>
        <span class="me__chev" id="me-chev" aria-hidden="true"></span>
      </button>
      <button type="button" class="circle-btn" data-action="toggle-theme" id="btn-theme" aria-label="Light mode" aria-pressed="true"></button>
    </div>
  </aside>
  <div class="scrim" id="scrim" data-action="close-overlays" hidden></div>

  <main class="main" id="main">
    <section class="view" id="view-chat" aria-label="Chat"></section>
    <section class="view" id="view-board" aria-label="Marketing board" hidden></section>
    <section class="view" id="view-dashboard" aria-label="Numbers" hidden></section>
    <section class="view" id="view-log" aria-label="Activity log" hidden></section>
    <section class="view" id="view-convos" aria-label="All conversations" hidden></section>
  </main>

  <aside class="details" id="details" aria-label="Agent details"></aside>
</div>

<!-- the Card: a centred window over the board (one column, full screen on a phone) -->
<dialog class="cw" id="cardwin" aria-labelledby="cw-title"></dialog>
<!-- New card: one small form for the board's button and the «+» on Ideas -->
<dialog class="modal modal--sm modal--fit" id="newcard" aria-labelledby="nc-title"></dialog>
<!-- one confirmation, only when archiving stops running work or an open question -->
<dialog class="modal modal--sm modal--fit" id="cw-confirm" aria-labelledby="cf-title"></dialog>

<dialog class="modal" id="modal" aria-labelledby="modal-title">
  <div class="modal__inner" id="modal-inner"></div>
</dialog>

<!-- the agent's screen, large and read-only («شاشة الوكيل») -->
<dialog class="modal viewer" id="viewer" aria-labelledby="viewer-title">
  <div class="vw" id="viewer-inner"></div>
</dialog>

<!-- «ربط التطبيقات»: the apps catalogue, docked like the board sheet -->
<dialog class="sheet apps-sheet" id="apps" aria-labelledby="apps-title">
  <div class="apps-inner" id="apps-inner"></div>
</dialog>

<!-- «الفريق»: which agents each member works with (Owner and Manager) -->
<dialog class="modal team-dlg" id="team" aria-labelledby="team-title">
  <div class="modal__inner" id="team-inner"></div>
</dialog>

<!-- a file from an agent's library, read-only -->
<dialog class="modal pv" id="preview" aria-labelledby="preview-title">
  <div class="modal__inner pv__inner" id="preview-inner"></div>
</dialog>

<!-- first run: «هتشتغل لوحدك ولا مع تيم؟» (reached from the account menu, a prototype aid) -->
<dialog class="fr" id="firstrun" aria-labelledby="fr-title">
  <div class="fr__inner" id="fr-inner"></div>
</dialog>

<!-- every setting in one place: sections on one side, the open section beside it -->
<dialog class="sov" id="sov" aria-label="Settings">
  <div class="sov__inner" id="sov-inner"></div>
  <div class="sov-tip" id="sov-tip" role="tooltip" hidden></div>
</dialog>
<!-- one small dialog over the settings: confirmations, adding a Provider, licences -->
<dialog class="modal modal--sm modal--fit sov-dlg" id="sov-dlg" aria-labelledby="sov-dlg-title">
  <div class="modal__inner" id="sov-dlg-inner"></div>
</dialog>

<input type="file" id="file-input" multiple hidden tabindex="-1" aria-hidden="true">
<div id="toast-host" aria-live="polite" role="status"></div>

<script src="app.js"></script>
</body>
</html>
