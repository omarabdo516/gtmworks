  position: absolute; top: 0.8cqw; inset-inline-end: 0.8cqw; display: inline-flex; align-items: center; justify-content: center;
  width: 3cqw; height: 3cqw; border-radius: 50%; background: var(--primary); color: var(--on-primary); --od-icon-size: 2cqw;
}
.scr__off {
  grid-column: 1 / -1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.6cqw;
  background: var(--bg-subtle); color: var(--text-3); font-size: 2.6cqw; --od-icon-size: 7cqw;
}
.scr.is-off .scr__bar { opacity: .6; }
.scr__wake { display: grid; gap: 1.4cqw; width: 34%; justify-items: center; }
.scr__off--waking > span:last-child { animation: breathe 1.4s ease-in-out infinite; }
.scr__layer { position: absolute; inset: 0; pointer-events: none; }
.scr__cursor {
  position: absolute; inset-block-start: 0; inset-inline-start: 0; width: 2.8cqw; height: auto; aspect-ratio: 16 / 22;
  transform: translate(calc(var(--x) * 1cqw), calc(var(--y) * 1cqh)); transition: transform 400ms var(--ease-out);
}

/* the card in the details «نشاط» tab */
.scr-st { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-xs); color: var(--text-2); }
.scr-st--wait { color: var(--wait-text); font-weight: var(--w-strong); }
/* just the screen: the action and the current step show on hover or keyboard focus */
.scr-card { display: block; }
.scr-thumb { position: relative; display: block; width: 100%; padding: 0; border-radius: var(--r-md); cursor: pointer; text-align: inherit; }
.scr-thumb.is-static, .scr-thumb[aria-disabled="true"] { cursor: default; }
.scr-thumb .scr { border-radius: var(--r-md); }
.scr-ov {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  padding: var(--s4); border-radius: var(--r-md); text-align: center; pointer-events: none;
  background: color-mix(in srgb, var(--bg-pane) 80%, transparent);
  opacity: 0; transition: opacity var(--dur-fast) var(--ease-out);
}
.scr-ov__pill {
  display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 var(--s4); border-radius: var(--r-full);
  background: var(--primary); color: var(--on-primary); font-size: var(--fs-sm); font-weight: var(--w-strong); line-height: 1; white-space: nowrap;
  --od-icon-size: 16px; transform: translateY(4px); transition: transform var(--dur-fast) var(--ease-out);
}
.scr-ov__line {
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; max-width: 100%;
  font-size: var(--fs-xs); line-height: 1.5; color: var(--text-1); text-wrap: pretty;
}
.scr-thumb:focus-visible .scr-ov { opacity: 1; }
.scr-thumb:focus-visible .scr-ov__pill { transform: none; }
@media (hover: hover) {
  .scr-thumb:hover .scr-ov { opacity: 1; }
  .scr-thumb:hover .scr-ov__pill { transform: none; }
}
/* touch: no hover, so the action sits in the corner all the time */
@media (hover: none) {
  .scr-ov { opacity: 1; background: transparent; justify-content: flex-end; align-items: flex-end; padding: var(--s2); }
  .scr-ov__pill { transform: none; }
  .scr-ov__line { display: none; }
}
@media (prefers-reduced-motion: reduce) { .scr-ov, .scr-ov__pill { transition: none; transform: none; } }

/* details header: face, name, role · status and «اتعمل يوم…» all on one centre line */
.dp-id > div { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; max-width: 100%; }
.dp-id .dp-id__role { justify-content: center; flex-wrap: wrap; gap: 0 4px; margin-top: 0; line-height: 1.5; }
.dp-id .born { justify-content: center; margin-top: 4px; text-align: center; }
/* the five tabs as one even track that lines up with the sections under it */
.dp-scroll > .segmented[role="tablist"] {
  justify-content: stretch; gap: 0; margin: var(--s1) var(--s4) var(--s2); padding: 2px;
  border-radius: var(--r-full); box-shadow: var(--border-2) 0 0 0 0.5px inset;
}
.dp-scroll > .segmented[role="tablist"] button { flex: 1 1 0; min-width: 0; padding: 5px 0; text-align: center; white-space: nowrap; }

/* the large live view */
.viewer { width: min(1180px, calc(100vw - 48px)); height: min(820px, calc(100dvh - 48px)); }
.vw { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; min-height: 0; }
.vw__head { display: flex; align-items: center; gap: var(--s3); padding: var(--s4) var(--s5); border-bottom: 0.5px solid var(--border-3); }
.vw__titles { flex: 1 1 0; min-width: 0; display: grid; }
.vw__title { margin: 0; font-size: var(--fs-lg); line-height: 1.5; }
.vw__sub { font-size: var(--fs-sm); line-height: 1.5; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vw-chip { align-self: center; height: 28px; padding: 0 var(--s3); font-size: var(--fs-sm); --od-icon-size: 14px; flex: none; }
.vw-chip--ctrl { background: var(--primary); color: var(--on-primary); font-weight: var(--w-strong); }
.vw__body { display: grid; grid-template-columns: minmax(0, 1fr) 300px; min-height: 0; }
.vw__stage { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--s3); padding: var(--s5); min-height: 0; overflow-y: auto; background: var(--bg-sidebar); }
.vw__screen, .vw-hand, .vw-off { width: 100%; max-width: min(100%, calc((100dvh - 380px) * 1.6)); }
.vw__screen { min-width: 280px; }
.vw-hand {
  display: flex; align-items: center; gap: var(--s3); padding: var(--s3) var(--s4); border-radius: var(--r-md);
  background: var(--bg-pane); box-shadow: var(--shadow-card); flex-wrap: wrap;
}
.vw-hand .badge { align-self: center; }
.vw-hand__t { flex: 1 1 240px; min-width: 0; display: grid; gap: 2px; }
.vw-hand__t b { font-size: var(--fs-base); line-height: 1.5; }
.vw-hand__t span { font-size: var(--fs-sm); line-height: 1.6; color: var(--text-2); }
.vw-off { display: flex; align-items: center; gap: var(--s3); flex-wrap: wrap; }
.vw-off p { flex: 1 1 260px; margin: 0; font-size: var(--fs-sm); line-height: 1.7; color: var(--text-2); }
.vw-off .btn { --od-icon-size: 16px; }
.vw__log { display: flex; flex-direction: column; gap: var(--s3); min-height: 0; overflow-y: auto; padding: var(--s5) var(--s4); border-inline-start: 0.5px solid var(--border-3); }
.vw__log-h { margin: 0; font-size: var(--fs-sm); font-weight: var(--w-regular); color: var(--text-2); }
.vw-steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.vw-step { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: var(--s2); align-items: start; padding: 6px 0; font-size: var(--fs-sm); line-height: 1.6; color: var(--text-3); overflow-wrap: anywhere; }
.vw-step.is-done { color: var(--text-2); }
.vw-step.is-now { color: var(--text-1); font-weight: var(--w-strong); }
.vw-step__m { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 22px; color: var(--text-2); --od-icon-size: 14px; }
.vw-step.is-now .vw-step__m { color: var(--text-1); }
.vw-step__ring { width: 8px; height: 8px; border-radius: 50%; box-shadow: var(--text-3) 0 0 0 1px inset; }
.vw-step__wait { color: var(--wait-text); font-weight: var(--w-strong); white-space: nowrap; }
.vw-note { margin: auto 0 0; display: flex; align-items: flex-start; gap: 6px; padding-top: var(--s3); border-top: 0.5px solid var(--border-3); font-size: var(--fs-xs); line-height: 1.6; color: var(--text-3); --od-icon-size: 14px; }
.vw-note .od-icon { margin-top: 2px; }
.vw__foot { display: flex; align-items: center; gap: var(--s4); padding: var(--s3) var(--s5); border-top: 0.5px solid var(--border-3); background: var(--bg-chrome); flex-wrap: wrap; }
.vw-mode { flex: 1 1 320px; min-width: 0; display: grid; gap: 2px; font-size: var(--fs-sm); line-height: 1.6; color: var(--text-2); }
.vw-mode b { color: var(--text-1); font-size: var(--fs-base); }
.vw-foot__acts { display: inline-flex; align-items: center; gap: var(--s3); flex-wrap: wrap; }
.vw-foot__acts .btn { --od-icon-size: 16px; }
.vw-take__d { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-xs); color: var(--text-2); --od-icon-size: 14px; white-space: nowrap; }

/* ---- «ربط التطبيقات» sheet ---- */
.apps-inner { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; min-height: 0; }
.apps-head { display: grid; gap: var(--s3); padding: var(--s4) var(--s5) var(--s3); border-bottom: 0.5px solid var(--border-3); background: var(--bg-chrome); }
.apps-head .sheet__top { align-items: center; }
.apps-head .tpl-cats { --od-rail-pad: 0px; }
.apps-count { align-self: center; --od-icon-size: 12px; color: var(--text-2); }
.apps-sub { margin: 0; font-size: var(--fs-sm); line-height: 1.6; color: var(--text-2); }
.apps-body { overflow-y: auto; min-height: 0; overscroll-behavior: contain; padding: var(--s4) var(--s5) var(--s6); display: flex; flex-direction: column; gap: var(--s5); }
.apps-sec { display: grid; gap: 10px; }
.apps-sec__h { margin: 0; padding-inline: 2px; font-size: var(--fs-sm); font-weight: var(--w-regular); color: var(--text-2); }
.apps-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s3); }
.app-card {
  display: flex; flex-direction: column; gap: 10px; padding: var(--s4); border-radius: var(--r-md); min-width: 0;
  background: var(--bg-pane); box-shadow: var(--border-3) 0 0 0 0.5px inset, var(--border-3) 0 0 0 0.5px;
}
.app__top { display: flex; align-items: center; gap: var(--s3); min-width: 0; }
.app__titles { display: grid; min-width: 0; }
.app__name { margin: 0; font-size: var(--fs-base); line-height: 1.5; }
.app__cat { font-size: var(--fs-xs); line-height: 1.5; color: var(--text-3); }
.app__use { margin: 0; font-size: var(--fs-sm); line-height: 1.6; color: var(--text-2); }
.app__foot { display: flex; align-items: center; gap: var(--s2); margin-top: auto; padding-top: 2px; }
.app__state { flex: 1 1 0; min-width: 0; display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-xs); color: var(--text-1); --od-icon-size: 14px; }
.app__state .fstack { margin-inline-start: 4px; }
.app__state--off, .app__none { color: var(--text-3); }
.apps-detail { gap: var(--s5); }
.app-hero { display: flex; align-items: flex-start; gap: var(--s3); }
.app-hero p { margin: 0; flex: 1 1 0; min-width: 0; font-size: var(--fs-msg); line-height: var(--lh-ar); color: var(--text-1); }
.app-kv { margin: 0; }
.app-off { display: grid; gap: var(--s2); padding: var(--s3); border-radius: var(--r-md); background: var(--bg-pane); box-shadow: var(--border-1) 0 0 0 1px inset; }
.app-off p { margin: 0; font-size: var(--fs-sm); line-height: 1.7; color: var(--text-1); }
.apps-sheet .modal__foot { padding-inline: var(--s5); }

/* ---- files library ---- */
.lib-chev { color: var(--text-3); --od-icon-size: 16px; }
.lib-hint { margin: 0; padding-inline: var(--s3); font-size: var(--fs-xs); line-height: 1.6; color: var(--text-3); }
.lib-crumbs { display: flex; align-items: center; gap: 2px; min-height: 22px; padding-inline: 6px; color: var(--text-3); --od-icon-size: 14px; }
.lib-crumbs .link-btn { margin-inline-start: -6px; }
.lib-crumbs__cur { margin: 0; padding: 2px 6px; font-size: var(--fs-sm); font-weight: var(--w-strong); color: var(--text-1); }
.lib-crumbs__cur .muted { font-weight: var(--w-regular); }
.panel-row.lib-file { gap: 4px; padding: 0; }
.lib-file__main { display: flex; align-items: center; gap: 10px; flex: 1 1 0; min-width: 0; min-height: 52px; padding: 6px var(--s2); border-radius: var(--r-sm); text-align: start; transition: background-color var(--dur-fast) var(--ease-out); }
@media (hover: hover) { .lib-file__main:hover { background: var(--bg-hover); } }
.lib-file__main .panel-row__text { display: grid; min-width: 0; flex: 1 1 0; }
.lib-1l { display: block; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lib-thumb {
  width: 36px; height: 36px; flex: none; display: inline-flex; align-items: center; justify-content: center; overflow: hidden;
  border-radius: var(--r-xs); background: var(--bg-tertiary); color: var(--text-2); --od-icon-size: 18px;
}
.lib-thumb img { display: block; max-width: 100%; max-height: 100%; width: auto; height: auto; }
.lib-thumb--lg { width: 44px; height: 44px; border-radius: var(--r-sm); --od-icon-size: 22px; }
.lib-dl { width: 32px; height: 32px; margin-inline-end: 6px; --od-icon-size: 16px; }
.lib-empty { display: grid; justify-items: center; gap: 6px; padding: var(--s5) var(--s3); text-align: center; color: var(--text-3); --od-icon-size: 22px; }
.lib-empty p { margin: 0; font-size: var(--fs-sm); line-height: 1.6; max-width: 32ch; }

/* file preview */
.pv { width: min(760px, calc(100vw - 32px)); height: min(820px, calc(100dvh - 48px)); }
.pv__inner { grid-template-rows: auto minmax(0, 1fr) auto; }
.pv-title { overflow-wrap: anywhere; }
.pv__body { overflow-y: auto; min-height: 0; overscroll-behavior: contain; padding: var(--s2) var(--s6) var(--s6); display: flex; flex-direction: column; gap: var(--s4); }
.pv-h { margin: 0; font-size: var(--fs-msg); line-height: 1.5; }
.pv-copy { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--s3); }
.pv-copy li { display: grid; gap: 6px; padding: var(--s4); border-radius: var(--r-md); background: var(--bg-pane); box-shadow: var(--border-3) 0 0 0 0.5px inset, var(--border-3) 0 0 0 0.5px; }
.pv-copy__l { font-size: var(--fs-xs); color: var(--text-3); }
.pv-copy__t { margin: 0; font-size: var(--fs-msg); line-height: var(--lh-ar); white-space: pre-wrap; overflow-wrap: anywhere; }
.pv-copy .kv { margin: 4px 0 0; }
.pv-copy__n { display: flex; align-items: flex-start; gap: 6px; font-size: var(--fs-sm); line-height: 1.6; color: var(--text-2); --od-icon-size: 14px; }
.pv-copy__n .od-icon { margin-top: 3px; }
.pv-fig { margin: 0; display: grid; justify-items: center; gap: var(--s2); }
.pv-img { display: block; max-width: 100%; max-height: min(540px, calc(100dvh - 300px)); width: auto; height: auto; border-radius: var(--r-sm); box-shadow: var(--border-2) 0 0 0 0.5px; }
.pv-fig figcaption { font-size: var(--fs-xs); color: var(--text-3); }
.pv-article { max-width: 66ch; display: grid; gap: var(--s2); }
.pv-article__h { margin: 0; font-size: var(--fs-lg); line-height: 1.5; }
.pv-article__meta { margin: 0 0 var(--s2); font-size: var(--fs-xs); line-height: 1.6; color: var(--text-3); }
.pv-article h4 { margin: var(--s3) 0 0; font-size: var(--fs-msg); line-height: 1.5; }
.pv-article p { margin: 0; font-size: var(--fs-msg); line-height: var(--lh-ar); }
.pv-article .pv-article__more { margin-top: var(--s3); font-size: var(--fs-sm); color: var(--text-3); }
.pv-stats { --od-cols: 3; --od-gap: var(--s3); }
.pv-stat { padding: var(--s4); border-radius: var(--r-md); background: var(--bg-pane); border: 0.5px solid var(--border-3); --od-gap: 4px; }
.pv-stat__l { font-size: var(--fs-sm); color: var(--text-2); }
.pv-stat__v { font-size: var(--fs-xl); font-weight: var(--w-strong); line-height: 1.25; white-space: nowrap; }
.pv-chart { display: grid; gap: var(--s2); }
.pv-legend { margin-inline-start: 0; }
.pv .demo-note { margin: 0; }

@media (max-width: 1023px) {
  .vw__body { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto; overflow-y: auto; }
  .vw__stage { overflow: visible; }
  .vw__log { border-inline-start: 0; border-top: 0.5px solid var(--border-3); overflow: visible; }
  .vw__screen, .vw-hand, .vw-off { max-width: 100%; }
}
@media (max-width: 599px) {
  .viewer, .pv { width: 100vw; height: 100dvh; border-radius: 0; }
  .vw__head, .vw__foot { padding-inline: var(--s4); }
  .vw__stage { padding: var(--s3); }
  .vw__screen { min-width: 0; }
  .apps-grid { grid-template-columns: minmax(0, 1fr); }
  .apps-head, .apps-body { padding-inline: var(--s4); }
  .pv__body { padding-inline: var(--s4); }
  .pv-stats { --od-cols: 1; }
}
@media (prefers-reduced-motion: reduce) { .scr__cursor { transition: none; } .dot--waking, .scr__off--waking > span:last-child { animation: none; } }

/* ================= responsive ================= */
@media (max-width: 1279px) {
  :root { --sidebar-w: 264px; --details-w: 300px; }
  .kpis { --od-cols: 2; }
  .head-pill { max-width: calc(100% - 320px); }
}
@media (max-width: 1023px) {
  :root { --sidebar-w: 248px; }
  .app { grid-template-columns: var(--sidebar-w) minmax(0, 1fr); }
  .details {
    position: fixed; top: 0; bottom: 0; inset-inline-end: 0; z-index: 40; width: min(340px, 92vw);
    box-shadow: var(--shadow-modal); transform: translateX(-105%); transition: transform var(--dur) var(--ease-out); visibility: hidden;
  }
  .details.is-open { transform: none; visibility: visible; }
  .dash-row { grid-template-columns: minmax(0, 1fr); }
  .page-head, .board-tools, .dash__inner, .board-cols { padding-inline: var(--s5); }
}
@media (max-width: 1023px) { .tpl-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 599px) {
  .tpl-grid { grid-template-columns: minmax(0, 1fr); padding-inline: var(--s4); }
  .modal { width: 100vw; height: 100dvh; border-radius: 0; }
  .modal__head, .modal__tools, .modal__foot, .modal__body { padding-inline: var(--s4); }
  .cr-kinds { grid-template-columns: minmax(0, 1fr); }
  .modal__foot-t { display: none; }
}
@media (max-width: 767px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
  .mobilebar { display: flex; align-items: center; gap: var(--s2); min-height: 56px; padding: 0 var(--s3); background: var(--bg-chrome); }
  .mobilebar__t { font-weight: var(--w-strong); font-size: var(--fs-base); flex: 1 1 0; }
  .sidebar {
    position: fixed; top: 0; bottom: 0; inset-inline-start: 0; z-index: 50; width: min(300px, 86vw);
    transform: translateX(105%); transition: transform var(--dur) var(--ease-out); visibility: hidden; box-shadow: var(--shadow-modal);
  }
  .sidebar.is-open { transform: none; visibility: visible; }
  .scrim { position: fixed; inset: 0; background: var(--bg-scrim); z-index: 45; }
  .kpis { --od-cols: 1; }
  .suggest { grid-template-columns: minmax(0, 1fr); }
  .transcript { padding: 72px var(--s3) var(--s5); }
  .chat .transcript { padding-top: calc(var(--head-h) + var(--s4)); }
  .board-nav__pos { display: none; }
  .composer-area { padding: 0 var(--s3) var(--s3); }
  .page-head { padding: var(--s5) var(--s4) var(--s3); }
  .dash__inner { padding: 0 var(--s4) var(--s8); }
  .board-tools, .board-cols { padding-inline: var(--s4); }
  :root { --col-w: 264px; }
  .head-pill { max-width: calc(100% - 150px); }
  .corner-pill__lbl { display: none; }
  .corner-pill { padding: 0 var(--s3); }
  .empty-chat h2 { font-size: var(--fs-lg); }
  .bubble { max-width: 100%; }
}

/* ---------- motion: friendly and state-driven (faces, press, drag, counters) ---------- */
:root { --ease-spring: cubic-bezier(0.34, 1.45, 0.64, 1); }

/* faces: the features follow the pointer, the eyes blink, a click makes the face hop and smile */
.face__f { transform: translate(var(--fx, 0px), var(--fy, 0px)); transition: transform 240ms var(--ease-out); }
.face__eye { transform-box: fill-box; transform-origin: center; transition: transform 90ms var(--ease-in); }
.face.is-blink .face__eye { transform: scaleY(0.12); }
.face.is-happy { animation: faceHop 460ms var(--ease-spring); }
.face.is-happy .face__eye { transform: scaleY(0.45); transition-duration: 120ms; }
@keyframes faceHop { 0% { transform: none; } 35% { transform: translateY(-4px) scale(1.07); } 100% { transform: none; } }
.agent-tile .face, .head-pill > .face { transition: transform var(--dur) var(--ease-out); }
@media (hover: hover) {
  .agent-tile:hover .face { transform: translateY(-2px); }
  .head-pill:hover > .face { transform: translateY(-1px); }
}
/* an agent at work: eyes scan, three dots think, the dot turns teal and breathes; when it ends, a check */
.face.is-thinking .face__f { animation: faceScan 2.4s ease-in-out infinite; }
@keyframes faceScan { 0%, 100% { transform: translate(-1.4px, 0); } 45%, 55% { transform: translate(1.4px, -0.4px); } }
.face-wrap .think {
  position: absolute; top: -6px; inset-inline-start: -6px; display: inline-flex; align-items: center; gap: 2px;
  height: 14px; padding: 0 4px; border-radius: var(--r-full); background: var(--bg-pane);
  box-shadow: var(--border-2) 0 0 0 0.5px inset, var(--shadow-pill); animation: thinkIn var(--dur) var(--ease-out);
}
.face-wrap .think i { width: 3px; height: 3px; border-radius: 50%; background: var(--text-2); animation: thinkDot 1.2s ease-in-out infinite; }
.face-wrap .think i:nth-child(2) { animation-delay: 150ms; }
.face-wrap .think i:nth-child(3) { animation-delay: 300ms; }
@keyframes thinkDot { 0%, 60%, 100% { transform: translateY(0); opacity: .45; } 30% { transform: translateY(-2px); opacity: 1; } }
@keyframes thinkIn { from { opacity: 0; transform: translateY(3px) scale(.8); } }
.face-wrap.is-thinking > .dot { background: var(--accent); }
.face-wrap.is-thinking > .dot::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: var(--accent); animation: dotPing 1.6s var(--ease-out) infinite; }
@keyframes dotPing { 0% { transform: scale(1); opacity: .55; } 80%, 100% { transform: scale(2.4); opacity: 0; } }
.face-wrap .done-ck {
  position: absolute; bottom: -2px; inset-inline-end: -2px; width: 16px; height: 16px; border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center; background: var(--primary); color: var(--on-primary);
  box-shadow: 0 0 0 2px var(--bg-sidebar); --od-icon-size: 11px; animation: ckPop 320ms var(--ease-spring);
}
.face-wrap--lg .done-ck { width: 20px; height: 20px; box-shadow: 0 0 0 3px var(--bg-chrome); --od-icon-size: 13px; }
.face-wrap .done-ck .od-icon path { stroke-width: 2.6; stroke-dasharray: 40; stroke-dashoffset: 40; animation: drawCheck 360ms var(--ease-out) 140ms forwards; }
@keyframes ckPop { from { transform: scale(.4); opacity: 0; } }
@keyframes drawCheck { to { stroke-dashoffset: 0; } }

/* press: everything you can press gives a little under the finger */
:is(.btn, .circle-btn, .chip, .agent-tile, .head-pill, .corner-pill, .composer__btn, .link-btn, .steps__toggle, .kcard, .opt, .panel-row, .sb-item, .menu__item) {
  transition-property: background-color, box-shadow, color, border-color, transform;
  transition-duration: var(--dur-fast); transition-timing-function: var(--ease-out);
}
:is(.btn, .circle-btn, .chip, .agent-tile, .head-pill, .corner-pill, .composer__btn):active:not(:disabled):not([aria-disabled="true"]) { transform: scale(0.96); }
:is(.kcard, .opt, .panel-row, .sb-item, .menu__item, .link-btn, .steps__toggle):active:not(:disabled) { transform: scale(0.985); }
.opt.is-chosen:active, .panel-row:not(button):active { transform: none; }
.switch::after { transition: transform 320ms var(--ease-spring), background-color var(--dur) var(--ease-out); }

/* send: the arrow takes off, the button's new icon pops in */
.send-fly {
  position: fixed; z-index: 130; display: inline-flex; align-items: center; justify-content: center; pointer-events: none;
  color: var(--text-1); --od-icon-size: 16px; animation: sendFly 380ms var(--ease-in) forwards;
}
@keyframes sendFly { to { transform: translateY(-28px) scale(.8); opacity: 0; } }
.od-icon.is-morph { animation: iconIn 240ms var(--ease-spring); }
@keyframes iconIn { from { transform: scale(.5) rotate(-30deg); opacity: 0; } }
.toast.is-leaving { animation: toastOut 140ms var(--ease-in) forwards; }
@keyframes toastOut { to { opacity: 0; transform: translate(-50%, -4px); } }

/* live line: each new step fades in */
.thinking .shimmer { display: inline-block; }
.is-swap { animation: lineIn 240ms var(--ease-out), breathe 1.4s ease-in-out 240ms infinite; }
@keyframes lineIn { from { opacity: 0; transform: translateY(4px); } }
/* tool steps arrive one after another, each check draws itself */
.step__state { display: inline-flex; align-items: center; gap: 3px; }
.step__ck { --od-icon-size: 12px; }
.steps__list.is-just .step { animation: rise 240ms var(--ease-out) both; animation-delay: calc(var(--i, 0) * 45ms); }
.steps__list.is-just .step__ck path { stroke-dasharray: 40; stroke-dashoffset: 40; animation: drawCheck 320ms var(--ease-out) forwards; animation-delay: calc(var(--i, 0) * 45ms + 160ms); }
/* an answered card settles, its check draws */
.card.is-just { animation: settle 320ms var(--ease-out); }
@keyframes settle { from { opacity: .55; transform: scale(.985); } }
.card.is-just .opt.is-chosen .opt__key { animation: ckPop 320ms var(--ease-spring); }
.card.is-just .opt__check path, .card.is-just .card__outcome .od-icon path { stroke-dasharray: 40; stroke-dashoffset: 40; animation: drawCheck 380ms var(--ease-out) 140ms forwards; }

/* board: pick a card up, carry it, drop it */
.kcard { position: relative; cursor: grab; }
@media (hover: hover) { .kcard:hover { transform: translateY(-1px); } }
.kcard.is-drag-src { opacity: .35; transform: none; background: transparent; box-shadow: inset 0 0 0 1px var(--border-1); }
body.is-dragging, body.is-dragging * { cursor: grabbing !important; user-select: none; }
.kcard--ghost {
  position: fixed; z-index: 120; margin: 0; pointer-events: none; transform-origin: 50% 30%; will-change: transform;
  box-shadow: var(--border-2) 0 0 0 0.5px, var(--shadow-modal);
}
.col { transition: box-shadow var(--dur-fast) var(--ease-out), background-color var(--dur-fast) var(--ease-out); }
.col.is-over { background: var(--bg-active); box-shadow: inset 0 0 0 1.5px var(--text-1); }
.col.is-blocked { box-shadow: inset 0 0 0 1.5px var(--border-1); }
.col.is-blocked .col__body { opacity: .5; }
.kcard.is-drop-before::before { content: ""; position: absolute; top: -5px; inset-inline: var(--s2); height: 2px; border-radius: var(--r-full); background: var(--text-1); }
.col__body.is-drop-end::after { content: ""; flex: none; height: 2px; margin-inline: var(--s2); border-radius: var(--r-full); background: var(--text-1); }
.kcard.is-landing { box-shadow: 0 0 0 2px var(--text-1); }
.board--enter .bar__fill { animation: barGrow 700ms var(--ease-out) both; }
@keyframes barGrow { from { transform: scaleX(0); } }
.badge--wait.is-new, .corner-pill.is-new { animation: nudge 520ms var(--ease-out); }
@keyframes nudge { 0%, 100% { transform: none; } 20% { transform: translateX(-3px) rotate(-2deg); } 40% { transform: translateX(3px) rotate(2deg); } 60% { transform: translateX(-2px); } 80% { transform: translateX(1px); } }
.sb-count.is-pop { animation: countPop 360ms var(--ease-spring); }
@keyframes countPop { from { transform: scale(.6); } }

/* dashboard chart: bars rise, a crosshair reads any day */
.chart-wrap { position: relative; }
.chart .bar-g { transition: opacity var(--dur-fast) var(--ease-out); }
.chart.is-hover .bar-g:not(.is-on) { opacity: .4; }
.chart__hair { stroke: var(--text-3); stroke-dasharray: 3 3; opacity: 0; transition: opacity var(--dur-fast) var(--ease-out); }
.chart.is-hover .chart__hair { opacity: 1; }
.chart.is-enter .bar-g rect { transform-box: fill-box; transform-origin: 50% 100%; animation: barUp 380ms var(--ease-out) both; animation-delay: calc(var(--i, 0) * 16ms); }
@keyframes barUp { from { transform: scaleY(0); } }
.chart-tip {
  position: absolute; top: 0; left: 0; z-index: 2; min-width: 132px; padding: var(--s2) var(--s3); border-radius: var(--r-md);
  background: var(--bg-pane); border: 0.5px solid var(--border-2); box-shadow: var(--shadow-popover);
  display: grid; gap: 2px; font-size: var(--fs-xs); line-height: 1.5; color: var(--text-2); pointer-events: none;
  transition: transform 120ms var(--ease-out); animation: fadeIn var(--dur-fast) var(--ease-out);
}
.chart-tip__d { color: var(--text-3); }
.chart-tip__tot { font-size: var(--fs-sm); font-weight: var(--w-strong); color: var(--text-1); }
.chart-tip__row { display: flex; align-items: center; gap: 6px; }
.chart-tip__row i { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.chart-tip__row .num { margin-inline-start: auto; color: var(--text-1); }

@media (prefers-reduced-motion: reduce) {
  .face__f { transform: none !important; }
  .face.is-thinking .face__f, .face-wrap .think i, .face-wrap.is-thinking > .dot::after { animation: none !important; }
  .kcard:hover { transform: none; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; }
  .caret, .shimmer, .rec-dot { animation: none; }
  .wave__bar { transition: none; }
}

/* ================= interface language =================
   English (left-to-right) is the default interface; Arabic (right-to-left) is chosen from Sara's workspace menu.
   Layout uses logical properties throughout; the rules below cover the few physical motions and masks,
   and keep Arabic chat content reading right-to-left inside the English interface. */
:root[lang="en"] { --font: "IBM Plex Sans", "IBM Plex Sans Arabic", "Noto Sans Arabic", system-ui, sans-serif; }
.kpi__unit--pre { margin-inline-start: 0; margin-inline-end: 4px; }

[dir="ltr"] .switch[aria-checked="true"]::after { transform: translateX(12px); }
[dir="ltr"] .sheet[open] { animation-name: sheetInLtr; }
[dir="ltr"] .sheet.is-closing { animation-name: sheetOutLtr; }
@keyframes sheetInLtr { from { transform: translateX(24px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes sheetOutLtr { to { transform: translateX(24px); opacity: 0; } }
[dir="ltr"] .board-cols.has-more-end { -webkit-mask-image: linear-gradient(to left, transparent 0, #000 var(--s12)); mask-image: linear-gradient(to left, transparent 0, #000 var(--s12)); }
[dir="ltr"] .board-cols.has-more-start { -webkit-mask-image: linear-gradient(to right, transparent 0, #000 var(--s12)); mask-image: linear-gradient(to right, transparent 0, #000 var(--s12)); }
[dir="ltr"] .board-cols.has-more-start.has-more-end {
  -webkit-mask-image: linear-gradient(to right, transparent 0, #000 var(--s12), #000 calc(100% - var(--s12)), transparent 100%);
  mask-image: linear-gradient(to right, transparent 0, #000 var(--s12), #000 calc(100% - var(--s12)), transparent 100%);
}
@media (max-width: 1023px) {
  [dir="ltr"] .details { transform: translateX(105%); }
  [dir="ltr"] .details.is-open { transform: none; }
}
@media (max-width: 767px) {
  [dir="ltr"] .sidebar { transform: translateX(-105%); }
  [dir="ltr"] .sidebar.is-open { transform: none; }
}

/* Arabic content (thread and card titles, routine names, notes) inside the English interface:
   each line takes its direction from its own text, so «حملة Meta: المحاسب الشامل» reads right-to-left
   while English rows stay left-to-right. Short labels keep the interface's left edge. */
[dir="ltr"] :is(.panel-row__t, .panel-row__d, .kcard__title, .kcard__t, .head-pill__title, .thread-item .od-truncate,
  .card__title, .card__sub, .kv__row dd, .feed__t, .vw-hand__t, .vw__sub, .table td:first-child, .app__name, .scr__tx, .scr__input) {
  unicode-bidi: plaintext; text-align: left;
}
[dir="ltr"] :is(.note > span, .handoff__t, .handoff__d, .dp-id__name, .empty-chat h2, .ck-label, .wait-empty span, .try-one__btn) { unicode-bidi: plaintext; }
[dir="ltr"] .suggest :is(b, span) { unicode-bidi: plaintext; text-align: left; }
/* longer Arabic text reads as a right-aligned paragraph */
[dir="ltr"] :is(.mem-note__t, .rv-note, .ck-quote, .set-input, textarea, input[type="search"], input[type="text"]) { unicode-bidi: plaintext; }
[dir="ltr"] .bubble { text-align: start; }
/* fields you write to the agents in Arabic start right-to-left (their examples are Arabic too) */
[dir="ltr"] :is(.composer__input, #set-instr, #mem-new, #rt-new, #idea-title):placeholder-shown { direction: rtl; }

/* ================= the team round: people, the main agent, proposals ================= */
/* the main agent's tile: a small «الرئيسي» mark under its name */
.agent-tile__main { display: inline-flex; align-items: center; height: 18px; padding: 0 6px; margin-top: -2px; border-radius: var(--r-full); background: var(--bg-tertiary); font-size: var(--fs-xs); line-height: 1; color: var(--text-2); white-space: nowrap; }
.agent-tile[aria-current="true"] .agent-tile__main { background: var(--bg-pane); }
.main-h { display: inline-flex; align-items: center; gap: var(--s2); }
.main-badge { align-self: center; font-weight: var(--w-regular); }
/* a viewer: where the composer was, one quiet line */
.ro-line { display: flex; align-items: center; justify-content: center; gap: 6px; max-width: var(--chat-col); margin: 0 auto; padding: var(--s3) var(--s4); font-size: var(--fs-sm); line-height: 1.6; color: var(--text-3); text-align: center; --od-icon-size: 16px; }
.ro-line .od-icon { color: var(--text-3); }
.sheet .ro-line { padding-top: var(--s2); }
/* read-only agent settings */
.ro-note { display: flex; align-items: flex-start; gap: 6px; margin: 0; padding: var(--s1) var(--s3) 0; font-size: var(--fs-sm); line-height: 1.6; color: var(--text-2); --od-icon-size: 16px; }
.ro-note .od-icon { margin-top: 3px; color: var(--text-3); }
.ro-text { margin: 0; padding: 10px var(--s2); font-size: var(--fs-sm); line-height: 1.7; color: var(--text-1); overflow-wrap: anywhere; }
.ro-val { color: var(--text-2); }
/* a question card a viewer reads: every option, no buttons */
.opt--static { cursor: default; }
.opt--static .opt__d { display: block; }
/* new-agent proposal card */
.pp-card .card__head { padding-top: var(--s2); }
.pp-card .badge { --od-icon-size: 13px; }
.pp-kv dd { line-height: 1.7; }
.pp-sub { display: block; margin-top: 2px; color: var(--text-2); }
.pp-tools { display: inline-flex; gap: 4px; margin-inline-end: 6px; vertical-align: -6px; }
.pp-card.is-resolved .kv { margin-bottom: 0; }
.pp-form { display: grid; gap: var(--s4); padding: var(--s3) var(--s4) 0; }
.pp-chips { display: flex; flex-wrap: wrap; gap: var(--s2); }
.pp-chip { gap: 6px; padding-inline: 6px var(--s3); }
.pp-chip[aria-checked="true"] { background: var(--primary); color: var(--on-primary); box-shadow: none; }
.pp-out span { overflow-wrap: anywhere; }
.card__outcome .link-btn { margin-inline-start: auto; flex: none; }
.me__av.pp-av { width: 28px; height: 28px; font-size: var(--fs-xs); }

/* ---------- agents come from asking Lead ---------- */
/* «جديد» on a tile Lead just made */
.agent-tile__new { display: inline-flex; align-items: center; height: 18px; padding: 0 6px; margin-top: -2px; border-radius: var(--r-full); background: var(--primary); color: var(--on-primary); font-size: var(--fs-xs); line-height: 1; font-weight: var(--w-strong); white-space: nowrap; }
/* the first run: one face, one line, one sentence to try */
.empty-chat--fresh { gap: var(--s3); }
.empty-chat--fresh > p { max-width: 38ch; font-size: var(--fs-msg); }
.empty-chat--fresh .try-one { margin-top: var(--s2); }
/* the board when nothing exists yet */
.board-bare { display: flex; align-items: center; gap: var(--s3); margin: 0 var(--s8) var(--s4); padding: var(--s3) var(--s4); border-radius: var(--r-lg); border: 1px dashed var(--border-1); }
.board-bare p { flex: 1 1 auto; margin: 0; font-size: var(--fs-sm); line-height: 1.6; color: var(--text-2); }
.board-bare .btn { flex: none; }
/* «وكيل جديد»: a hint above Lead's composer, the gallery as a small second way */
.new-hint { display: flex; align-items: center; flex-wrap: wrap; gap: 6px var(--s2); max-width: var(--chat-col); margin: 0 auto var(--s2); padding: 0 var(--s2); font-size: var(--fs-sm); line-height: 1.6; color: var(--text-2); --od-icon-size: 16px; }
.new-hint__ic { color: var(--text-2); flex: none; }
.new-hint__t { margin: 0; flex: 1 1 260px; }
.new-hint__alt { font-size: var(--fs-xs); color: var(--text-3); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--border-1); }
@media (hover: hover) { .new-hint__alt:hover { color: var(--text-1); text-decoration-color: currentColor; } }
/* «اتعمل يوم … بطلب من …» */
.born { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 6px; margin: 0; font-size: var(--fs-xs); line-height: 1.5; color: var(--text-3); --od-icon-size: 13px; }
.born .od-icon { color: var(--text-3); flex: none; }
.born--empty { justify-content: center; }
.born--sov { margin-top: 2px; }
.born__link { font-size: var(--fs-xs); color: var(--text-1); font-weight: var(--w-strong); }
.sov-born { color: var(--text-3) !important; }
/* the quiet private line at the top of a direct chat */
.priv-line { display: flex; align-items: center; justify-content: center; gap: 6px; margin: 0 auto; padding: 0 var(--s3); font-size: var(--fs-xs); line-height: 1.5; color: var(--text-3); text-align: center; --od-icon-size: 13px; }
.priv-line .od-icon { color: var(--text-3); flex: none; }
/* another member's card chat: the lock panel */
.priv-sheet__ic { width: 48px; height: 48px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; background: var(--bg-tertiary); color: var(--text-2); --od-icon-size: 20px; }
/* the made / request card */
.ac-kv .kv__row { grid-template-columns: 116px minmax(0, 1fr); }
.ac-never { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.ac-never li { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 var(--s2); border-radius: var(--r-full); background: var(--bg-tertiary); font-size: var(--fs-xs); color: var(--text-1); --od-icon-size: 13px; }
.ac-never .od-icon { color: var(--text-2); }
.ac-tip { display: flex; align-items: center; gap: 6px; margin: -6px 0 0; padding: 0 var(--s4) var(--s4); font-size: var(--fs-xs); line-height: 1.5; color: var(--text-3); --od-icon-size: 13px; }
.ac-actions .btn { flex: 0 1 auto; padding-inline: var(--s5); }
.badge--made { background: var(--primary); color: var(--on-primary); font-weight: var(--w-strong); }
.badge--req { background: transparent; color: var(--text-1); box-shadow: var(--border-1) 0 0 0 1px inset; font-weight: var(--w-strong); }
/* a member's request is not an agent: dashed outline, no fill shadow */
.ac-card--req { box-shadow: none; outline: 1px dashed var(--border-1); outline-offset: -1px; background: var(--bg-pane); }
.ac-card--req .card__head .face, .ac-card--req .card__head > :first-child { opacity: 0.72; }
.ac-card--req.is-resolved .card__head > :first-child { opacity: 1; }
/* Lead's one question */
.ask1__head { display: grid; gap: 2px; padding: var(--s4) var(--s4) 0; }
.ask1__q { font-size: var(--fs-base); font-weight: var(--w-strong); line-height: 1.6; }
.ask1__why { font-size: var(--fs-xs); line-height: 1.5; color: var(--text-3); }
.ask1__opts { display: flex; flex-wrap: wrap; gap: var(--s2); padding: var(--s3) var(--s4) 0; }
.ask1__or { margin: 0; padding: var(--s2) var(--s4) var(--s4); font-size: var(--fs-xs); color: var(--text-3); }
.ask1__or:empty { padding: 0 0 var(--s3); }
.ask1.is-resolved .card__outcome { padding-top: var(--s2); }
/* «اتحفظت» on a saved rule */
.note--saved { gap: 2px 8px; }
.note__saved { display: inline-flex; align-items: center; height: 20px; padding: 0 var(--s2); border-radius: var(--r-full); background: var(--primary); color: var(--on-primary); font-size: var(--fs-xs); font-weight: var(--w-strong); line-height: 1; }
/* «مستنيك»: a step handed to you vs a member asking for an agent */
.wtag { display: inline-flex; align-items: center; gap: 4px; align-self: flex-start; height: 22px; padding: 0 var(--s2); border-radius: var(--r-full); font-size: var(--fs-xs); font-weight: var(--w-strong); white-space: nowrap; --od-icon-size: 13px; }
.wtag--hand { background: var(--bg-tertiary); color: var(--text-1); }
.wtag--req { background: transparent; color: var(--text-1); box-shadow: var(--border-1) 0 0 0 1px inset; }
.wtag--inline { height: 20px; margin-inline-end: 6px; vertical-align: 1px; }
.ck-req .me__av { flex: none; }
/* settings: the simplest way to change an agent is to tell it */
.talk-tip { display: flex; align-items: center; flex-wrap: wrap; gap: 4px var(--s2); margin: 0 0 var(--s4); padding: var(--s3) var(--s4); border-radius: var(--r-md); background: var(--bg-tertiary); font-size: var(--fs-sm); line-height: 1.6; color: var(--text-1); --od-icon-size: 16px; }
.talk-tip > span { flex: 1 1 240px; }
.talk-tip .link-btn { font-size: var(--fs-sm); font-weight: var(--w-strong); }
.sov-rules { margin-bottom: var(--s6); }
.rl-list { padding-block: var(--s1); }
.rl-row { align-items: flex-start; }
.rl-row .panel-row__icon { margin-top: 2px; }
.ln-sugg .set-hint { margin: 0; }
[dir="ltr"] :is(.born span, .priv-line span, .new-hint__t, .ac-never span, .wtag) { unicode-bidi: plaintext; }
/* «شايف كـ» in the account menu */
.me__av.me-as__av { width: 24px; height: 24px; font-size: var(--fs-xs); }
.me-as__hint { margin-top: 4px; }
/* «الفريق»: members × agents */
.modal.team-dlg { width: min(880px, calc(100vw - 32px)); height: fit-content; max-height: min(720px, calc(100dvh - 48px)); }
.team-dlg .modal__inner { grid-template-rows: auto minmax(0, 1fr) auto; }
.ta-table th, .ta-table td { vertical-align: middle; }
.ta-table thead th { padding-top: var(--s2); }
.ta-table th[scope="row"] { padding: var(--s3) var(--s2); border-bottom: 0.5px solid var(--border-3); color: var(--text-1); }
.ta-table tbody tr:last-child th { border-bottom: 0; }
.ta-ag { display: inline-flex; align-items: center; gap: 6px; color: var(--text-2); }
.ta-who { display: flex; align-items: center; gap: var(--s2); }
.ta-name { font-size: var(--fs-sm); color: var(--text-1); }
.ta-role { font-size: var(--fs-xs); color: var(--text-3); }
.ta-all { font-size: var(--fs-xs); color: var(--text-3); white-space: nowrap; }
.ta-hint { margin: var(--s4) 0 0; }

/* ================= the log, channels and mentions round ================= */
/* who did it: a person's initial, an agent's face, or the gtmworks mark for automatic lines */
.me__av.lg-av { width: var(--av, 28px); height: var(--av, 28px); font-size: var(--fs-xs); }
.lg-sys { display: block; flex: none; }

/* one log line: who · what (old → new) · when, with notes as a quiet block */
.lg-wrap { display: grid; gap: var(--s5); }
.lg-day { display: grid; gap: var(--s2); }
.lg-day__h { margin: 0; padding-inline: var(--s1); font-size: var(--fs-xs); font-weight: var(--w-regular); line-height: 1.5; color: var(--text-3); }
.lg-list { list-style: none; margin: 0; padding: 2px var(--s4); border-radius: var(--r-md); background: var(--bg-pane); border: 0.5px solid var(--border-3); }
.lg-row { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: var(--s3); align-items: start; padding: var(--s3) 0; }
.lg-row + .lg-row { border-top: 0.5px solid var(--border-2); }
.lg-row > :first-child { margin-top: 1px; }
.lg-row.is-just { animation: rise var(--dur) var(--ease-out); }
.lg-body { display: grid; gap: 6px; min-width: 0; border-radius: var(--r-sm); }
.lg-line { margin: 0; font-size: var(--fs-base); line-height: 1.6; color: var(--text-1); overflow-wrap: anywhere; }
.lg-name { font-weight: var(--w-strong); }
.lg-you, .lg-act { color: var(--text-2); }
.lg-change { margin: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; color: var(--text-3); --od-icon-size: 14px; }
.lg-val { display: inline-block; max-width: 100%; padding: 1px var(--s2); border-radius: var(--r-xs); background: var(--bg-tertiary); font-size: var(--fs-sm); line-height: 1.6; color: var(--text-1); overflow-wrap: anywhere; }
.lg-val--old { background: transparent; box-shadow: var(--border-2) 0 0 0 0.5px inset; color: var(--text-2); }
.lg-note { margin: 0; padding: var(--s2) var(--s3); border-radius: var(--r-md); background: var(--bubble-agent); box-shadow: var(--bubble-ring); font-size: var(--fs-base); line-height: var(--lh-ar); white-space: pre-wrap; overflow-wrap: anywhere; }
.lg-note--working { display: flex; align-items: center; gap: var(--s2); background: transparent; box-shadow: var(--border-2) 0 0 0 0.5px inset; white-space: normal; }
.lg-meta { margin: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 2px 6px; font-size: var(--fs-xs); line-height: 1.6; color: var(--text-3); --od-icon-size: 13px; }
.lg-meta .link-btn { font-size: var(--fs-xs); padding: 0 4px; margin-inline: -4px; min-height: 24px; color: var(--text-2); }
.lg-card { min-width: 0; max-width: 100%; }
.lg-card .od-truncate { max-width: 260px; }
.lg-left, .lg-lock, .lg-edited { display: inline-flex; align-items: center; gap: 4px; }
.lg-left .num { color: var(--text-1); font-weight: var(--w-strong); }
.lg-edit { display: grid; gap: var(--s2); }
.lg-edit__t { min-height: 72px; }
.lg-edit__row { display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap; font-size: var(--fs-xs); color: var(--text-3); }
.lg-forever { margin: 0; display: flex; align-items: flex-start; gap: 6px; padding-inline: var(--s1); font-size: var(--fs-xs); line-height: 1.6; color: var(--text-3); --od-icon-size: 14px; }
.lg-forever .od-icon { margin-top: 2px; }

/* (a) the comment composer under a card */
.note-composer .composer__input { padding-inline-start: var(--s2); }
.note-hint { display: flex; align-items: center; justify-content: center; gap: 6px; max-width: var(--chat-col); margin: var(--s2) auto 0; font-size: var(--fs-xs); line-height: 1.5; color: var(--text-3); text-align: center; --od-icon-size: 13px; }

/* (b) the agent's page */
.lg-wrap--panel { gap: var(--s4); }
.lg-wrap--panel .lg-list { padding-inline: var(--s3); }
.lg-wrap--panel .lg-row { grid-template-columns: 24px minmax(0, 1fr); gap: 10px; }
.lg-wrap--panel .lg-row > .face, .lg-wrap--panel .lg-row > .lg-av, .lg-wrap--panel .lg-row > .lg-sys { width: 24px; height: 24px; }
.lg-wrap--panel .lg-line, .lg-wrap--panel .lg-note { font-size: var(--fs-sm); }
.lg-wrap--panel .lg-card .od-truncate { max-width: 170px; }

/* (c) the company page «سجل النشاط» */
.lgp { height: 100%; overflow-y: auto; }
.lgp-tools { display: flex; align-items: flex-end; flex-wrap: wrap; gap: var(--s3); padding: 0 var(--s8) var(--s5); }
.lgp-field { display: grid; gap: 6px; }
.lgp-field label { font-size: var(--fs-xs); line-height: var(--lh-ui); color: var(--text-2); }
.lgp-field .set-input { width: 240px; max-width: 100%; }
.lgp-clear { margin-bottom: 6px; }
.lgp-count { margin-inline-start: auto; padding-bottom: 8px; font-size: var(--fs-sm); color: var(--text-2); }
.lgp-body { display: grid; gap: var(--s6); max-width: 840px; padding: 0 var(--s8) var(--s12); }
.lgp-empty { align-items: flex-start; gap: var(--s2); padding: var(--s3); }

/* channels in the sidebar, above the conversations, each with its unread count */
.sb-label-row { display: flex; align-items: center; justify-content: space-between; gap: var(--s2); }
.sb-add {
  display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; margin: -6px 0 2px; flex: none;
  border-radius: var(--r-full); color: var(--text-2); --od-icon-size: 16px; transition: background-color var(--dur-fast) var(--ease-out);
}
@media (hover: hover) { .sb-add:hover { background: var(--bg-hover); color: var(--text-1); } }
.ch-item .od-icon { color: var(--text-3); --od-icon-size: 16px; }
.thread-item.is-unread .od-truncate { font-weight: var(--w-strong); }
.sb-unread {
  flex: none; min-width: 20px; height: 20px; padding: 0 6px; border-radius: var(--r-full);
  background: var(--primary); color: var(--on-primary); font-size: var(--fs-xs); font-weight: var(--w-strong);
  display: inline-flex; align-items: center; justify-content: center;
}

/* a channel: members talk to each other; agents answer only when called */
.hp-hash { width: 24px; height: 24px; flex: none; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; background: var(--bg-tertiary); color: var(--text-2); --od-icon-size: 14px; }
.hp-hash--lg { width: 28px; height: 28px; margin-top: 2px; }
.hp-hash--xl { width: 64px; height: 64px; --od-icon-size: 28px; color: var(--text-1); }
.turn--peer { align-items: flex-start; }
.bubble--peer { background: var(--bubble-agent); color: var(--text-1); border-end-start-radius: 6px; }
.sender__role { color: var(--text-3); }
.ch-intro {
  align-self: center; display: grid; justify-items: center; gap: 4px; max-width: 520px; padding: var(--s3) var(--s4);
  border-radius: var(--r-lg); box-shadow: var(--border-2) 0 0 0 0.5px inset; text-align: center;
  font-size: var(--fs-xs); line-height: 1.6; color: var(--text-2);
}
.ch-intro__h { font-size: var(--fs-base); font-weight: var(--w-strong); color: var(--text-1); }
.ch-intro p { margin: 0; display: inline-flex; align-items: flex-start; gap: 6px; text-align: start; --od-icon-size: 14px; color: var(--text-2); }
.ch-intro p .od-icon { margin-top: 2px; color: var(--text-3); }
.ch-intro__only { padding-top: 4px; border-top: 0.5px solid var(--border-2); }
.ch-you { color: var(--text-3); font-weight: var(--w-regular); }
.ch-who { margin: 0; padding-inline: var(--s3); }
.tm-hint + .tm-hint { border-top: 0; padding-top: 0; }
.tm-pick[aria-disabled="true"] { cursor: default; }
.tm-pick[aria-disabled="true"] .tm-check { background: var(--primary-disabled); }

/* mentions of me, at the top of «مستنيك» */
.mn-group { display: grid; gap: var(--s2); }
.mn-h { margin: 0; display: flex; align-items: center; gap: 6px; padding: 0 var(--s2); font-size: var(--fs-xs); font-weight: var(--w-strong); line-height: 1.6; color: var(--wait-text); --od-icon-size: 14px; }
.mn-sep { height: 0.5px; margin: var(--s1) var(--s2); background: var(--border-1); }
.mcard {
  display: grid; gap: 6px; width: 100%; padding: var(--s3) var(--s4); border-radius: var(--r-md);
  background: var(--bg-pane); box-shadow: var(--shadow-card); text-align: start; transition: box-shadow var(--dur-fast) var(--ease-out);
}
@media (hover: hover) { .mcard:hover { box-shadow: var(--border-2) 0 0 0 0.5px, var(--shadow-popover); } }
.mcard__top { display: flex; align-items: flex-start; gap: var(--s2); font-size: var(--fs-xs); line-height: 1.6; color: var(--text-2); }
.mcard__top > :first-child { margin-top: 1px; }
.mcard__who b { color: var(--text-1); }
.mcard__time { flex: none; color: var(--text-3); }
.mcard__q { font-size: var(--fs-sm); line-height: 1.6; color: var(--text-1); }

/* where a mention lands: a short ring, then nothing */
.is-spot { animation: spot 1.6s var(--ease-out); }
@keyframes spot { 0%, 45% { box-shadow: 0 0 0 2px var(--text-1); } 100% { box-shadow: 0 0 0 2px transparent; } }
@media (prefers-reduced-motion: reduce) { .is-spot { animation: none; box-shadow: 0 0 0 2px var(--text-1); } .lg-row.is-just { animation: none; } }

@media (max-width: 1023px) { .lgp-tools, .lgp-body { padding-inline: var(--s5); } }
@media (max-width: 599px) {
  .lgp-field { flex: 1 1 100%; }
  .lgp-field .set-input { width: 100%; }
  .lgp-count { margin-inline-start: 0; }
  .lg-list { padding-inline: var(--s3); }
}
/* ================= one system: alone or with a team ================= */
/* first run: a full-screen step inside the app frame, built from the same type, buttons and selectable rows */
.fr { width: 100vw; height: 100dvh; max-width: none; max-height: none; margin: 0; padding: 0; border: 0; background: var(--bg-chrome); color: var(--text-1); }
.fr::backdrop { background: var(--bg-chrome); }
.fr[open] { animation: fadeIn var(--dur) var(--ease-out); }
.fr.is-closing { animation: modalOut 190ms var(--ease-in) forwards; }
.fr__inner { display: grid; grid-template-rows: auto minmax(0, 1fr); height: 100%; }
.fr__bar { display: flex; align-items: center; gap: var(--s3); padding: var(--s4) var(--s6); border-bottom: 0.5px solid var(--border-3); }
.fr__bar .lg-sys { flex: none; }
.fr__proto { flex: none; align-self: center; }
.fr__body { display: flex; flex-direction: column; align-items: center; overflow-y: auto; min-height: 0; overscroll-behavior: contain; padding: var(--s12) var(--s6) var(--s16); }
.fr__col { width: min(640px, 100%); margin-block: auto; display: grid; gap: var(--s6); }
.fr__col > * { animation: rise var(--dur-slow) var(--ease-out) both; }
.fr__col > :nth-child(2) { animation-delay: 40ms; }
.fr__col > :nth-child(3) { animation-delay: 80ms; }
.fr__head { display: grid; gap: var(--s2); }
.fr__eyebrow { margin: 0; font-size: var(--fs-sm); line-height: var(--lh-ui); color: var(--text-3); }
.fr__title { margin: 0; font-size: var(--fs-xl); line-height: 1.4; }
.fr__sub { margin: 0; font-size: var(--fs-base); line-height: var(--lh-ar); color: var(--text-2); max-width: 60ch; }
.fr__back { justify-self: start; margin-inline-start: -6px; margin-bottom: var(--s1); }
.fr__choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s3); }
.fr-choice { gap: var(--s1); padding: var(--s5); padding-inline-end: 44px; align-content: start; }
.fr-choice .cr-kind__check { top: var(--s5); inset-inline-end: var(--s4); }
.fr-choice .cr-kind__t { font-size: var(--fs-msg); }
.fr-art { display: flex; align-items: center; gap: var(--s2); margin-bottom: var(--s3); color: var(--text-3); --od-icon-size: 14px; }
.fr-ppl { display: inline-flex; flex: none; }
.fr-ppl > .me__av { box-shadow: 0 0 0 2px var(--bg-pane); }
.fr-ppl > * + * { margin-inline-start: -8px; }
.fr-art__plus { display: inline-flex; flex: none; }
.fr__actions { display: flex; align-items: center; justify-content: flex-end; gap: var(--s3); padding-top: var(--s2); }
.fr__hint { flex: 1 1 0; font-size: var(--fs-xs); line-height: var(--lh-ui); color: var(--text-3); }
.fr__actions .btn { min-width: 120px; }
.fr-rows { display: grid; gap: var(--s4); }
.fr-row { display: grid; grid-template-columns: minmax(0, 1fr) 168px 36px; gap: var(--s3); align-items: start; }
.fr-row__rm { margin-top: 23px; }
.fr-row__rm.od-spacer { display: block; width: 36px; height: 36px; }
.fr-add { margin-inline-start: -6px; }
.fr-roles { margin: 0; display: grid; gap: var(--s1); padding: var(--s3) var(--s4); border-radius: var(--r-md); background: var(--bg-pane); border: 0.5px solid var(--border-3); }
.fr-roles__r { display: flex; gap: var(--s3); font-size: var(--fs-sm); line-height: 1.6; }
.fr-roles dt { flex: none; min-width: 64px; font-weight: var(--w-strong); color: var(--text-1); }
.fr-roles dd { margin: 0; color: var(--text-2); }
@media (max-width: 639px) {
  .fr__bar { padding-inline: var(--s4); }
  .fr__body { padding: var(--s8) var(--s4) var(--s12); }
  .fr__choices { grid-template-columns: minmax(0, 1fr); }
  .fr-row { grid-template-columns: minmax(0, 1fr) 36px; }
  .fr-row > .set-field:first-child { grid-column: 1; grid-row: 1; }
  .fr-row > .set-field:nth-child(2) { grid-column: 1; grid-row: 2; }
  .fr-row__rm { grid-column: 2; grid-row: 1; }
  .fr__actions .btn { flex: 1 1 0; min-width: 0; }
}
@media (prefers-reduced-motion: reduce) { .fr[open], .fr__col > * { animation: none; } }

/* «الفريق» alone: just you, «اعزم عضو», and the one line on what inviting turns on */
.modal.team-dlg.team-dlg--solo { width: min(600px, calc(100vw - 32px)); }
.ta--solo { display: grid; gap: var(--s5); }
.ta:not(.ta--solo) .inv-sec { margin-top: var(--s5); }
.inv-sec { display: grid; gap: var(--s2); }
.inv-sec .dp-label { padding-inline-start: 0; }
.inv { display: grid; gap: var(--s2); }
.inv-row { display: grid; grid-template-columns: minmax(0, 1fr) 148px auto; gap: var(--s2); align-items: start; }
.inv-go { margin-top: 23px; min-width: 88px; }
.inv-open { justify-self: start; --od-icon-size: 16px; }
.inv-note { margin: 0; display: flex; align-items: flex-start; gap: var(--s2); padding: var(--s3); border-radius: var(--r-md); border: 1px dashed var(--border-2); font-size: var(--fs-sm); line-height: 1.6; color: var(--text-2); --od-icon-size: 16px; }
.inv-note .od-icon { flex: none; margin-top: 3px; color: var(--text-3); }
.ta-pending { justify-self: start; margin-top: 4px; height: 20px; --od-icon-size: 12px; color: var(--text-2); }
@media (max-width: 639px) { .inv-row { grid-template-columns: minmax(0, 1fr); } .inv-go { margin-top: 0; justify-self: start; } }
/* ================= settings in one place · company knowledge · learning ================= */
/* memory: which member a note came from, and the line to company knowledge */
.mem-by { display: inline-flex; align-items: center; gap: 4px; color: var(--text-2); }
.mem-by .me__av { font-size: 10px; }
.mem-know { margin: 0; padding-inline: var(--s3); display: flex; flex-wrap: wrap; align-items: flex-start; gap: 6px; font-size: var(--fs-sm); line-height: 1.6; color: var(--text-2); --od-icon-size: 16px; }
.mem-know > .od-icon { flex: none; margin-top: 3px; color: var(--text-3); }
.mem-know > span { flex: 1 1 200px; min-width: 0; }
.mem-know .link-btn { margin-inline-start: -6px; }
/* company knowledge */
.know-vs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s3); }
.know-vs__c { display: grid; gap: 6px; align-content: start; padding: var(--s4); border-radius: var(--r-md); background: var(--bg-pane); border: 0.5px solid var(--border-3); }
.know-vs__c b { display: flex; align-items: center; gap: var(--s2); font-size: var(--fs-base); --od-icon-size: 18px; }
.know-vs__c p { margin: 0; font-size: var(--fs-sm); line-height: 1.6; color: var(--text-2); }
.know-vs__c .link-btn { justify-self: start; margin-inline-start: -6px; }
.know-tabs { --od-rail-pad: 0px; padding-block: 2px; margin-bottom: calc(var(--s2) * -1); }
.know-page { display: grid; gap: var(--s3); padding: var(--s5); border-radius: var(--r-lg); background: var(--bg-pane); border: 0.5px solid var(--border-3); }
.know-page__top { display: flex; align-items: center; gap: var(--s3); }
.know-page__h { margin: 0; flex: 1 1 0; min-width: 0; font-size: var(--fs-lg); line-height: 1.5; }
.know-page__top .btn { --od-icon-size: 15px; }
.know-meta { margin: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: var(--fs-xs); line-height: var(--lh-ui); color: var(--text-3); }
.know-meta .me__av { font-size: 10px; }
.know-body { display: grid; gap: var(--s2); padding-top: var(--s3); border-top: 0.5px solid var(--border-2); font-size: var(--fs-msg); line-height: var(--lh-ar); color: var(--text-1); }
.know-body p { margin: 0; }
.know-ul { margin: 0; padding-inline-start: var(--s5); display: grid; gap: var(--s1); }
.know-ta { min-height: 300px; font-size: var(--fs-msg); }
/* learning */
.cr-kind[aria-disabled="true"] { cursor: default; }
.ln-ag { flex-wrap: wrap; }
.ln-seg { flex: none; width: 260px; }
.ln-rules { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s3); }
.ln-rule { padding: var(--s4); gap: var(--s2); }
.ln-rule b { display: flex; align-items: center; gap: var(--s2); font-size: var(--fs-base); --od-icon-size: 18px; }
.ln-rule ul { margin: 0; padding-inline-start: var(--s5); font-size: var(--fs-sm); line-height: 1.7; color: var(--text-1); }
.ln-rule .set-hint { margin: 0; }
.ln-list { gap: 0; }
.ln-row { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: var(--s3); padding: var(--s3) var(--s2); position: relative; border-radius: var(--r-sm); }
.ln-row + .ln-row::before { content: ""; position: absolute; top: 0; inset-inline: var(--s2); height: 0.5px; background: var(--border-2); }
.ln-row.is-spot { animation: spot 1.6s var(--ease-out); }
.ln-ic { width: 32px; height: 32px; flex: none; border-radius: var(--r-sm); background: var(--bg-tertiary); display: inline-flex; align-items: center; justify-content: center; color: var(--text-2); --od-icon-size: 16px; }
.ln-body { display: grid; gap: 4px; min-width: 0; }
.ln-t { margin: 0; font-size: var(--fs-sm); line-height: var(--lh-ar); color: var(--text-1); overflow-wrap: anywhere; }
.ln-row.is-off .ln-t { color: var(--text-3); text-decoration: line-through; }
.ln-meta { margin: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; font-size: var(--fs-xs); line-height: var(--lh-ui); color: var(--text-3); }
.ln-meta .badge { height: 20px; --od-icon-size: 12px; }
.ln-who { display: inline-flex; align-items: center; gap: 4px; color: var(--text-2); }
.ln-conv { max-width: 260px; padding-block: 0; font-size: var(--fs-xs); color: var(--text-2); }
.ln-acts { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2); margin-top: 4px; }
.ln-acts .link-btn { margin-inline-start: -6px; }
.ln-acts .btn + .link-btn { margin-inline-start: 0; }
.sk-learned { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin-top: 2px; font-size: var(--fs-xs); line-height: 1.5; color: var(--text-2); --od-icon-size: 12px; }
.sk-learned .link-btn { font-size: var(--fs-xs); padding-block: 0; }
.sk-who { display: flex; align-items: center; gap: var(--s2); margin-top: calc(var(--s3) * -1); font-size: var(--fs-sm); color: var(--text-2); }
.sk-diff { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s3); }
.sk-diff--one { grid-template-columns: minmax(0, 1fr); }
.sk-col { display: grid; gap: var(--s3); align-content: start; padding: var(--s4) var(--s5); border-radius: var(--r-lg); background: var(--bg-pane); border: 0.5px solid var(--border-3); }
.sk-col.is-cur { box-shadow: var(--text-1) 0 0 0 1px inset; }
.sk-col h4 { margin: 0; font-size: var(--fs-sm); font-weight: var(--w-regular); color: var(--text-2); }
.sk-col ol { margin: 0; padding-inline-start: var(--s5); display: grid; gap: var(--s3); font-size: var(--fs-sm); line-height: var(--lh-ar); color: var(--text-1); }
.sk-col li.is-gone { color: var(--text-3); text-decoration: line-through; }
.sk-col li.is-new { font-weight: var(--w-strong); }
.sk-tag { display: inline-flex; align-items: center; height: 20px; padding: 0 6px; margin-inline-end: 6px; border-radius: var(--r-full); background: var(--bg-tertiary); font-size: var(--fs-xs); font-weight: var(--w-strong); color: var(--text-1); text-decoration: none; vertical-align: 1px; }
.sk-tag--new { background: var(--primary); color: var(--on-primary); }
.sk-why { display: grid; gap: 4px; padding: var(--s3) var(--s4); border-radius: var(--r-md); border: 1px dashed var(--border-2); }
.sk-why b { font-size: var(--fs-sm); }
.sk-why p { margin: 0; font-size: var(--fs-sm); line-height: var(--lh-ar); color: var(--text-2); }
.sk-acts { display: flex; flex-wrap: wrap; gap: var(--s2); }
.sk-acts .btn { --od-icon-size: 15px; }
/* the change-proposal card uses the proposal card system */
.chg-card .kv__row { grid-template-columns: 104px minmax(0, 1fr); }
.lg-link { font-size: var(--fs-xs); padding-block: 0; --od-icon-size: 12px; }
/* usage */
.use-seg { padding: 0; }
.use-kpis { --od-cols: 3; }
.use-kpis .kpi__val bdi { font-size: inherit; }
.use-list { gap: 0; }
.use-row { display: grid; grid-template-columns: minmax(150px, 1.1fr) minmax(0, 2fr) minmax(112px, auto); gap: var(--s4); align-items: center; padding: var(--s3) var(--s2); position: relative; }
.use-row + .use-row::before { content: ""; position: absolute; top: 0; inset-inline: var(--s2); height: 0.5px; background: var(--border-2); }
.use-who { display: flex; align-items: center; gap: var(--s2); min-width: 0; }
.use-bar { height: 8px; }
.use-num { text-align: end; font-size: var(--fs-sm); white-space: nowrap; }
.use-num > :last-child { font-size: var(--fs-xs); color: var(--text-3); }
[dir="ltr"] .use-bar .bar__fill, [dir="ltr"] .bk-run .bar__fill { transform-origin: left center; }
/* backups */
.bk-now { flex-direction: row; align-items: center; gap: var(--s3); padding: var(--s4); flex-wrap: wrap; }
.bk-run { display: grid; gap: 6px; width: 200px; }
.bk-run__t { font-size: var(--fs-sm); color: var(--text-2); }
@media (max-width: 767px) {
  .know-vs, .ln-rules, .sk-diff { grid-template-columns: minmax(0, 1fr); }
  .ln-seg { width: 100%; }
  .use-kpis { --od-cols: 1; }
  .use-row { grid-template-columns: minmax(0, 1fr) auto; }
  .use-row .use-bar { grid-column: 1 / -1; grid-row: 2; }
  .bk-run { width: 100%; }
}
/* ================= settings overlay · structure after T3 Code's settings (this file's tokens and fonts) ================= */
/* the window: about two-thirds of the screen, centred and rounded, over the dimmed app; full screen on a phone */
.sov {
  --sov-nav-w: 240px; --sov-col: 848px;
  width: min(1280px, max(66.67vw, 1100px), calc(100vw - 48px)); height: min(940px, calc(100dvh - 64px)); max-width: none; max-height: none;
  margin: auto; inset: 0; padding: 0; border: 0; border-radius: var(--r-lg); background: var(--bg-chrome); color: var(--text-1);
  box-shadow: var(--shadow-modal); overflow: hidden;
}
.sov::backdrop { background: var(--bg-scrim); }
.sov[open] { animation: sovIn var(--dur) var(--ease-out); }
@keyframes sovIn { from { opacity: 0; transform: translateY(6px) scale(.99); } }
.sov.is-closing { animation: modalOut 190ms var(--ease-in) forwards; }
.sov__inner { display: grid; grid-template-columns: var(--sov-nav-w) minmax(0, 1fr); height: 100%; min-height: 0; }

/* sidebar: search with the «/» key, small group labels, line icons */
.sov-nav { display: grid; grid-template-rows: auto auto minmax(0, 1fr); min-height: 0; background: var(--bg-sidebar); border-inline-end: 0.5px solid var(--border-3); }
.sov-nav__head { display: none; }
.sov-search { position: relative; display: flex; align-items: center; margin: var(--s3) var(--s3) var(--s2); }
.sov-search > .od-icon { position: absolute; inset-inline-start: 10px; --od-icon-size: 16px; color: var(--text-3); pointer-events: none; }
.sov-search input {
  width: 100%; height: 36px; padding-inline: 34px 36px; border-radius: var(--r-sm); border: 0.5px solid var(--border-2);
  background: var(--bg-pane); color: var(--text-1); font-size: var(--fs-base); outline: none;
  transition: border-color var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out);
}
.sov-search input::placeholder { color: var(--text-4); opacity: 1; }
.sov-search input:focus { border-color: var(--border-1); box-shadow: 0 0 0 3px var(--bg-active); }
.sov-kbd {
  position: absolute; inset-inline-end: 8px; min-width: 22px; height: 22px; padding: 0 6px; border-radius: var(--r-xs);
  border: 0.5px solid var(--border-2); background: var(--bg-chrome); font: 12px/21px var(--font-mono); color: var(--text-3); text-align: center; pointer-events: none;
}
.sov-search input:not(:placeholder-shown) ~ .sov-kbd { display: none; }
.sov-nav__list { display: flex; flex-direction: column; gap: 2px; overflow-y: auto; min-height: 0; padding: var(--s1) var(--s3) var(--s6); }
.sov-nav__g { margin: var(--s4) 0 var(--s1); padding-inline: var(--s3); font-size: var(--fs-xs); line-height: var(--lh-ui); color: var(--text-3); }
.sov-nav__g:first-child { margin-top: var(--s1); }
.sov-nav__gap { display: block; height: var(--s4); flex: none; }
.sov-nav .sb-item { flex: none; height: 34px; font-size: var(--fs-sm); }
.sov-nav .sb-item .od-icon { --od-icon-size: 17px; }
.sov-nav__hit { display: block; width: 100%; flex: none; padding: 3px var(--s3); padding-inline-start: 41px; border-radius: var(--r-xs); font-size: var(--fs-xs); line-height: var(--lh-ui); color: var(--text-2); text-align: start; }
@media (hover: hover) { .sov-nav__hit:hover { background: var(--bg-hover); color: var(--text-1); } }
.sov-nav__empty { display: flex; align-items: center; gap: var(--s2); margin: var(--s2) 0 0; padding: var(--s3); font-size: var(--fs-sm); color: var(--text-3); --od-icon-size: 16px; }

/* the content side: header (breadcrumb, page actions, close) over one scrolling column */
.sov-col { display: grid; grid-template-rows: auto minmax(0, 1fr); min-width: 0; min-height: 0; }
.sov-bar { display: flex; align-items: center; gap: var(--s2); min-height: 56px; padding-block: var(--s2); padding-inline: var(--s6) var(--s3); border-bottom: 0.5px solid var(--border-3); }
.sov-crumbs { min-width: 0; }
.sov-crumbs ol { display: flex; align-items: center; gap: var(--s2); margin: 0; padding: 0; list-style: none; min-width: 0; font-size: var(--fs-base); line-height: 1.5; }
.sov-crumbs li { display: flex; align-items: center; gap: var(--s2); min-width: 0; color: var(--text-3); white-space: nowrap; }
.sov-crumbs li + li::before { content: "/"; color: var(--text-4); }
.sov-crumb__btn { padding: 2px 6px; margin-inline: -6px; border-radius: var(--r-xs); color: var(--text-2); white-space: nowrap; transition: background-color var(--dur-fast) var(--ease-out); }
@media (hover: hover) { .sov-crumb__btn:hover { background: var(--bg-hover); color: var(--text-1); } }
.sov-crumb__cur { margin: 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: var(--fs-base); font-weight: var(--w-strong); line-height: 1.5; color: var(--text-1); }
.sov-crumb__cur:focus { outline: none; }
.sov-x { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; flex: none; border-radius: var(--r-full); color: var(--text-2); --od-icon-size: 18px; transition: background-color var(--dur-fast) var(--ease-out); }
@media (hover: hover) { .sov-x:hover { background: var(--bg-hover); color: var(--text-1); } }
.sov-bar__back { display: none; }
.sov-ro { align-self: center; --od-icon-size: 13px; color: var(--text-2); white-space: nowrap; }
.sov-bar .sr-sel .sr-select { width: 152px; }
.sov-main { position: relative; overflow-y: auto; min-height: 0; overscroll-behavior: contain; }
.sov-page { width: min(var(--sov-col), 100%); margin-inline: auto; padding: var(--s8) var(--s6) var(--s16); display: flex; flex-direction: column; gap: var(--s8); }
.sov-savebar { position: sticky; bottom: var(--s4); z-index: 2; width: min(calc(var(--sov-col) - 48px), calc(100% - 32px)); margin: calc(var(--s12) * -1) auto var(--s4); border: 0.5px solid var(--border-2); border-radius: var(--r-lg); box-shadow: var(--shadow-popover); }

/* a section: one heading over one card; add buttons and status sit on the heading */
.sx { display: flex; flex-direction: column; gap: var(--s3); scroll-margin-top: var(--s4); }
.sx-head { display: flex; align-items: center; flex-wrap: wrap; gap: var(--s2); min-height: 32px; padding-inline: 2px; }
.sx-h { margin: 0; font-size: var(--fs-msg); font-weight: var(--w-strong); line-height: 1.5; color: var(--text-1); }
.sx-h__who { display: inline-flex; align-items: center; gap: var(--s2); }
.sx-n { font-size: var(--fs-sm); color: var(--text-3); }
.sx-add { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: var(--r-sm); color: var(--text-2); --od-icon-size: 16px; }
.sx-add-t { display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 var(--s2); border-radius: var(--r-sm); font-size: var(--fs-sm); color: var(--text-2); --od-icon-size: 15px; white-space: nowrap; }
@media (hover: hover) { .sx-add:hover, .sx-add-t:hover { background: var(--bg-hover); color: var(--text-1); } }
.sx-check { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 var(--s2); border-radius: var(--r-sm); font-size: var(--fs-xs); color: var(--text-3); --od-icon-size: 14px; white-space: nowrap; }
@media (hover: hover) { .sx-check:hover { background: var(--bg-hover); color: var(--text-1); } }
.sx-check.is-busy .od-icon { animation: spin 900ms linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.sx-seg { padding: 0; gap: 2px; }
.sx-seg button { white-space: nowrap; }
.sx-seg .num { color: var(--text-3); }
.sx-card { position: relative; display: flex; flex-direction: column; border-radius: var(--r-md); background: var(--bg-pane); border: 0.5px solid var(--border-2); }
.sx-card > * + *, .sr-adv__body > * + *, .prv-models > * + * { border-top: 0.5px solid var(--border-3); }
.sx-card > :first-child { border-start-start-radius: inherit; border-start-end-radius: inherit; }
.sx-card > :last-child { border-end-start-radius: inherit; border-end-end-radius: inherit; }
.sx-card--pad { padding: var(--s4); }
.sx-card--wait { border-color: var(--wait-bg); background: var(--wait-bg); }

/* a row: its name on the start side, one control on the end side, all controls on one end rail */
.sr { display: flex; align-items: center; gap: var(--s3); width: 100%; min-height: 60px; padding: var(--s3) var(--s4); text-align: start; color: var(--text-1); position: relative; }
.sr-name { flex: 1 1 0; min-width: 0; display: grid; gap: 2px; align-content: center; }
.sr-name > * { display: block; }
.sr-t { display: flex !important; align-items: center; gap: 6px; min-width: 0; font-size: var(--fs-base); line-height: 1.5; color: var(--text-1); }
.sr-l { min-width: 0; overflow-wrap: anywhere; }
.sr-d { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: var(--fs-xs); line-height: 1.5; color: var(--text-3); }
.sr-err { font-size: var(--fs-xs); line-height: 1.5; color: var(--danger-text); }
.sr-ctl { flex: none; display: flex; align-items: center; justify-content: flex-end; gap: var(--s2); max-width: 64%; min-width: 0; }
.sr-val { display: inline-flex; align-items: center; gap: 6px; min-width: 0; font-size: var(--fs-sm); line-height: 1.5; color: var(--text-2); text-align: end; --od-icon-size: 15px; }
.sr-val--wait { color: var(--wait-text); }
.sr-val__t { display: inline; min-width: 0; }
.sr-num { font-size: var(--fs-base); font-weight: var(--w-strong); color: var(--text-1); white-space: nowrap; }
.sr-ic { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; flex: none; color: var(--text-2); --od-icon-size: 18px; }
.sr-dot { width: 8px; height: 8px; margin-inline: 4px 2px; }
.sr-chev { color: var(--text-3); --od-icon-size: 16px; }
.sr-check { color: var(--text-1); --od-icon-size: 18px; }
.sr--link { cursor: pointer; transition: background-color var(--dur-fast) var(--ease-out); }
@media (hover: hover) { .sr--link:hover { background: var(--bg-hover); } }
.sr--link[aria-checked="true"] { background: var(--bg-active); }
.sr--stack { flex-direction: column; align-items: stretch; gap: var(--s2); }
.sr--stack .sr-ctl { max-width: none; justify-content: stretch; }
.sr--stack .sr-ctl > * { flex: 1 1 auto; }
.sr--sub { min-height: 0; padding-block: var(--s2); padding-inline-start: var(--s8); }
.sr--sub .sr-t { font-size: var(--fs-sm); }
.sr--news .sr-t b { font-weight: var(--w-strong); }
.sr--news .sr-d { white-space: normal; }
.sr-text { margin: 0; font-size: var(--fs-sm); line-height: var(--lh-ar); color: var(--text-1); overflow-wrap: anywhere; }
.sr-block { padding: var(--s4); }
.sr.is-spot, .sx.is-spot, .prv-row.is-spot { animation: spot 1.6s var(--ease-out); }
.sr.is-flash { animation: flash 1.4s var(--ease-out); }
.sr .badge { height: 20px; }

/* controls on the rail */
.sr-in {
  display: block; width: 240px; height: 32px; padding: 0 10px; border-radius: var(--r-sm); border: 0.5px solid var(--border-2);
  background: var(--bg-chrome); color: var(--text-1); font-size: var(--fs-sm); outline: none;
  transition: border-color var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out);
}
.sr-in:focus { border-color: var(--border-1); box-shadow: 0 0 0 3px var(--bg-active); }
.sr-in::placeholder { color: var(--text-4); opacity: 1; }
.sr-in[aria-invalid="true"] { border-color: var(--danger-text); }
.sr-ta { width: 100%; height: auto; min-height: 84px; padding: var(--s2) 10px; line-height: var(--lh-ar); resize: vertical; }
.sr-ta--tall { min-height: 140px; }
.know-ta { min-height: 320px; font-size: var(--fs-msg); }
.sr-sel { position: relative; display: inline-flex; align-items: center; flex: none; }
.sr-select {
  appearance: none; -webkit-appearance: none; width: 200px; height: 32px; padding-inline: 10px 30px; border-radius: var(--r-sm);
  border: 0.5px solid var(--border-2); background: var(--bg-chrome); color: var(--text-1); font-size: var(--fs-sm); cursor: pointer; outline: none; text-overflow: ellipsis;
}
.sr-select:focus-visible { border-color: var(--border-1); box-shadow: 0 0 0 3px var(--bg-active); outline: 2px solid var(--focus); outline-offset: 1px; }
.sr-select:disabled { color: var(--text-4); cursor: default; }
.sr-sel > .od-icon { position: absolute; inset-inline-end: 9px; --od-icon-size: 15px; color: var(--text-3); pointer-events: none; }
#set-ck-time + .od-icon { inset-inline-end: 9px; }
.sr-sel:has(#set-ck-time) .sr-select { width: 120px; }
.sr-seg { padding: 2px; width: 300px; }
.sr-seg button { display: inline-flex; align-items: center; justify-content: center; gap: 6px; --od-icon-size: 15px; }
.mono { font-family: var(--font-mono); font-size: 0.95em; }

/* Advanced: rarely used settings fold at the bottom of their own card */
.sr-adv > summary { list-style: none; cursor: pointer; min-height: 52px; color: var(--text-2); }
.sr-adv > summary::-webkit-details-marker { display: none; }
.sr-adv > summary .sr-t { color: var(--text-2); font-size: var(--fs-sm); }
@media (hover: hover) { .sr-adv > summary:hover { background: var(--bg-hover); } }
.sr-adv__chev { color: var(--text-3); --od-icon-size: 16px; transition: transform var(--dur) var(--ease-out); }
.sr-adv[open] .sr-adv__chev { transform: rotate(180deg); }
.sr-adv[open] > .sr-adv__body { border-top: 0.5px solid var(--border-3); }
.sx-card > .sr-adv:last-child > summary, .prv-detail > .sr-adv:last-child > summary { border-end-start-radius: var(--r-md); border-end-end-radius: var(--r-md); }
.sx-card > .sr-adv[open]:last-child > summary { border-radius: 0; }

/* empty state: an icon and one line */
.sr-empty { display: flex; align-items: center; gap: var(--s3); padding: var(--s5) var(--s4); font-size: var(--fs-sm); line-height: 1.5; color: var(--text-3); --od-icon-size: 18px; }

/* status: colour only for a problem, a red dot and a short word */
.dot--bad { background: var(--danger-text); }
.st-bad { display: inline-flex; align-items: baseline; gap: 6px; color: var(--danger-text); }
.st-bad .dot { align-self: center; flex: none; }
.st-bad .dot { width: 7px; height: 7px; }

/* ⓘ tips */
.tip-btn { position: relative; display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; flex: none; border-radius: var(--r-full); color: var(--text-3); --od-icon-size: 15px; }
.tip-btn::before { content: ""; position: absolute; inset: -12px; }
.tip-btn[aria-expanded="true"] { color: var(--text-1); }
@media (hover: hover) { .tip-btn:hover { color: var(--text-1); } }
.sov-tip {
  position: fixed; z-index: 60; max-width: min(300px, calc(100vw - 32px)); padding: var(--s2) var(--s3); border-radius: var(--r-sm);
  background: var(--primary); color: var(--on-primary); font-size: var(--fs-sm); line-height: 1.6; box-shadow: var(--shadow-popover);
  pointer-events: none; animation: tipIn var(--dur-fast) var(--ease-out); text-wrap: pretty;
}
@keyframes tipIn { from { opacity: 0; transform: translateY(2px); } }

/* ⋯ menus */
.sx-mw { position: relative; display: inline-flex; }
.sx-more { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: var(--r-sm); color: var(--text-2); --od-icon-size: 18px; }
@media (hover: hover) { .sx-more:hover { background: var(--bg-hover); color: var(--text-1); } }
.sx-more[aria-expanded="true"] { background: var(--bg-active); color: var(--text-1); }
.sx-menu { top: calc(100% + 4px); bottom: auto; inset-inline-start: auto; inset-inline-end: 0; width: 220px; display: block; }
.sx-menu .menu__item[aria-disabled="true"] { color: var(--text-4); cursor: default; }
.sx-menu .menu__item[aria-disabled="true"] > .od-icon { color: var(--text-4); }

/* agent page */
.sov-tabs { justify-content: flex-start; padding: 0; margin-bottom: calc(var(--s4) * -1); }
.sov-agent-panel { display: flex; flex-direction: column; gap: var(--s8); }
.sov-badge { display: inline-flex; height: 20px; font-weight: var(--w-regular); color: var(--text-2); }
.sov-ag { min-height: 60px; }
.sov-mem { padding: 0; gap: var(--s6); }
.sov-mem .mem-intro, .sov-mem .mem-know { display: none; }
.sov-mem .dp-label { padding-inline: 2px; font-size: var(--fs-msg); font-weight: var(--w-strong); color: var(--text-1); }
.vc-play { flex: none; --od-icon-size: 14px; }
.sov .sk-learned { margin-top: 0; }

/* members: the members × agents matrix, columns aligned */
.mx-wrap { padding: var(--s2) var(--s4) var(--s1); }
.mx-table thead th:not(:first-child), .mx-table td { text-align: center; }
.mx-table .ta-ag { flex-direction: column; gap: 4px; font-size: var(--fs-xs); }
.mx-table th[scope="row"] { min-width: 180px; }
.mx-table td .switch { vertical-align: middle; }
