# gtmworks's colour tokens (DESIGN.md frontmatter) as a Hermes dashboard theme, for Probe B of spec #822 (#827). The
# Engine reads it from <home>/dashboard-themes/*.yaml (hermes_cli/web_server_dashboard.py, _discover_user_themes) and
# `dashboard.theme: gtmworks` makes it the default. Neutral greys only, as DESIGN.md's Neutral Canvas Rule asks.
name: gtmworks
label: gtmworks
description: gtmworks's neutral canvas, ink and graphite.
palette:
  background: "#fafafa"
  midground: "#262626"
  foreground: { hex: "#ffffff", alpha: 0 }
  warmGlow: "rgba(0, 0, 0, 0)"
  noiseOpacity: 0
typography:
  fontSans: '"InterVariable", "Inter", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif'
layout:
  radius: 8px
colorOverrides:
  card: "#ffffff"
  cardForeground: "#262626"
  popover: "#ffffff"
  popoverForeground: "#262626"
  primary: "oklch(0.205 0 0)"
  primaryForeground: "oklch(0.985 0 0)"
  secondary: "#eeeeee"
  secondaryForeground: "#262626"
  muted: "#eeeeee"
  mutedForeground: "#5c5c5c"
  accent: "#eeeeee"
  accentForeground: "#202020"
  border: "#dedede"
  input: "#dedede"
  ring: "oklch(0.708 0 0)"
