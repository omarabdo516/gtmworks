# The machine and the images every install area starts from (#406, #411), written once so the `install` matrix and the
# `install-measure` job cannot drift apart: one isolated Docker machine for the area alone, the Docker Hub images the
# install pulls served from a mirror beside it (#608), and the app and work sandbox images the run's `image` job made,
# loaded into that machine under the tags a source install names.
name: Install machine
description: Start the isolated Docker machine an install area runs on and load the run's images into it.
inputs:
  sandbox-key:
    description: The Actions cache key of the work sandbox image, the image job's `sandbox-key` output.
    required: true
runs:
  using: composite
  steps:
    # The pinned Docker Hub images the install pulls (Postgres, the API, the proxy, the Engine and the checks' helpers)
    # come through a pull-through mirror whose storage the Actions cache keeps under their list's key (#608), which the
    # `install-images` job fills; the machine pulls through it as from the registry, so every digest pin holds, and on a
    # miss it pulls from the registry as before.
    - name: the upstream images key
      id: upstream
      shell: bash
      run: echo "key=$(bash scripts/ci-install-machine.sh key)" >> "$GITHUB_OUTPUT"
    - name: restore the upstream images
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/install-mirror
        key: ${{ steps.upstream.outputs.key }}
    # One isolated Docker machine for this area alone, with the mirror as its registry mirror: the area of
    # scripts/ci-install-check.sh the job names runs on it, and the job's last step removes both, also after a failure,
    # on a runner that is reused.
    - name: start the isolated Docker machine
      shell: bash
      run: bash scripts/ci-install-machine.sh start "$RUNNER_TEMP/install-mirror"
    # The image the run built once (#403), loaded under the tag the source install's compose file names.
    - name: download the image
      uses: actions/download-artifact@v4
      with:
        name: gtmworks-image
        path: ${{ runner.temp }}
    # The work sandbox image (#392), kept in the Actions cache under its files' hash by the image job (#608): the cache
    # restores it several times faster than an artifact of its size downloads, and the image job builds it only when
    # those files change. It is there whenever the image job succeeded, so a miss is a fault, not a reason to build.
    - name: restore the work sandbox image
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/gtmworks-sandbox-image.tar
        key: ${{ inputs.sandbox-key }}
        fail-on-cache-miss: true
    # The app image under the tag the compose file's `web` service names (#411), read from it, so a tag change there is
    # the one place to make it: a hard-coded tag would leave the install building its own image silently. The work
    # sandbox image keeps the tag a source install's work sandbox names (scripts/install.sh work_sandbox_tag), so the
    # install builds no sandbox image either. The two load at once.
    - name: load the images
      shell: bash
      run: |
        web_image=$(sed -n '/^  web:$/,/^  [a-z]/s/^    image: //p' docker-compose.install.yml | head -n 1)
        docker --host tcp://127.0.0.1:2375 load --input "$RUNNER_TEMP/gtmworks-image.tar" & app=$!
        docker --host tcp://127.0.0.1:2375 load --input "$RUNNER_TEMP/gtmworks-sandbox-image.tar" & sandbox=$!
        wait "$app"; wait "$sandbox"
        docker --host tcp://127.0.0.1:2375 tag gtmworks:ci "$web_image"
