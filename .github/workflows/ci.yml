# As Hermes and T3 Code run CI (#76): the first job (`changes`, scripts/ci-areas.mjs) decides which suites a change
# needs. The fast job (lint, types, catalogues, unit tests and the screen component tests, #258) runs on every change;
# its component tests run when the app, its components or its library change. The database tests, the whole-app browser
# suite (`integration`) and the Docker install run on a pull request only when their own files change, and a draft runs
# what a ready pull request runs (Omar, 2026-11-19, #405): the suites start on a draft as on a ready one, and marking a
# draft ready starts nothing by itself. The app image is built once per run by its own job, and the browser suite and the
# install proof load that build instead of building their own (#403, #406). The install proof is one job, one matrix
# entry per area, each on a fresh isolated Docker machine of its own (#406). The profile-size measurement
# (`install-measure`) is no check a pull request needs: it runs on a push to main and on a manual run only, like the
# visual lane (#408). The visual lane's key screens and the measured navigation budgets (`visual`) run on a push to main
# and on a manual run only, never on a pull request, and `check` does not wait for them
# (Omar, 2026-11-17, #257): a failure on main opens or updates one issue labelled visual-regression. A push to main runs
# every suite unless every file is a document; a manual run starts the browser and install suites only through inputs that
# default to off. Required `check` (scripts/ci-verdict.mjs) counts a suite nobody asked for as passed when it was
# skipped, and is red on any failed or cancelled stage.
# Every job runs on a GitHub-hosted ubuntu-latest runner (decision 0038, #334); the measured navigation budgets need a
# machine no other job shares. The stack's ports lie in Linux's range for outgoing connections, so a job reserves them
# before it starts the stack (#225).
# The visual lane (#257) compares twelve key screens in Arabic, light and dark, drawn by one browser pinned by
# digest (tests/visual-lane/renderer) so every runner makes the same bytes.
name: CI

on:
  pull_request:
    # A draft runs what a ready pull request runs (#405): marking one ready starts nothing, so no ready_for_review type.
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      e2e:
        description: Run the whole-app browser suite
        type: boolean
        default: false
      install:
        description: Run the Docker install, update and release checks
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    # 0.2 min measured on run 44636876755: 3 min is 1.5 times it, floored at 3 (#410).
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    outputs:
      components: ${{ steps.classify.outputs.components }}
      database: ${{ steps.classify.outputs.database }}
      integration: ${{ steps.classify.outputs.integration }}
      install: ${{ steps.classify.outputs.install }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: decide which suites run (unknown history runs everything)
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          E2E: ${{ inputs.e2e }}
          INSTALL: ${{ inputs.install }}
        run: |
          areas=$'components=true\ndatabase=true\nintegration=true\ninstall=true'
          main=
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            # A manual run: static, the components and the database always; the browser and install suites only when asked.
            [[ $E2E == true ]] || E2E=false
            [[ $INSTALL == true ]] || INSTALL=false
            printf '%s\n' components=true database=true "integration=$E2E" "install=$INSTALL" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$EVENT_NAME" == push ]]; then
            main=--main
            BASE_SHA=$(gh run list -R "$GITHUB_REPOSITORY" -w CI -b main -e push -s success -L 1 --json headSha -q '.[0].headSha') || BASE_SHA=
          fi
          if [[ "$BASE_SHA" =~ ^[a-f0-9]{40}$ && ! "$BASE_SHA" =~ ^0+$ && "$HEAD_SHA" =~ ^[a-f0-9]{40}$ ]] && git cat-file -e "$BASE_SHA^{commit}"; then
            if [[ "$EVENT_NAME" == pull_request ]]; then
              range="$BASE_SHA...$HEAD_SHA"
            else
              range="$BASE_SHA..$HEAD_SHA"
            fi
            # No rename detection: a move must check both its old and new paths.
            if git diff --no-ext-diff --no-renames --name-only -z "$range" -- > "$RUNNER_TEMP/changed-files"; then
              areas=$(node scripts/ci-areas.mjs $main < "$RUNNER_TEMP/changed-files") || areas=$'components=true\ndatabase=true\nintegration=true\ninstall=true'
            fi
          fi
          echo "$areas" | tee -a "$GITHUB_OUTPUT"

  # The fast layers (#258, spec #255 D1): the static checks, the node tests and the component tests at the same time, in
  # one command (scripts/ci-fast.mjs) whose steps each report a result that `check` lists. The dependencies are restored
  # by the lock file's hash and the browser by Playwright's version, each saved straight after a fresh install, before
  # any test runs: the cache never holds the bundler's own (node_modules/.vite), so the component tests always start it
  # cold, as #218 found they must. Only the component step follows the first job's answer; an unknown answer runs it.
  fast:
    needs: [changes]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # 2.7 min measured on run 44636876755: 5 min is 1.5 times it, rounded up (#410).
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      COMPONENTS: ${{ needs.changes.result == 'success' && needs.changes.outputs.components || 'true' }}
    outputs:
      steps: ${{ steps.fast.outputs.steps }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        id: node
        with:
          node-version: 22
      - name: restore dependencies
        id: modules
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            !node_modules/.vite
            !node_modules/.cache
          key: node-modules-${{ runner.os }}-node-${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}
      - name: install dependencies
        if: ${{ steps.modules.outputs.cache-hit != 'true' }}
        run: npm ci
      - name: save dependencies
        if: ${{ steps.modules.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            node_modules
            !node_modules/.vite
            !node_modules/.cache
          key: node-modules-${{ runner.os }}-node-${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}
      - name: browser version
        id: browser-version
        if: ${{ env.COMPONENTS != 'false' }}
        # A new runner image downloads the browser again for itself.
        run: echo "version=$(node -p "require('playwright-core/package.json').version")-$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - name: restore the browser
        id: browser
        if: ${{ env.COMPONENTS != 'false' }}
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.browser-version.outputs.version }}
      - name: install the browser
        if: ${{ env.COMPONENTS != 'false' && steps.browser.outputs.cache-hit != 'true' }}
        # The browser alone, as a hit restores it: the image's own system packages and fonts serve every run alike.
        run: npx playwright install chromium
      - name: save the browser
        if: ${{ env.COMPONENTS != 'false' && steps.browser.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.browser-version.outputs.version }}
      # The OpenAPI linter's own npm cache (its manifest and its npx install, keyed by its pinned version in
      # scripts/ci-fast.mjs), so a hit lints with no registry request.
      - name: restore npx packages
        id: npx
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/npx-cache
          key: npx-${{ runner.os }}-node-${{ steps.node.outputs.node-version }}-redocly-2.76.0
      - name: fast
        id: fast
        env:
          NPX_CACHE: ${{ runner.temp }}/npx-cache
        run: ./ci.sh fast
      - name: save npx packages
        if: ${{ steps.npx.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/npx-cache
          key: npx-${{ runner.os }}-node-${{ steps.node.outputs.node-version }}-redocly-2.76.0

  # The stack's images, one archive in the Actions cache keyed by the Supabase CLI's version and the configuration lines
  # that choose images (scripts/supabase-images.sh, #259). With the key cached it only looks the key up; after a key
  # change it pulls the images on an empty project and saves them. `database` and `integration` do not wait for it
  # (their own time comes first): each restores the archive when there is one and otherwise pulls for itself, from its
  # own runner. `visual`, on main only, waits for it. It never fails a run, and it is no part of the full check: its own
  # limit is longer so a cache-key change finishes and saves (#411).
  supabase-images:
    needs: [changes]
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.database != 'false' || needs.changes.outputs.integration != 'false') }}
    runs-on: ubuntu-latest
    # 0.1 min measured on run 44636876755, but a cache-key change pulls every Supabase image: 15 minutes lets it finish
    # and save, and the job never fails a run (#411).
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Supabase images cache key
        id: images
        run: echo "key=$(bash scripts/supabase-images.sh key)" >> "$GITHUB_OUTPUT"
      - name: look the key up
        id: lookup
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/supabase-images
          key: ${{ steps.images.outputs.key }}
          lookup-only: true
      - name: reserve the stack's ports
        if: ${{ runner.environment == 'github-hosted' }}
        run: |
          sudo sysctl -w net.ipv4.ip_local_reserved_ports="$(node scripts/ci-runner.mjs reserved-ports)"
          sysctl net.ipv4.ip_local_reserved_ports
      - uses: actions/setup-node@v4
        if: ${{ steps.lookup.outputs.cache-hit != 'true' }}
        with:
          node-version: 22
          cache: npm
      - name: pull and archive the images
        if: ${{ steps.lookup.outputs.cache-hit != 'true' }}
        env:
          SUPABASE_IMAGES_ARCHIVE: ${{ runner.temp }}/supabase-images/images.tar
        run: ./ci.sh images
      - name: save the Supabase images
        if: ${{ steps.lookup.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/supabase-images
          key: ${{ steps.images.outputs.key }}

  # Migrations replayed and verified, row-level security and grants, on one local stack (tests/db.sh).
  database:
    needs: [changes]
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.database != 'false') }}
    runs-on: ubuntu-latest
    # 2.1 min measured on run 44636876755: 4 min is 1.5 times it, rounded up (#410).
    timeout-minutes: 4
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: reserve the stack's ports
        if: ${{ runner.environment == 'github-hosted' }}
        run: |
          sudo sysctl -w net.ipv4.ip_local_reserved_ports="$(node scripts/ci-runner.mjs reserved-ports)"
          sysctl net.ipv4.ip_local_reserved_ports
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The stack's images from the cache the supabase-images job keeps, when it has them (#259).
      - name: Supabase images cache key
        id: images
        run: echo "key=$(bash scripts/supabase-images.sh key)" >> "$GITHUB_OUTPUT"
      - name: restore the Supabase images
        id: restore-images
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/supabase-images
          key: ${{ steps.images.outputs.key }}
      - name: database
        env:
          SUPABASE_IMAGES_ARCHIVE: ${{ runner.temp }}/supabase-images/images.tar
        run: ./ci.sh database

  # The visual lane (#257): its twelve key screens against their approved images, drawn in the pinned renderer, and its
  # guard tests, then the measured navigation budgets on a machine no other job shares.
  visual:
    needs: [changes, supabase-images]
    if: ${{ !cancelled() && ((github.event_name == 'push' && needs.changes.outputs.integration != 'false') || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      # A failure on main opens or updates the visual-regression issue.
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: reserve the stack's ports
        if: ${{ runner.environment == 'github-hosted' }}
        run: |
          sudo sysctl -w net.ipv4.ip_local_reserved_ports="$(node scripts/ci-runner.mjs reserved-ports)"
          sysctl net.ipv4.ip_local_reserved_ports
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The stack's images from the cache the supabase-images job keeps, when it has them (#259).
      - name: Supabase images cache key
        id: images
        run: echo "key=$(bash scripts/supabase-images.sh key)" >> "$GITHUB_OUTPUT"
      - name: restore the Supabase images
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/supabase-images
          key: ${{ steps.images.outputs.key }}
      - name: visual
        env:
          SUPABASE_IMAGES_ARCHIVE: ${{ runner.temp }}/supabase-images/images.tar
        run: ./ci.sh visual
      - name: say which screens differ and how to refresh them
        if: failure()
        run: |
          screens=$(find test-results/lane -name '*-diff.png' -printf '%f\n' 2> /dev/null | sed 's/-diff\.png$//' | sort -u || true)
          {
            echo '### The visual lane failed'
            echo
            if [[ -n $screens ]]; then
              echo 'These pictures differ from their approved images:'
              printf -- '- `%s`\n' $screens
            else
              echo 'No picture differs from its approved image: the log says what failed.'
            fi
            echo
            echo 'The expected, actual and difference images are in the `lane-screenshots` artifact of this run.'
            echo 'When the change is intended, refresh the images with `./ci.sh visual-update` (or the Visual baselines workflow) and commit them.'
          } >> "$GITHUB_STEP_SUMMARY"
      # A failing comparison writes its expected, actual and difference images here.
      - name: upload the lane's screenshots
        id: screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lane-screenshots
          path: test-results/lane/
          if-no-files-found: ignore
          retention-days: 14
      # The lane's and the budgets' app servers write their output to files, not the job log.
      - name: upload the server logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-server-logs
          path: playwright-report/*.log
          if-no-files-found: ignore
          retention-days: 14
      - name: upload Playwright reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-visual
          path: |
            playwright-report/lane-html/
            playwright-report/html/
          if-no-files-found: ignore
          retention-days: 30
      # One open issue holds the latest failure on main: a new failure comments on it, or opens it when none is open.
      - name: open or update the visual-regression issue
        if: ${{ failure() && github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ARTIFACT_URL: ${{ steps.screenshots.outputs.artifact-url }}
        run: |
          body=$(node scripts/visual-regression.mjs ci-ledger/visual "$GITHUB_SHA" "$RUN_URL" "$ARTIFACT_URL")
          title=$(node scripts/visual-regression.mjs --title ci-ledger/visual "$GITHUB_SHA" "$RUN_URL" "$ARTIFACT_URL")
          gh label create visual-regression -R "$GITHUB_REPOSITORY" --color B60205 --description 'The visual job failed on main' 2> /dev/null || true
          issue=$(gh issue list -R "$GITHUB_REPOSITORY" --label visual-regression --state open --limit 1 --json number -q '.[0].number')
          if [[ -n $issue ]]; then
            gh issue comment "$issue" -R "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --label visual-regression --title "$title" --body "$body"
          fi

  # The app image, built once per run with its own layer cache (#403). The browser suite's shards, the install proof and
  # the measurement load this archive instead of each building the image again, so one run pays for one build; a change
  # that leaves the dependencies alone restores them from the cache. Next's build repeats no lint and no type check the
  # fast job already ran (NEXT_SKIP_CHECKS, next.config.mjs). It follows the answers of the suites that load it — the
  # browser suite and the install proof, and the measurement on a manual run, which runs even with nothing asked (#408) —
  # so no job ever waits for an image it did not ask for (#406).
  image:
    needs: [changes]
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.integration != 'false' || needs.changes.outputs.install != 'false' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    # 3.7 min measured on run 44636876755: 6 min is 1.5 times it, rounded up (#410).
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: gtmworks:ci
          build-args: NEXT_SKIP_CHECKS=true
          # An archive instead of `load`: the shards are other runners, and only a file can travel as an artifact.
          outputs: type=docker,dest=${{ runner.temp }}/gtmworks-image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: upload the image
        uses: actions/upload-artifact@v4
        with:
          name: gtmworks-image
          path: ${{ runner.temp }}/gtmworks-image.tar
          # It is one build's image, read by this run's shards and by nothing later.
          retention-days: 1
          # Docker's archive is compressed already.
          compression-level: 0

  # The rest of the whole-app browser suite: the production-shaped proxy suite in the image and the journeys, in 6
  # shards at the same time (Playwright's --shard, #335; six since #404), each on a runner and stacks of its own. The
  # proxy suite runs in shard 1 only (ci.sh). The browser comes from the cache the fast job keeps: a shard never
  # downloads a browser or a system package during a run. The image is the one the image job built (#403): a shard
  # loads it, and no shard builds it.
  integration:
    needs: [changes, image]
    if: ${{ !cancelled() && needs.image.result == 'success' && (needs.changes.result != 'success' || needs.changes.outputs.integration != 'false') }}
    runs-on: ubuntu-latest
    strategy:
      # Every shard runs to the end, so one red shard still shows the others' failures.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    # 10.6 min measured for the slowest shard on run 44636876755: 12 min is 1.5 times it, capped at 12 (#410).
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: reserve the stack's ports
        if: ${{ runner.environment == 'github-hosted' }}
        run: |
          sudo sysctl -w net.ipv4.ip_local_reserved_ports="$(node scripts/ci-runner.mjs reserved-ports)"
          sysctl net.ipv4.ip_local_reserved_ports
      - uses: actions/setup-node@v4
        id: node
        with:
          node-version: 22
      # The dependencies and the browser the fast job already saved (#404): one cache entry each, keyed alike, so a shard
      # starts with both and reaches neither a registry nor a package mirror during a run.
      - name: restore dependencies
        id: modules
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            !node_modules/.vite
            !node_modules/.cache
          key: node-modules-${{ runner.os }}-node-${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}
      - name: install dependencies
        if: ${{ steps.modules.outputs.cache-hit != 'true' }}
        run: npm ci
      - name: save dependencies
        if: ${{ steps.modules.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            node_modules
            !node_modules/.vite
            !node_modules/.cache
          key: node-modules-${{ runner.os }}-node-${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}
      - name: browser version
        id: browser-version
        # A new runner image downloads the browser again for itself.
        run: echo "version=$(node -p "require('playwright-core/package.json').version")-$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - name: restore the browser
        id: browser
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.browser-version.outputs.version }}
      - name: install the browser
        if: ${{ steps.browser.outputs.cache-hit != 'true' }}
        # The browser alone, as a hit restores it: the image's own system packages and fonts serve every run alike, so
        # no shard reaches a package mirror.
        run: npx playwright install chromium
      - name: save the browser
        if: ${{ steps.browser.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.browser-version.outputs.version }}
      # The stack's images from the cache the supabase-images job keeps (#259).
      - name: Supabase images cache key
        id: images
        run: echo "key=$(bash scripts/supabase-images.sh key)" >> "$GITHUB_OUTPUT"
      - name: restore the Supabase images
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/supabase-images
          key: ${{ steps.images.outputs.key }}
      # The image the image job built, loaded under the tag scripts/ci-image.sh runs (#403).
      - name: download the image
        uses: actions/download-artifact@v4
        with:
          name: gtmworks-image
          path: ${{ runner.temp }}
      - name: load the image
        run: docker load --input "$RUNNER_TEMP/gtmworks-image.tar"
      - name: integration
        env:
          CI_IMAGE_PREBUILT: "true"
          # One browser test lane per worker, each on a whole stack of its own (tests/lane.mjs, #69).
          GTMWORKS_TEST_LANES: "4"
          SUPABASE_IMAGES_ARCHIVE: ${{ runner.temp }}/supabase-images/images.tar
        run: ./ci.sh integration --shard=${{ matrix.shard }}/6
      # The screenshots the journeys write (card and phone checks) are uploaded so a review can see them.
      - name: upload journey screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journey-screenshots-${{ matrix.shard }}
          path: test-results/screenshots/
          if-no-files-found: ignore
          retention-days: 14
      # Playwright's own HTML report: every failure, and each test that passed only on its retry marked flaky.
      - name: upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/html/
          if-no-files-found: ignore
          retention-days: 30
      # Each lane's app server and stack write their output to files, not the job log: a server that never answers its
      # web-server check (Playwright's 240 s) says why only there. The stacks run on local test credentials only.
      - name: upload the lanes' server logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lane-server-logs-${{ matrix.shard }}
          path: playwright-report/*.log
          if-no-files-found: ignore
          retention-days: 14

  # The install proof is one job, one matrix entry per area, each on a fresh isolated Docker machine of its own (#406):
  # the first install and its repeat; Companies and their Engines; Agents on their Engines; backup and restore; the
  # public address behind a proxy; the update between releases; and the one-line install. A fault in one area cannot
  # hide or cause another's: fail-fast is off, so one red area leaves the others running to their end, and the job's name
  # is the area that failed. An area adds its name to `matrix.area` and a case to scripts/ci-install-check.sh, nothing
  # else (#407–#409).
  # Every entry loads the one app image the `image` job built (#403), under the tag a source install's compose file names,
  # and the installer skips its build because the image is already there (GTMWORKS_IMAGE_PREBUILT, tests only). The
  # isolated machine and that image are one composite action (.github/actions/install-machine, #411) the measurement also
  # uses, and the tag is read from docker-compose.install.yml there. The job holds no check of its own: its whole area is
  # one command of the repo, so the same command proves it on a machine with Docker. Its failure sentences are the area's,
  # in scripts/ci-install-check.sh.
  install:
    name: install-${{ matrix.area }}
    needs: [changes, image]
    if: ${{ !cancelled() && needs.image.result == 'success' && (needs.changes.result != 'success' || needs.changes.outputs.install != 'false') }}
    runs-on: ubuntu-latest
    strategy:
      # Every area runs to its end, so one red area still shows the others' faults (#406).
      fail-fast: false
      matrix:
        area: [first-install, companies, agents, backup, proxy, update, one-line]
    # 9.5 min measured for its slowest area, backup, on run 44636876755: 12 min is 1.5 times it, capped at 12 (#410).
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Only the update area builds and installs the previous release from this pull request's base (#378, S2).
          fetch-depth: ${{ matrix.area == 'update' && '0' || '1' }}
      # The isolated Docker machine and the image the run built once, as one action the measurement also uses (#403,
      # #411): the area of scripts/ci-install-check.sh the matrix names runs on it, and the last step removes it, also
      # after a failure, on a runner that is reused.
      - uses: ./.github/actions/install-machine
      # Only the browser check of the sign-in rate limit, in the proxy area, uses these, inside the Playwright image; the
      # install itself is Docker only. No install scripts: the image already has the browsers.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: test packages for the install browser check
        if: ${{ matrix.area == 'proxy' }}
        run: npm ci --ignore-scripts
      - name: the install proof
        env:
          DOCKER_HOST: tcp://127.0.0.1:2375
          INSTALL_REF: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
          GTMWORKS_IMAGE_PREBUILT: "true"
        run: bash scripts/ci-install-check.sh ${{ matrix.area }}
      - name: remove the isolated Docker machine
        if: ${{ always() && runner.environment != 'github-hosted' }}
        run: docker rm -fv install-docker || true

  # The profile-size measurement (#126, #400) is no check a pull request needs: twenty Agent profiles took 85 seconds,
  # and their numbers are for the README. It runs on a push to main and on a manual run only, easy to find beside the
  # install proof (#408, Omar, 2026-11-19), on a fresh isolated Docker machine of its own and with the run's one image.
  # `check` does not wait for it.
  install-measure:
    needs: [changes, image]
    if: ${{ !cancelled() && needs.image.result == 'success' && ((github.event_name == 'push' && (needs.changes.result != 'success' || needs.changes.outputs.install != 'false')) || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    # The measurement installs the stack and makes twenty more Agent profiles.
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # The isolated Docker machine and the image the run built once, as one action the install matrix also uses (#411).
      - uses: ./.github/actions/install-machine
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: the profile-size measurement
        env:
          DOCKER_HOST: tcp://127.0.0.1:2375
          INSTALL_REF: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GTMWORKS_IMAGE_PREBUILT: "true"
        run: bash scripts/ci-install-check.sh measure
      - name: remove the isolated Docker machine
        if: ${{ always() && runner.environment != 'github-hosted' }}
        run: docker rm -fv install-docker || true

  check:
    needs: [changes, fast, image, database, integration, install]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    # 0.1 min measured on run 44636876755: 3 min is 1.5 times it, floored at 3 (#410).
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: all required stages green
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          FAST_RESULT: ${{ needs.fast.result }}
          FAST_STEPS: ${{ needs.fast.outputs.steps }}
          COMPONENTS_RUN: ${{ needs.changes.outputs.components }}
          IMAGE_RUN: ${{ needs.changes.outputs.integration != 'false' || needs.changes.outputs.install != 'false' || github.event_name == 'workflow_dispatch' }}
          IMAGE_RESULT: ${{ needs.image.result }}
          DATABASE_RUN: ${{ needs.changes.outputs.database }}
          DATABASE_RESULT: ${{ needs.database.result }}
          INTEGRATION_RUN: ${{ needs.changes.outputs.integration }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          INSTALL_RUN: ${{ needs.changes.outputs.install }}
          INSTALL_RESULT: ${{ needs.install.result }}
        run: node scripts/ci-verdict.mjs
