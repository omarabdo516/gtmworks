# The nightly CI health report (#256): a week of the `ledger` artifacts that ci.yml's ledger job writes, read into one
# tracking issue that each night's report replaces (scripts/ci-health.mjs). A change to the report runs it on its own
# pull request, since GitHub starts a manual or scheduled run only from the default branch.
name: CI health

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/ci-health.yml
      - scripts/ci-health.mjs

# One writer of the tracking issue at a time.
concurrency:
  group: ci-health
  cancel-in-progress: false

jobs:
  report:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: report the last 7 days
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-health.mjs
