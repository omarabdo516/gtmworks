# A tag vX.Y.Z only requests a release. A tag push runs the workflow file of the tagged commit, which an unreviewed
# commit could rewrite, so this workflow holds no permission and publishes nothing. Its completion starts the Release
# workflow (release.yml) as main's reviewed copy, which proves the tagged commit before anything is published.
name: Release tag

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions: {}

jobs:
  request:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: release requested
        env:
          TAG_NAME: ${{ github.ref_name }}
          TAGGED: ${{ github.sha }}
        run: echo "Release $TAG_NAME requested for $TAGGED; the Release workflow checks and publishes it."
