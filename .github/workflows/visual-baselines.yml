# Refreshes the visual lane's approved images (#257) in CI, for a machine without Docker. Run it from the Actions tab (or
# `gh workflow run visual-baselines.yml --ref <branch>`), download the `visual-baselines` artifact into
# tests/visual-lane/images/ and commit the images with the change that caused them. It runs `./ci.sh visual-update`.
name: Visual baselines
on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # The stack's ports lie in Linux's range for outgoing connections; reserved, no connection can take one (#225).
      - name: reserve the stack's ports
        if: ${{ runner.environment == 'github-hosted' }}
        run: |
          sudo sysctl -w net.ipv4.ip_local_reserved_ports="$(node scripts/ci-runner.mjs reserved-ports)"
          sysctl net.ipv4.ip_local_reserved_ports
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: update the lane's images
        run: ./ci.sh visual-update
      - name: collect the changed images
        if: always()
        run: |
          mkdir -p visual-baselines
          git status --short --untracked-files=all -- tests/visual-lane/images
          git ls-files --modified --others --exclude-standard -z -- 'tests/visual-lane/images/*.png' |
            while IFS= read -r -d '' image; do
              if [[ -f "$image" ]]; then cp -- "$image" visual-baselines/; fi
            done
      - name: upload the changed images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: visual-baselines/
          if-no-files-found: ignore
          retention-days: 14
      # A failed refresh keeps its pictures and the guards' reasons.
      - name: upload the lane's results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lane-results
          path: |
            test-results/lane/
            playwright-report/lane-html/
          if-no-files-found: ignore
          retention-days: 7
