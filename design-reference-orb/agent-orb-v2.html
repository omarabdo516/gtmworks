<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>وكلاء ليهم شخصية · Agent orb O2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap" rel="stylesheet">
<style>
/* OD-LAYOUT-PRIMITIVES v1 — structure only: display, flex/grid, overflow, wrapping, ratio, geometry.
   Put this @layer first; product CSS outside the layer wins ordinary layout rules.
   Native hidden and closed-dialog states take precedence over component display rules. */
@layer od-layout {
  [hidden]:not([hidden="until-found" i]) { display: none !important; }
  dialog:not([open]) { display: none !important; }
  :where(.od-stack,.od-row,.od-row-top,.od-cluster,.od-grid,.od-field,.od-stat,.od-cell,.od-tile) > :where(*) { min-width: 0; }
  .od-stack   { display: flex; flex-direction: column; gap: var(--od-gap, 8px); }
  .od-row     { display: flex; align-items: center; gap: var(--od-gap, 8px); }
  .od-cluster { display: flex; flex-wrap: wrap; align-items: center; gap: var(--od-gap, 8px); }
  .od-fill    { flex: 1 1 0; min-width: 0; }
  .od-fixed   { flex: none; }
  .od-stat, .od-field, .od-cell { display: grid; gap: var(--od-gap, 2px); }
  :where(.od-stat,.od-field,.od-cell) > :where(*) { display: block; }
  .od-icon { display: inline-block; inline-size: var(--od-icon-size, 1em); block-size: var(--od-icon-size, 1em); flex: none; }
  .od-truncate { display: block; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .od-nowrap  { white-space: nowrap; }
}
:root [hidden]:where(:not([hidden="until-found" i])) { display: none; }
/* /OD-LAYOUT-PRIMITIVES v1 */

/* ================= gtmworks tokens (tokens.css) ================= */
:root {
  --bg-chrome: #FCFCFC; --bg-sidebar: #F5F5F5; --bg-pane: #FFFFFF; --bg-elevated: #FFFFFF;
  --bg-hover: #1C1C1C0F; --bg-active: #1C1C1C14; --bg-tertiary: #1C1C1C0F; --bg-subtle: #1C1C1C08;
  --bg-secondary-hover: #1C1C1C1A; --bg-elevated-hover: #F1F1F1; --bg-active-solid: #E9E9E9; --bg-scrim: #00000066;
  --text-1: #1C1C1C; --text-2: #1C1C1CB8; --text-3: #1C1C1CA3; --text-4: #1C1C1C80;
  --border-1: #1C1C1C3D; --border-2: #1C1C1C1F; --border-3: #1C1C1C14;
  --primary: #1C1C1C; --primary-hover: #363636; --on-primary: #FCFCFC; --primary-disabled: #1C1C1C26;
  --btn-secondary-bg: #1C1C1C0F; --btn-secondary-ring: transparent; --btn-secondary-hover: #1C1C1C1A;
  --bubble-agent: #1C1C1C0F; --bubble-user: #1C1C1C; --on-bubble-user: #FFFFFF;
  --accent: #0F766E; --focus: #0F766E; --wait: #DA830E; --wait-text: #985500; --wait-bg: #F5931217;
  --danger-text: #CD2834; --idle-dot: #B5B5B5;
  --shadow-pill: #1C1C1C14 0 4px 12px -1px, #1C1C1C0A 0 1px 2px;
  --shadow-composer: #0000000D 0 2px 8px -1px, #00000008 0 1px 2px;
  --shadow-card: #1C1C1C1F 0 0 0 0.5px, #1C1C1C09 0 2px 8px;
  --shadow-popover: #1C1C1C1A 0 10px 20px -3px, #1C1C1C14 0 4px 6px -4px;
  --bubble-ring: #1C1C1C0F 0 0 0 0.5px inset;
  --font: "IBM Plex Sans Arabic", "Noto Sans Arabic", Tahoma, system-ui, sans-serif;
  --w-regular: 400; --w-strong: 600;
  --fs-xs: 12px; --fs-sm: 13px; --fs-base: 14px; --fs-msg: 15px; --fs-lg: 17px; --fs-xl: 22px; --fs-2xl: 28px;
  --lh-ar: 1.7; --lh-ui: 1.5;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px; --s6: 24px; --s8: 32px; --s10: 40px; --s12: 48px; --s16: 64px;
  --r-xs: 6px; --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-bubble: 18px; --r-composer: 22px; --r-card: 24px; --r-full: 9999px;
  --dur-fast: 150ms; --dur: 200ms; --dur-slow: 280ms;
  --ease-out: cubic-bezier(0.2, 0, 0, 1); --ease-in: cubic-bezier(0.4, 0, 1, 1);
  color-scheme: light;
  /* face knobs, light canvas: soft glow, gentle rim, a real shadow under the orb */
  --glow-k: .2; --rim-k: .42; --sh-l: .4; --sh-d: 0; --o1-glow: .2; --o1-rd: 0; --o1-rl: 1;
}
/* the same light values again, so a light panel can sit inside a dark page */
[data-theme="light"] {
  --bg-chrome: #FCFCFC; --bg-sidebar: #F5F5F5; --bg-pane: #FFFFFF; --bg-elevated: #FFFFFF;
  --bg-hover: #1C1C1C0F; --bg-active: #1C1C1C14; --bg-tertiary: #1C1C1C0F; --bg-subtle: #1C1C1C08;
  --bg-secondary-hover: #1C1C1C1A; --bg-elevated-hover: #F1F1F1; --bg-active-solid: #E9E9E9;
  --text-1: #1C1C1C; --text-2: #1C1C1CB8; --text-3: #1C1C1CA3; --text-4: #1C1C1C80;
  --border-1: #1C1C1C3D; --border-2: #1C1C1C1F; --border-3: #1C1C1C14;
  --primary: #1C1C1C; --primary-hover: #363636; --on-primary: #FCFCFC; --primary-disabled: #1C1C1C26;
  --btn-secondary-bg: #1C1C1C0F; --btn-secondary-ring: transparent; --btn-secondary-hover: #1C1C1C1A;
  --bubble-agent: #1C1C1C0F; --bubble-user: #1C1C1C; --on-bubble-user: #FFFFFF;
  --accent: #0F766E; --focus: #0F766E; --wait: #DA830E; --wait-text: #985500; --wait-bg: #F5931217; --idle-dot: #B5B5B5;
  --shadow-pill: #1C1C1C14 0 4px 12px -1px, #1C1C1C0A 0 1px 2px;
  --shadow-composer: #0000000D 0 2px 8px -1px, #00000008 0 1px 2px;
  --shadow-card: #1C1C1C1F 0 0 0 0.5px, #1C1C1C09 0 2px 8px;
  --shadow-popover: #1C1C1C1A 0 10px 20px -3px, #1C1C1C14 0 4px 6px -4px;
  --bubble-ring: #1C1C1C0F 0 0 0 0.5px inset;
  color-scheme: light;
  --glow-k: .2; --rim-k: .42; --sh-l: .4; --sh-d: 0; --o1-glow: .2; --o1-rd: 0; --o1-rl: 1;
}
[data-theme="dark"] {
  --bg-chrome: #121212; --bg-sidebar: #0E0E0E; --bg-pane: #161616; --bg-elevated: #1F1F1F;
  --bg-hover: #F5F5F50F; --bg-active: #F5F5F514; --bg-tertiary: #F5F5F50F; --bg-subtle: #F5F5F505;
  --bg-secondary-hover: #F5F5F51A; --bg-elevated-hover: #2C2C2C; --bg-active-solid: #262626; --bg-scrim: #000000B2;
  --text-1: #F5F5F5; --text-2: #F5F5F5B8; --text-3: #F5F5F599; --text-4: #F5F5F58A;
  --border-1: #F5F5F538; --border-2: #F5F5F51A; --border-3: #F5F5F50F;
  --primary: #F5F5F5; --primary-hover: #DBDBDB; --on-primary: #121212; --primary-disabled: #F5F5F521;
  --btn-secondary-bg: #F5F5F524; --btn-secondary-ring: #F5F5F55C; --btn-secondary-hover: #F5F5F533;
  --bubble-agent: #F5F5F50F; --bubble-user: #F5F5F52E; --on-bubble-user: #FFFFFF;
  --accent: #2CC3AE; --focus: #5EE0CC; --wait: #E8962A; --wait-text: #F0A443; --wait-bg: #F694121F;
  --danger-text: #FF6463; --idle-dot: #5C5C5C;
  --shadow-pill: #F5F5F51A 0 0 0 0.5px; --shadow-composer: #F5F5F51A 0 0 0 0.5px; --shadow-card: #F5F5F51A 0 0 0 0.5px;
  --shadow-popover: #000000 0 10px 20px -3px, #F5F5F51A 0 0 0 0.5px;
  --bubble-ring: #F5F5F50F 0 0 0 0.5px inset;
  color-scheme: dark;
  /* face knobs, dark canvas: the glow carries the light, the rim is a bright hairline,
     and the floor shows a coloured pool of light instead of a dark shadow */
  --glow-k: .5; --rim-k: 1; --sh-l: .7; --sh-d: .34; --o1-glow: .55; --o1-rd: 1; --o1-rl: 0;
}

/* ================= base ================= */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: var(--font); font-size: var(--fs-base); line-height: 1.6; font-weight: var(--w-regular);
  color: var(--text-1); background: var(--bg-chrome); -webkit-font-smoothing: antialiased;
}
html[lang="en"] body { font-family: "IBM Plex Sans", var(--font); }
bdi { unicode-bidi: isolate; }
button, input, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
[data-theme] { color: var(--text-1); }

.page { max-width: 1200px; margin: 0 auto; padding: var(--s8) var(--s8) var(--s16); }
@media (max-width: 1023px) { .page { padding-inline: var(--s5); } }
@media (max-width: 767px) { .page { padding: var(--s6) var(--s4) var(--s12); } }

/* ---------- top bar ---------- */
.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: var(--s5) var(--s8); padding-bottom: var(--s6); border-bottom: 0.5px solid var(--border-2); }
.top__k { margin: 0 0 var(--s1); font-size: var(--fs-xs); color: var(--text-3); }
.top__t { margin: 0; font-size: var(--fs-xl); font-weight: var(--w-strong); line-height: 1.4; }
.top__sub { margin: var(--s1) 0 0; max-width: 64ch; color: var(--text-2); line-height: var(--lh-ar); }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s3) var(--s5); }
.ctl { display: flex; align-items: center; gap: var(--s2); }
.ctl__label { font-size: var(--fs-xs); color: var(--text-3); white-space: nowrap; }
.seg { display: inline-flex; gap: 2px; padding: 2px; border-radius: var(--r-full); background: var(--bg-pane); box-shadow: var(--border-2) 0 0 0 0.5px inset; border: 0; margin: 0; min-width: 0; }
.seg label { position: relative; display: inline-flex; align-items: center; justify-content: center; min-height: 36px; padding: 0 14px; border-radius: var(--r-full); font-size: var(--fs-sm); color: var(--text-2); cursor: pointer; white-space: nowrap; transition: background-color var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out); }
.seg input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.seg label:has(input:checked) { background: var(--bg-tertiary); color: var(--text-1); font-weight: var(--w-strong); }
.seg label:has(input:focus-visible) { outline: 2px solid var(--focus); outline-offset: 2px; }
@media (hover: hover) { .seg label:hover { color: var(--text-1); } }

.switch { display: inline-flex; align-items: center; width: 32px; height: 20px; padding: 2px; flex: none; border-radius: var(--r-full); background: var(--border-1); transition: background-color var(--dur-fast) var(--ease-out); }
.switch::after { content: ""; width: 16px; height: 16px; border-radius: 50%; background: #FFFFFF; box-shadow: #1C1C1C1F 0 1px 3px; transition: transform var(--dur) var(--ease-out); }
.switch[aria-checked="true"] { background: var(--primary); }
.switch[aria-checked="true"]::after { transform: translateX(-12px); background: var(--bg-pane); }
[dir="ltr"] .switch[aria-checked="true"]::after { transform: translateX(12px); }
[data-theme="dark"] .switch[aria-checked="true"]::after { background: #121212; }
.sw-hit { display: inline-flex; align-items: center; gap: var(--s2); min-height: 40px; cursor: pointer; font-size: var(--fs-sm); color: var(--text-1); }

/* ---------- sections ---------- */
.sec { padding-top: var(--s12); }
.sec__head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: var(--s3) var(--s6); margin-bottom: var(--s4); }
.sec__n { display: block; font-size: var(--fs-xs); color: var(--text-3); }
.sec__t { margin: 0; font-size: var(--fs-msg); font-weight: var(--w-strong); line-height: 1.5; }
.sec__sub { margin: 2px 0 0; max-width: 70ch; font-size: var(--fs-sm); line-height: var(--lh-ar); color: var(--text-2); }
.sub-h { margin: var(--s8) 0 var(--s3); font-size: var(--fs-base); font-weight: var(--w-strong); }
.pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s4); }
@media (max-width: 767px) { .pair { grid-template-columns: minmax(0, 1fr); } }
.canvas { background: var(--bg-sidebar); border-radius: var(--r-lg); box-shadow: var(--border-3) 0 0 0 0.5px inset; padding: var(--s4); --ring: var(--bg-sidebar); min-width: 0; }
.canvas__tag { margin: 0; font-size: var(--fs-xs); color: var(--text-3); }

/* buttons (gtmworks 6.1) */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 36px; padding: 0 16px; border-radius: var(--r-full); font-size: var(--fs-base); font-weight: var(--w-strong); white-space: nowrap; transition: background-color var(--dur-fast) var(--ease-out); }
.btn--primary { background: var(--primary); color: var(--on-primary); }
.btn--secondary { background: var(--btn-secondary-bg); color: var(--text-1); box-shadow: var(--btn-secondary-ring) 0 0 0 1px inset; }
@media (hover: hover) { .btn--primary:hover { background: var(--primary-hover); } .btn--secondary:hover { background: var(--btn-secondary-hover); } }
.link-btn { min-height: 32px; padding: 2px 8px; border-radius: var(--r-xs); font-size: var(--fs-sm); color: var(--text-2); }
@media (hover: hover) { .link-btn:hover:not(:disabled) { background: var(--bg-hover); color: var(--text-1); } }
.link-btn:disabled { color: var(--text-4); cursor: default; }

/* chips (gtmworks 6.2): pressed = solid ink */
.chips { display: flex; flex-wrap: wrap; gap: var(--s2); }
.chip { position: relative; display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding-inline: 12px 14px; border-radius: var(--r-full); background: var(--bg-pane); box-shadow: var(--border-2) 0 0 0 0.5px inset; font-size: var(--fs-sm); white-space: nowrap; cursor: pointer; --ring: var(--bg-pane); transition: background-color var(--dur-fast) var(--ease-out); }
.chip--face { padding-inline: 6px 14px; }
.chip input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
@media (hover: hover) { .chip:hover { background: var(--bg-elevated-hover); --ring: var(--bg-elevated-hover); } }
.chip[aria-pressed="true"], .chip:has(input:checked) { background: var(--primary); color: var(--on-primary); box-shadow: none; --ring: var(--primary); }
@media (hover: hover) { .chip[aria-pressed="true"]:hover, .chip:has(input:checked):hover { background: var(--primary-hover); --ring: var(--primary-hover); } }
.chip:has(input:focus-visible) { outline: 2px solid var(--focus); outline-offset: 2px; }

/* status dots (gtmworks 6.2), one look per product state */
.dot { position: relative; display: inline-block; width: 8px; height: 8px; flex: none; border-radius: 50%; background: var(--idle-dot); }
.dot--thinking, .dot--working { background: var(--accent); }
.dot--working::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: var(--accent); animation: dotPing 1.6s var(--ease-out) infinite; }
@keyframes dotPing { 0% { transform: scale(1); opacity: .55; } 80%, 100% { transform: scale(2.4); opacity: 0; } }
.dot--done { background: var(--text-1); }
.dot--waiting { background: var(--wait); }
.dot--stuck { background: var(--ring, var(--bg-chrome)); box-shadow: inset 0 0 0 2px var(--text-1); }
.dot--asleep { background: var(--ring, var(--bg-chrome)); box-shadow: inset 0 0 0 2px var(--idle-dot); }
.fw { position: relative; display: inline-flex; flex: none; }
.fw > .dot { position: absolute; bottom: 1px; inset-inline-end: 1px; z-index: 4; box-shadow: 0 0 0 2.5px var(--ring, var(--bg-chrome)); }
.fw > .dot--stuck { box-shadow: inset 0 0 0 2px var(--text-1), 0 0 0 2.5px var(--ring, var(--bg-chrome)); }
.fw > .dot--asleep { box-shadow: inset 0 0 0 2px var(--idle-dot), 0 0 0 2.5px var(--ring, var(--bg-chrome)); }
.fw--lg > .dot { width: 12px; height: 12px; bottom: 4px; inset-inline-end: 4px; box-shadow: 0 0 0 3px var(--ring, var(--bg-chrome)); }
.fw--lg > .dot--stuck { box-shadow: inset 0 0 0 2.5px var(--text-1), 0 0 0 3px var(--ring, var(--bg-chrome)); }
.fw--lg > .dot--asleep { box-shadow: inset 0 0 0 2.5px var(--idle-dot), 0 0 0 3px var(--ring, var(--bg-chrome)); }
.face-btn { display: inline-flex; border-radius: 50%; }

/* =====================================================================
   THE FACE
   Layers, outside in: floor shadow · act (one-off moments) · pose (state posture)
   · breath (personality loop) · glow · glass body (deep gradient, flowing colour,
   inner light, volume shade, swirl, veil, specular, rim) · eyes.
   Only transform and opacity animate. Under 24px: a still orb with eyes.
   ===================================================================== */
.face {
  --ew: max(2px, calc(var(--s) * var(--eW, .088)));
  --eh: max(4px, calc(var(--s) * var(--eH, .2)));
  /* expression knobs: states and moments only change these */
  --lk: .6; --gk: 1; --sx: 0; --sy: var(--sy0, 0);
  --eSX: 1; --eSY: 1; --eOpen: 1; --eHappy: 0; --eSleep: 0;
  --clL: var(--clL0, polygon(-40% -40%, 140% -40%, 140% 140%, -40% 140%));
  --clR: var(--clR0, polygon(-40% -40%, 140% -40%, 140% 140%, -40% 140%));
  --core: 1; --gs: 1; --swk: 0; --veil: 0; --veilc: #2B2E3A;
  position: relative; display: block; flex: none; width: var(--s); height: var(--s);
  direction: ltr; transition: transform var(--dur) var(--ease-out);
}
.face .l, .face i { position: absolute; display: block; pointer-events: none; }
.f-act, .f-pose, .f-breath { position: absolute; inset: 0; }
.f-pose { transform-origin: 50% 90%; transition: transform 360ms var(--ease-out); }
.f-breath { transform-origin: 50% 92%; animation: var(--bn, fBreath) var(--br, 5s) ease-in-out var(--d, 0s) infinite; }
@keyframes fBreath {
  0%, 100% { transform: translateY(0) rotate(calc(var(--sw, 0) * -1deg)) scale(1, 1); }
  50% { transform: translateY(calc(var(--s) * var(--bb, .01) * -1)) rotate(calc(var(--sw, 0) * 1deg)) scale(calc(1 + var(--ba, .02) * .5), calc(1 + var(--ba, .02))); }
}
@keyframes fBounce {
  0%, 100% { transform: translateY(0) scale(1.025, .975); }
  14% { transform: translateY(0) scale(1, 1); }
  46% { transform: translateY(calc(var(--s) * var(--bb, .04) * -1)) scale(.99, 1.02); }
  78% { transform: translateY(0) scale(1, 1); }
  88% { transform: translateY(0) scale(1.03, .97); }
}

/* floor: a dark contact shadow on light, a coloured pool of light on dark */
.f-shadow { left: 17%; right: 17%; top: 97%; height: 15%; }
.f-shadow::before, .f-shadow::after { content: ""; position: absolute; border-radius: 50%; }
.f-shadow::before { inset: 0; background: radial-gradient(closest-side, color-mix(in srgb, var(--c4) 55%, #000) 0%, color-mix(in srgb, var(--c4) 20%, transparent) 60%, transparent 100%); opacity: var(--sh-l); }
.f-shadow::after { inset: -40% -18%; background: radial-gradient(closest-side, var(--c2) 0%, color-mix(in srgb, var(--c2) 30%, transparent) 55%, transparent 100%); opacity: var(--sh-d); }

.f-glow {
  inset: calc(-30% * var(--pres, 1)); border-radius: 50%;
  background: radial-gradient(closest-side, var(--c2) 50%, color-mix(in srgb, var(--c2) 45%, transparent) 64%, transparent 100%);
  opacity: calc(var(--glow-k) * var(--gs) * var(--pres, 1));
  transition: opacity 500ms var(--ease-out);
}
@keyframes glowPulse { from { transform: scale(.94); } to { transform: scale(1.1); } }

.f-body { position: absolute; inset: 0; overflow: hidden; border-radius: 50%; background: var(--c3); isolation: isolate; }
.face:not([data-shape="circle"]) .f-body { border-radius: 0; -webkit-mask: var(--mask) center / 100% 100% no-repeat; mask: var(--mask) center / 100% 100% no-repeat; }
.face[data-shape="squircle"] { --mask: var(--mask-squircle); }
.face[data-shape="blob"] { --mask: var(--mask-blob); }
.f-base { inset: 0; background: linear-gradient(158deg, var(--c1) 8%, var(--c2) 42%, var(--c3) 72%, var(--c4) 100%); }
/* flowing colour: one oversized layer carries a light blob (top) and a deep blob (bottom) and turns slowly,
   so the colour moves inside the glass with a single cheap animation */
.f-flows { inset: -25%; border-radius: 50%;
  background:
    radial-gradient(30% 30% at 24% 20%, color-mix(in srgb, var(--c1) 86%, #fff) 0%, color-mix(in srgb, var(--c1) 60%, transparent) 45%, transparent 100%),
    radial-gradient(34% 34% at 76% 80%, var(--c4) 0%, color-mix(in srgb, var(--c4) 55%, transparent) 45%, transparent 100%),
    radial-gradient(26% 26% at 82% 30%, color-mix(in srgb, var(--c2) 80%, var(--c1)) 0%, transparent 100%);
  opacity: calc(.55 + var(--flk, .55) * .45);
  animation: fFlow var(--fl, 12s) ease-in-out var(--d, 0s) infinite alternate both; }
@keyframes fFlow { from { transform: translate(-6%, -3%) rotate(-24deg); } to { transform: translate(6%, 5%) rotate(34deg); } }
/* inner light: glows up from the lower core, like light caught inside glass */
.f-core { inset: 0; background: radial-gradient(62% 34% at 50% 98%, color-mix(in srgb, var(--c1) 55%, #fff) 0%, color-mix(in srgb, var(--c1) 70%, transparent) 38%, transparent 100%), radial-gradient(46% 40% at 50% 62%, color-mix(in srgb, var(--c1) 50%, transparent) 0%, transparent 100%); opacity: calc(.62 * var(--core) * var(--pres, 1)); transition: opacity 500ms var(--ease-out); }
.f-shade { inset: 0; background: radial-gradient(circle at 40% 30%, transparent 58%, color-mix(in srgb, var(--c4) 32%, transparent) 84%, color-mix(in srgb, var(--c4) 62%, transparent) 100%); }
.f-swirl { inset: 5%; border-radius: 50%; opacity: var(--swk); transition: opacity 420ms var(--ease-out);
  background: conic-gradient(from 0deg, transparent 0 8%, color-mix(in srgb, var(--c1) 70%, #fff) 24%, transparent 40% 58%, var(--c1) 76%, transparent 92%);
  -webkit-mask: radial-gradient(closest-side, transparent 30%, #000 54%, #000 68%, transparent 94%); mask: radial-gradient(closest-side, transparent 30%, #000 54%, #000 68%, transparent 94%); }
.f-veil { inset: 0; background: var(--veilc); opacity: var(--veil); transition: opacity 500ms var(--ease-out); }
/* specular: leans a little toward the pointer, like a light source */
.f-specs { position: absolute; inset: 0; transform: translate(calc(var(--lx, 0) * var(--s) * .07), calc(var(--ly, 0) * var(--s) * .05)); transition: transform 420ms var(--ease-out); }
.f-spec { top: 3%; left: 12%; width: 62%; height: 30%; border-radius: 50%; background: radial-gradient(closest-side, rgba(255,255,255,.34), rgba(255,255,255,.1) 60%, rgba(255,255,255,0)); transform: rotate(-16deg); }
.f-spec2 { top: 11%; left: 27%; width: 13%; height: 7%; border-radius: 50%; background: radial-gradient(closest-side, rgba(255,255,255,.95), rgba(255,255,255,0)); transform: rotate(-24deg); }
.f-rim { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.f-rim use { fill: none; stroke: url(#rimLight); stroke-width: 2; opacity: var(--rim-k); }
.face--big .f-rim use { stroke-width: 3; }

/* eyes: all feeling lives here */
.f-eyes {
  position: absolute; left: var(--eX, 50%); top: var(--eYp, 41%); width: 0; height: 0; z-index: 2;
  transform: translate(
    calc((var(--lx, 0) * var(--lk) + var(--gx, 0) * var(--gk) + var(--sx)) * var(--s) * .065),
    calc((var(--ly, 0) * var(--lk) + var(--gy, 0) * var(--gk) + var(--sy)) * var(--s) * .06));
  transition: transform var(--gd, 300ms) var(--ease-out);
}
.f-gaze { position: absolute; left: 0; top: 0; width: 0; height: 0; }
.f-eye { position: absolute; top: calc(var(--eh) / -2); width: var(--ew); height: var(--eh); }
.f-eye--l { left: calc(var(--s) * var(--eG, .185) * -1 - var(--ew) / 2); }
.f-eye--r { left: calc(var(--s) * var(--eG, .185) - var(--ew) / 2); }
.e-open {
  position: absolute; inset: 0; border-radius: var(--eR, 999px); background: #FFFFFF; opacity: var(--eOpen);
  box-shadow: 0 0 calc(var(--s) * .05) color-mix(in srgb, var(--c4) 45%, transparent);
  transition: transform 260ms var(--ease-out), clip-path 260ms var(--ease-out), opacity 140ms linear;
}
.f-eye--l .e-open { transform: rotate(var(--eT, 0deg)) scale(var(--eSX), var(--eSY)); clip-path: var(--clL); }
.f-eye--r .e-open { transform: rotate(calc(var(--eT, 0deg) * -1)) scale(var(--eSX), var(--eSY)); clip-path: var(--clR); }
.e-arc { position: absolute; left: 50%; top: 50%; width: max(5px, calc(var(--ew) * 2.1)); height: max(5px, calc(var(--ew) * 2.1)); transform: translate(-50%, -50%); overflow: visible; }
.e-arc path { fill: none; stroke: #FFFFFF; stroke-width: 5; stroke-linecap: round; transition: opacity 140ms linear; }
.e-happy { opacity: var(--eHappy); }
.e-sleep { opacity: var(--eSleep); }

/* moments: birth light and done sparkle */
.f-gather { display: none !important; inset: -46%; border-radius: 50%; opacity: 0; background: radial-gradient(closest-side, transparent 50%, color-mix(in srgb, var(--c1) 70%, #fff) 63%, color-mix(in srgb, var(--c2) 40%, transparent) 72%, transparent 86%); }
.face.is-birth .f-gather { display: block !important; }
.f-spark { position: absolute; inset: -20%; pointer-events: none; }
.f-spark i { width: 16%; height: 16%; opacity: 0; background: linear-gradient(135deg, #FFFFFF 10%, var(--c1) 90%); clip-path: polygon(50% 0, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0 50%, 39% 39%); }
.f-spark i:nth-child(1) { top: 2%; right: 8%; }
.f-spark i:nth-child(2) { top: 26%; right: -4%; width: 10%; height: 10%; }
.f-spark i:nth-child(3) { top: 0; left: 14%; width: 11%; height: 11%; }

/* ---------- states: each one is a set of knob values plus a posture ---------- */
.face[data-state="listening"] { --lk: .15; --gk: 0; --sy: .62; --eSX: 1.14; --eSY: 1.16; --core: 1.2; --gs: 1.25; }
.face[data-state="listening"] .f-pose { transform: translateY(4%) scale(1.06); }
.face[data-state="thinking"] { --lk: 0; --gk: 0; --sy: -.78; --eSX: .92; --eSY: .92; --swk: .55; --core: 1.25; --gs: 1.4; }
.face[data-state="thinking"] .f-gaze { animation: gazeDrift 2.6s ease-in-out infinite alternate; }
.face[data-state="thinking"] .f-swirl { animation: spin 3.4s linear infinite; }
.face[data-state="working"] { --lk: 0; --gk: 0; --sy: .22; --eSX: 1.06; --eSY: .86; --swk: .8; --core: 1.5; --gs: 2.1;
  --clL: polygon(-40% 20%, 140% 24%, 140% 140%, -40% 140%); --clR: polygon(-40% 24%, 140% 20%, 140% 140%, -40% 140%); }
.face[data-state="working"] .f-swirl { animation: spin 1.5s linear infinite; }
.face[data-state="working"] .f-glow { animation: glowPulse 1.3s ease-in-out infinite alternate; }
.face[data-state="done"] { --lk: .4; --gk: 0; --eOpen: 0; --eHappy: 1; --core: 1.3; --gs: 1.6; }
.face[data-state="waiting"] { --lk: 0; --gk: 0; --sx: 0; --sy: 0; --eSX: 1.08; --eSY: 1.08; --gs: 1.2; }
.face[data-state="waiting"] .f-pose { animation: nudge 3.6s ease-in-out infinite; }
.face[data-state="stuck"] { --lk: 0; --gk: 0; --sy: .32; --eSX: .96; --eSY: .94; --veil: .34; --veilc: #2B2E3A; --core: .55; --gs: .45;
  --clL: polygon(-40% 46%, 140% 0%, 140% 140%, -40% 140%); --clR: polygon(-40% 0%, 140% 46%, 140% 140%, -40% 140%); }
.face[data-state="stuck"] .f-pose { transform: rotate(-6deg) translateY(3%); }
.face[data-state="asleep"] { --lk: 0; --gk: 0; --sy: .22; --eOpen: 0; --eSleep: 1; --veil: .26; --veilc: #8E93A8; --core: .5; --gs: .3; }
.face[data-state="asleep"] .f-pose { transform: translateY(5%) scale(.985, .96); }
@keyframes gazeDrift { from { transform: translate(calc(var(--s) * -.035), 0); } to { transform: translate(calc(var(--s) * .035), calc(var(--s) * -.014)); } }
@keyframes spin { to { transform: rotate(1turn); } }
@keyframes nudge {
  0%, 72%, 100% { transform: none; }
  78% { transform: translateY(-9%) scale(.97, 1.04); }
  84% { transform: translateY(0) scale(1.05, .95); }
  90% { transform: translateY(-3%) scale(1, 1); }
  95% { transform: none; }
}
/* moment overlays, set briefly by script (they win over the state) */
.face.is-wide { --eSX: 1.22; --eSY: 1.24; }
.face.is-look { --lk: 0; --gk: 0; --sx: 0; --sy: 0; }
.face.is-up { --sy: -.32; }
.face.is-squint { --eOpen: 0; --eHappy: 1; --eSleep: 0; }
.face.is-shut { --eOpen: 0; --eHappy: 0; --eSleep: 1; }

/* under 24px: still orb with eyes, no glow, no motion */
.face--still, .face--still * { animation: none !important; }
.face--still .f-eyes { transition: none; }
/* faces off screen stop moving */
.face--live:not(.is-vis) * { animation-play-state: paused !important; }
/* reduced motion: nothing moves; expressions still change as still frames */
.is-reduced .face, .is-reduced .face *, .is-reduced .o1 * { animation: none !important; transition: none !important; }
.is-reduced .dot--working::after { animation: none; display: none; }
.is-reduced .breathe { animation: none !important; }

/* ---------- O1, kept as it was, for the comparison ---------- */
.o1 { position: relative; display: block; flex: none; width: var(--s); height: var(--s); direction: ltr; }
.o1 i { position: absolute; display: block; pointer-events: none; }
.o1__glow { inset: -30%; border-radius: 50%; background: radial-gradient(closest-side, var(--c2) 56%, color-mix(in srgb, var(--c2) 55%, transparent) 66%, transparent 100%); opacity: var(--o1-glow); }
.o1__body { position: absolute; inset: 0; overflow: hidden; border-radius: 50%; background: var(--c3); isolation: isolate; }
.o1 .a-base { inset: -30%; background: linear-gradient(160deg, var(--c1) 24%, var(--c2) 52%, var(--c3) 80%); animation: aDrift 11s ease-in-out infinite alternate both; }
.o1 .a-band { top: 50%; bottom: 6%; left: -25%; right: -25%; background: radial-gradient(closest-side, color-mix(in srgb, var(--c3) 85%, transparent), transparent); animation: aBand 8s ease-in-out infinite alternate both; }
.o1 .a-gloss { top: 4%; left: 20%; right: 20%; height: 28%; border-radius: 50%; background: radial-gradient(closest-side, rgba(255,255,255,.3), rgba(255,255,255,0)); }
@keyframes aDrift { from { transform: translate(-7%, -6%) rotate(-12deg); } to { transform: translate(6%, 7%) rotate(14deg); } }
@keyframes aBand { from { transform: translate(-14%, -4%) scale(1, .9); } to { transform: translate(12%, 6%) scale(1.1, 1.05); } }
.o1__rim { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.o1__rim use { fill: none; stroke-width: 2; }
.o1__rim .rd { stroke: url(#o1Rim); opacity: var(--o1-rd); }
.o1__rim .rl { stroke: var(--c3); opacity: calc(var(--o1-rl) * .5); }
.o1__eyes { position: absolute; left: 50%; top: 40%; width: 0; height: 0; z-index: 2; }
.o1__eyes i { top: calc(var(--s) * -.095); width: calc(var(--s) * .085); height: calc(var(--s) * .19); border-radius: 999px; background: #FFFFFF; }
.o1__eyes i:first-child { left: calc(var(--s) * -.19 - var(--s) * .0425); }
.o1__eyes i:last-child { left: calc(var(--s) * .19 - var(--s) * .0425); }

/* ================= 1 · before / after ================= */
.ba { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s4); align-items: end; padding: var(--s10) 0 var(--s2); }
.ba__col { display: grid; justify-items: center; gap: var(--s6); }
.ba__lbl { display: grid; justify-items: center; text-align: center; }
.ba__k { display: block; font-size: var(--fs-sm); font-weight: var(--w-strong); }
.ba__d { display: block; font-size: var(--fs-xs); color: var(--text-3); }
.changes { list-style: none; margin: var(--s5) 0 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s3) var(--s8); }
@media (max-width: 767px) { .changes { grid-template-columns: minmax(0, 1fr); } }
.changes li { font-size: var(--fs-sm); line-height: var(--lh-ar); color: var(--text-2); }
.changes b { color: var(--text-1); font-weight: var(--w-strong); }

/* ================= 2 · meet the team ================= */
.team { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s4); }
@media (max-width: 1023px) { .team { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 559px) { .team { grid-template-columns: minmax(0, 1fr); } }
.team.is-grey .fw { filter: grayscale(1); }
.tcard { display: grid; justify-items: center; align-content: start; gap: var(--s2); padding: var(--s10) var(--s5) var(--s6); background: var(--bg-pane); border-radius: var(--r-lg); box-shadow: var(--shadow-card); text-align: center; --ring: var(--bg-pane); min-width: 0; }
.tcard__face { margin-bottom: var(--s6); }
.tcard__name { margin: 0; font-size: var(--fs-lg); font-weight: var(--w-strong); line-height: 1.5; }
.tcard__en { font-size: var(--fs-xs); font-weight: var(--w-regular); color: var(--text-3); margin-inline-start: 6px; }
.tag { display: inline-flex; align-items: center; min-height: 22px; padding: 0 8px; border-radius: var(--r-full); background: var(--bg-tertiary); font-size: var(--fs-xs); color: var(--text-1); }
.tcard__line { margin: var(--s1) 0 0; max-width: 34ch; font-size: var(--fs-base); line-height: var(--lh-ar); color: var(--text-2); }
.tcard__sig { margin: var(--s2) 0 0; font-size: var(--fs-xs); line-height: 1.6; color: var(--text-3); }

/* ================= 3 · feelings ================= */
.feel { display: grid; grid-template-columns: minmax(0, 380px) minmax(0, 1fr); gap: var(--s6); align-items: start; }
@media (max-width: 899px) { .feel { grid-template-columns: minmax(0, 1fr); } }
.feel__stage { display: grid; justify-items: center; align-content: center; gap: var(--s2); min-height: 340px; padding: var(--s12) var(--s4) var(--s6); text-align: center; }
.feel__face { margin-bottom: var(--s6); }
.feel__st { display: inline-flex; align-items: center; gap: 8px; margin: 0; font-size: var(--fs-base); font-weight: var(--w-strong); }
.feel__desc { margin: 0; max-width: 38ch; min-height: calc(2 * 1.7em); font-size: var(--fs-sm); line-height: var(--lh-ar); color: var(--text-2); }
.feel__ctrl { display: grid; gap: var(--s6); align-content: start; min-width: 0; }
fieldset.grp { border: 0; margin: 0; padding: 0; min-width: 0; }
.grp > legend, .grp__l { display: block; padding: 0; margin: 0 0 var(--s3); font-size: var(--fs-base); font-weight: var(--w-strong); }
.grp__en { margin-inline-start: 6px; font-size: var(--fs-xs); font-weight: var(--w-regular); color: var(--text-3); }
.states { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: var(--s1); padding: var(--s2); }
@media (max-width: 1023px) { .states { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
@media (max-width: 559px) { .states { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.stc { display: grid; justify-items: center; align-content: start; gap: var(--s4); padding: var(--s8) var(--s1) var(--s3); border-radius: var(--r-md); text-align: center; min-width: 0; }
.stc__w { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-xs); color: var(--text-1); white-space: nowrap; }
.stc__h { display: block; font-size: var(--fs-xs); color: var(--text-3); }
button.stc { width: 100%; transition: background-color var(--dur-fast) var(--ease-out); }
@media (hover: hover) { button.stc:hover { background: var(--bg-hover); } }

/* ================= 4 · moments ================= */
.mom { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 400px); gap: var(--s6); align-items: start; }
@media (max-width: 899px) { .mom { grid-template-columns: minmax(0, 1fr); } }
.mom__stage { display: flex; align-items: flex-end; justify-content: center; gap: var(--s12); min-height: 320px; padding: var(--s12) var(--s4) var(--s6); }
.mom__who { display: grid; justify-items: center; gap: var(--s6); text-align: center; min-width: 0; }
.mom__cap { display: grid; gap: 0; font-size: var(--fs-xs); color: var(--text-3); }
.mom__cap b { font-size: var(--fs-sm); font-weight: var(--w-strong); color: var(--text-1); }
.mom__ctrl { display: grid; gap: var(--s5); min-width: 0; }
.field { display: grid; gap: 6px; }
.field label { font-size: var(--fs-xs); color: var(--text-2); }
.input { height: 36px; padding: 0 12px; border-radius: var(--r-sm); background: var(--bg-pane); border: 0.5px solid var(--border-2); font-size: var(--fs-base); color: var(--text-1); outline: none; transition: border-color var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out); }
.input:focus-visible { border-color: var(--border-1); box-shadow: 0 0 0 3px var(--bg-active); outline: none; }
.field__help { font-size: var(--fs-xs); color: var(--text-3); line-height: 1.6; }
.derived { margin: 0; font-size: var(--fs-sm); color: var(--text-1); }
.btn-row { display: flex; flex-wrap: wrap; gap: var(--s2); }
.mlist { margin: 0; display: grid; gap: var(--s3); }
.mlist div { display: grid; gap: 0; }
.mlist dt { font-size: var(--fs-sm); font-weight: var(--w-strong); }
.mlist dd { margin: 0; font-size: var(--fs-sm); color: var(--text-2); line-height: var(--lh-ar); }

/* ================= 5 · in place ================= */
.inplace { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: var(--s4); align-items: start; }
.inplace__sbs { display: grid; gap: var(--s4); min-width: 0; }
@media (max-width: 899px) { .inplace { grid-template-columns: minmax(0, 1fr); } .inplace__sbs { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 599px) { .inplace__sbs { grid-template-columns: minmax(0, 1fr); } }
.sb { background: var(--bg-sidebar); border-radius: var(--r-lg); box-shadow: var(--border-3) 0 0 0 0.5px inset; padding: var(--s3) var(--s3) var(--s4); --ring: var(--bg-sidebar); min-width: 0; }
.sb__label { margin: 0; padding: 0 var(--s3) var(--s2); font-size: var(--fs-sm); color: var(--text-3); }
.agent-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s1); margin: 0; padding: 0; list-style: none; }
.agent-tile { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 100%; min-height: 112px; padding: var(--s2) var(--s1) 6px; border-radius: var(--r-md); --ring: var(--bg-sidebar); transition: background-color var(--dur-fast) var(--ease-out); }
.agent-tile[aria-current="true"] { background: var(--bg-active); --ring: var(--bg-active-solid); }
@media (hover: hover) { .agent-tile:hover { background: var(--bg-hover); --ring: var(--bg-active-solid); } .agent-tile:hover .face { transform: translateY(-2px); } }
.agent-tile__name { display: block; max-width: 100%; font-size: var(--fs-xs); line-height: 16px; text-align: center; color: var(--text-1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.agent-tile__main, .agent-tile__new { display: inline-flex; align-items: center; height: 18px; padding: 0 6px; margin-top: -2px; border-radius: var(--r-full); font-size: var(--fs-xs); line-height: 1; white-space: nowrap; }
.agent-tile__main { background: var(--bg-tertiary); color: var(--text-2); }
.agent-tile[aria-current="true"] .agent-tile__main { background: var(--bg-pane); }
.agent-tile__new { background: var(--primary); color: var(--on-primary); font-weight: var(--w-strong); }

.chat { position: relative; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 600px; min-width: 0; background: var(--bg-chrome); border-radius: var(--r-lg); box-shadow: var(--border-2) 0 0 0 0.5px inset; overflow: hidden; --ring: var(--bg-chrome); }
@media (max-width: 899px) { .chat { height: 560px; } }
.chat__head { display: flex; justify-content: center; align-items: center; height: 64px; padding: 0 var(--s4); }
.head-pill { display: inline-flex; align-items: center; gap: var(--s2); max-width: 100%; min-height: 44px; padding-inline: 7px 14px; border-radius: var(--r-full); background: var(--bg-pane); box-shadow: var(--border-3) 0 0 0 0.5px inset, var(--shadow-pill); font-size: var(--fs-base); --ring: var(--bg-pane); }
.head-pill__name { font-weight: var(--w-strong); white-space: nowrap; }
.head-pill__st { display: inline-flex; align-items: center; gap: 6px; color: var(--text-3); font-size: var(--fs-sm); white-space: nowrap; }
.log { display: flex; flex-direction: column; gap: var(--s6); min-height: 0; overflow-y: auto; padding: var(--s2) var(--s6) var(--s5); scrollbar-width: thin; scrollbar-color: var(--border-2) transparent; }
.log > :first-child { margin-top: auto; }
@media (max-width: 559px) { .log { padding-inline: var(--s4); } }
.divider { align-self: center; font-size: var(--fs-xs); color: var(--text-3); }
.msg { display: grid; justify-items: start; gap: 6px; min-width: 0; }
.msg__from { display: flex; align-items: center; gap: var(--s2); font-size: var(--fs-xs); color: var(--text-2); }
.msg__time { color: var(--text-3); }
.bubble { max-width: min(460px, 100%); padding: 8px 14px; border-radius: var(--r-bubble); border-end-start-radius: 6px; background: var(--bubble-agent); box-shadow: var(--bubble-ring); font-size: var(--fs-msg); line-height: var(--lh-ar); overflow-wrap: anywhere; white-space: pre-wrap; }
.bubble--user { align-self: flex-end; border-end-start-radius: var(--r-bubble); border-end-end-radius: 6px; background: var(--bubble-user); color: var(--on-bubble-user); box-shadow: none; }
.msg__status { margin: 0; font-size: var(--fs-msg); line-height: var(--lh-ar); color: var(--text-2); }

  else if (kind === 'birth') { addTimedClass(f, 'is-shut', 0, 600); addTimedClass(f, 'is-look', 600, 1800); }
  else if (kind === 'greet') { addTimedClass(f, 'is-look', 0, 1200); addTimedClass(f, 'is-up', 0, 600); }
  else if (kind === 'perk') { addTimedClass(f, 'is-wide', 0, 1000); }
}
function blink(f) {
  const kf = [{ transform: 'scaleY(1)' }, { transform: 'scaleY(.08)', offset: .45 }, { transform: 'scaleY(1)' }];
  $$('.f-eye', f).forEach((e) => e.animate(kf, { duration: 150, easing: 'ease-in-out' }));
}

/* ================= life: blinks and glances, one shared scheduler for every visible face ================= */
const VIS = new Set();
let io = null;
function mount(root) {
  if (!io) io = new IntersectionObserver((ents) => ents.forEach((e) => {
    e.target.classList.toggle('is-vis', e.isIntersecting);
    if (e.isIntersecting) VIS.add(e.target); else VIS.delete(e.target);
  }), { rootMargin: '80px' });
  $$('.face', root).forEach((f) => { applyFace(f); if (f.classList.contains('face--live')) io.observe(f); });
}
const BLINKS = new Set(['idle', 'listening', 'thinking', 'working', 'waiting', 'stuck']);
function blinkGap(t) {
  if (t.gs === 'precise') return 4000;                 /* organised: a blink like a metronome */
  if (t.gs === 'dart') return rand(1600, 3400);
  if (t.gs === 'steady') return rand(4200, 7000);
  return rand(2600, 5600);
}
/* look vars live on the eyes and the highlight only, so a look never re-resolves the body's animations */
const partsOf = (f) => (f._parts || (f._parts = [$('.f-eyes', f), $('.f-specs', f)]));
function gaze(f, x, y) { const e = partsOf(f)[0]; if (!e) return; e.style.setProperty('--gx', x); e.style.setProperty('--gy', y); }
function ungaze(f) { const e = partsOf(f)[0]; if (!e) return; e.style.removeProperty('--gx'); e.style.removeProperty('--gy'); }
function glance(f, t) {
  const side = Math.random() < .5 ? -1 : 1;
  const steps = {
    steady:  [[side * .55, .05, 1700]],
    dart:    [[side * .8, -.15, 320], [-side * .8, .1, 300]],
    soft:    [[side * .5, .3, 1300]],
    up:      [[side * .35, -.95, 2000]],
    precise: [[side * .6, 0, 700], [-side * .6, 0, 700]],
    nod:     [[0, .45, 1100]],
  }[t.gs] || [[side * .5, 0, 1200]];
  if (t.gs === 'nod') play(f, 'nod');
  f._busy = true;
  let at = 0;
  steps.forEach(([x, y, hold]) => {
    setTimeout(() => { if (f.dataset.state === 'idle') gaze(f, x, y); }, at);
    at += hold + t.gd;
  });
  setTimeout(() => { ungaze(f); f._busy = false; }, at);
}
setInterval(() => {
  if (S.reduced || document.hidden) return;
  const now = performance.now();
  VIS.forEach((f) => {
    if (!f.isConnected) { VIS.delete(f); return; }
    const t = f._t; if (!t) return;
    const st = f.dataset.state;
    if (!f._nb) f._nb = now + rand(600, 4000);
    if (!f._ng) f._ng = now + rand(1200, t.glance * 1000);
    if (BLINKS.has(st) && now >= f._nb) {
      blink(f); f._nb = now + blinkGap(t);
      if (t.gs === 'soft' && Math.random() < .3) setTimeout(() => blink(f), 260);   /* warm: a friendly double blink */
    }
    if (st === 'idle' && !f._busy && now >= f._ng) { glance(f, t); f._ng = now + t.glance * 1000 * rand(.7, 1.4); }
  });
}, 200);

/* pointer: eyes and the specular highlight lean toward it. Read every rect first, then write. */
const MOT = { mx: null, my: null, raf: 0 };
function lookFrame() {
  MOT.raf = 0;
  const faces = Array.from(VIS);
  if (MOT.mx == null || S.reduced) { faces.forEach((f) => { f._lx = f._ly = null; partsOf(f).forEach((p) => { if (p) { p.style.removeProperty('--lx'); p.style.removeProperty('--ly'); } }); }); return; }
  const rects = faces.map((f) => f.getBoundingClientRect());
  faces.forEach((f, i) => {
    const r = rects[i]; if (!r.width) return;
    const dx = MOT.mx - (r.left + r.width / 2); const dy = MOT.my - (r.top + r.height / 2);
    const dd = Math.hypot(dx, dy) || 1; const k = Math.min(1, dd / 240);
    const lx = ((dx / dd) * k).toFixed(2); const ly = ((dy / dd) * k).toFixed(2);
    if (f._lx === lx && f._ly === ly) return;
    f._lx = lx; f._ly = ly;
    partsOf(f).forEach((p) => { if (p) { p.style.setProperty('--lx', lx); p.style.setProperty('--ly', ly); } });
  });
}
/* the eyes ease over 110–950ms anyway, so ~16 updates a second look the same and cost a quarter */
const queueLook = () => { if (MOT.raf) return; MOT.raf = -1; setTimeout(() => { MOT.raf = requestAnimationFrame(lookFrame); }, 60); };
window.addEventListener('pointermove', (e) => { if (S.reduced || e.pointerType === 'touch') return; MOT.mx = e.clientX; MOT.my = e.clientY; queueLook(); }, { passive: true });
document.documentElement.addEventListener('pointerleave', () => { MOT.mx = null; queueLook(); });
window.addEventListener('blur', () => { MOT.mx = null; queueLook(); });
window.addEventListener('scroll', () => { if (MOT.mx != null) queueLook(); }, { passive: true });

  paintLive();
}

      <div class="pair" style="grid-template-columns: minmax(0, 1fr);">${strip('light')}${strip('dark')}</div>

    <section class="sec" aria-labelledby="h7s">
      ${sec(7, 'h7s', L('اختار الشكل', 'Choose the look'), L('الشكل واللون بيتحفظوا على الوكيل نفسه، فكل اللي في المساحة بيشوفوه زي بعض. اختيارك بيتطبق على الصفحة كلها مرة واحدة.', 'Shape and colour are saved on the Agent itself, so everyone in the workspace sees it the same way. Your pick updates every place on the page at once.'))}
      <div class="look">
        <div class="look__stage">
          ${pressFace('sel', 120, {}, 'look__preview')}
          <p class="look__name" data-bind="name-p"></p>
          <p class="look__meta" data-bind="meta" aria-live="polite"></p>
          <button type="button" class="link-btn" data-act="reset">${L('رجّعه تلقائي', 'Reset to automatic')}</button>
        </div>
        <div class="look__form">
          <fieldset class="grp"><legend>${L('الوكيل', 'Agent')}<span class="grp__en">${L('Agent', 'الوكيل')}</span></legend>
            <div class="opts opts--agents">${AGENTS.map((a) => optLabel('agent', a.id, nameHTML(a.id), L(TEMPERS[a.tk].ar, TEMPERS[a.tk].en), faceHTML(a.id, 20))).join('')}</div>
          </fieldset>
          <fieldset class="grp"><legend>${L('الشكل', 'Shape')}<span class="grp__en">${L('Shape', 'الشكل')}</span></legend>
            <div class="opts">${SHAPES.map((s) => optLabel('shape', s.id, L(s.ar, s.en), L(s.en, s.ar), faceHTML('sel', 20, { so: s.id }))).join('')}</div>
          </fieldset>
          <fieldset class="grp"><legend>${L('اللون', 'Colour')}<span class="grp__en">${L('Colour', 'اللون')}</span></legend>
            <div class="opts">${PRESETS.map((p) => optLabel('preset', p.id, L(p.ar, p.en), L(p.en, p.ar), faceHTML('sel', 20, { po: p.id }))).join('')}</div>
          </fieldset>
        </div>
      </div>
    </section>

    <footer class="foot">
      <p>${L('الألوان تمانية ثابتة ومفيهاش برتقاني (ده لـ«مستنيك» بس). أقل تباين بين العينين البيض وأفتح درجة في أي لون 3.4:1.', 'Eight fixed colours, none orange (that means "waiting on you"). The lowest contrast between the white eyes and the lightest stop of any preset is 3.4:1.')}</p>
      <p>${L('الحركة كلها تحريك وشفافية بس، وبتقف للوشوش اللي برّه الشاشة، وتحت 24px، ومع «من غير حركة». الحالة بتبان على النقطة دايماً.', 'All motion is transform and opacity; it stops for faces off screen, below 24px and with reduced motion. The dot always shows the state.')}</p>
    </footer>
  </main>`;
  $('#new-name-in').value = S.newName;
  $$('.o1-slot').forEach((s) => { s.outerHTML = o1HTML(120, info(S.sel).preset); });
  renderLog();
  mount(document);
  observeMoments();
}

/* ================= chat ================= */
const fromLine = (a, time, face) => `<div class="msg__from">${face}<bdi>${esc(info(a).name)}</bdi>${time ? `<span class="msg__time num">${time}</span>` : ''}</div>`;
function renderLog() {
  const a = S.sel; const c = CHAT[a];
  $('#log-a').innerHTML = `<span class="divider">${L('النهارده', 'Today')}</span>
    <div class="msg">${fromLine(a, L('9:40 ص', '9:40 AM'), faceHTML(a, 24))}<div class="bubble">${esc(L(c.a[0], c.a[1]))}</div></div>
    <div class="bubble bubble--user">${esc(L(c.u[0], c.u[1]))}</div>`;
  $('#log-b').innerHTML = '';
}
function scrollLog(which) { const lg = which === 'a' ? $('#log-a') : null; if (lg) lg.scrollTop = lg.scrollHeight; }
function autosize(ta) { ta.style.height = '44px'; ta.style.height = `${Math.min(120, ta.scrollHeight)}px`; }
function send(which) {
  const ta = $(`#ta-${which}`); if (!ta) return;
  const txt = ta.value.trim(); if (!txt || S.busy) return;
  ta.value = ''; autosize(ta); updateSend(which); closeMenu(); S.mentioned[which].clear();
  const a = S.sel; const c = CHAT[a];
  const log = which === 'a' ? $('#log-a') : $('#log-b');
  if (which === 'b') log.innerHTML = '';
  const u = document.createElement('div'); u.className = 'bubble bubble--user'; u.textContent = txt; log.appendChild(u);
  const row = document.createElement('div'); row.className = 'msg';
  row.innerHTML = `${fromLine(a, '', faceHTML(a, 24, { st: 'live' }))}<p class="msg__status breathe">${L('بيفكر…', 'Thinking…')}</p>`;
  log.appendChild(row); mount(row); scrollLog(which);
  S.busy = true; setLive(a, 'thinking');
  const status = $('.msg__status', row);
  setTimeout(() => { setLive(a, 'working'); status.textContent = L(`شغال: ${c.doing[0]}…`, `Working: ${c.doing[1]}…`); }, 1400);
  setTimeout(() => {
    const b = document.createElement('div'); b.className = 'bubble'; b.textContent = L(c.r[0], c.r[1]);
    status.replaceWith(b); setLive(a, 'done'); scrollLog(which);
  }, 3500);
  setTimeout(() => {
    const f = $('.face', row); if (f) { f.dataset.st = 'idle'; applyFace(f); }
    S.busy = false; setLive(a, 'idle');
    [$('#ta-a'), $('#ta-b')].forEach((t) => { if (t && t.value.trim()) setLive(a, 'listening'); });
  }, 5800);
}
function updateSend(which) { const ta = $(`#ta-${which}`); const b = $(`.send[data-chat="${which}"]`); if (ta && b) b.disabled = !ta.value.trim() || S.busy; }
function onType(ta) {
  const which = ta.dataset.chat; autosize(ta); updateSend(which);
  if (!S.busy) {
    const any = [$('#ta-a'), $('#ta-b')].some((t) => t && t.value.trim());
    const cur = S.live[S.sel];
    if (any && cur !== 'listening') setLive(S.sel, 'listening');
    else if (!any && cur === 'listening') setLive(S.sel, 'idle');
  }
  /* @mentions: a newly typed name makes that Agent perk up in the list */
  const now = new Set(AGENTS.filter((A) => ta.value.includes(`@${A.name}`) || ta.value.toLowerCase().includes(`@${A.en.toLowerCase()}`)).map((A) => A.id));
  now.forEach((id) => { if (!S.mentioned[which].has(id)) perkInList(id); });
  S.mentioned[which] = now;
  updateMenu(ta);
}
function perkInList(id) { $$('.sb .face, .menu .face').forEach((f) => { if (f.dataset.agent === id) play(f, 'perk'); }); }
function updateMenu(ta) {
  const which = ta.dataset.chat; const menu = $(`#menu-${which}`);
  const before = ta.value.slice(0, ta.selectionStart);
  const m = before.match(/@([^@\n]{0,24})$/);
  if (!m) { closeMenu(); return; }
  const q = m[1].trim().toLowerCase();
  const items = AGENTS.filter((A) => !q || A.name.toLowerCase().startsWith(q) || A.en.toLowerCase().startsWith(q));
  if (!items.length || items.some((A) => A.name === m[1].trim())) { closeMenu(); return; }
  const same = S.menu && S.menu.which === which && S.menu.ids.join() === items.map((A) => A.id).join();
  S.menu = { which, ids: items.map((A) => A.id), idx: same ? S.menu.idx : 0, start: before.length - m[0].length };
  if (!same) {
    menu.innerHTML = `<p class="menu__g">${L('نادي وكيل', 'Mention an Agent')}</p>${items.map((A, i) => `<button type="button" class="menu__i" role="option" data-act="mention" data-id="${A.id}" aria-selected="${i === 0}">${faceHTML(A.id, 24, { st: 'live' })}<bdi>${esc(A.name)}</bdi><span class="menu__h" dir="ltr">@${esc(A.en)}</span></button>`).join('')}`;
    mount(menu);
  }
  menu.hidden = false;
  $$('.menu__i', menu).forEach((b, i) => b.setAttribute('aria-selected', String(i === S.menu.idx)));
}
function closeMenu() { $$('.menu').forEach((m) => { m.hidden = true; m.innerHTML = ''; }); S.menu = null; }
function pickMention(id) {
  if (!S.menu) return;
  const ta = $(`#ta-${S.menu.which}`); const A = AGENT[id];
  const after = ta.value.slice(ta.selectionStart);
  ta.value = `${ta.value.slice(0, S.menu.start)}@${A.name} ${after}`;
  const pos = S.menu.start + A.name.length + 2;
  closeMenu(); ta.focus(); ta.setSelectionRange(pos, pos); onType(ta);
}
function openChat(id) {
  if (S.sel !== id) { S.sel = id; }
  if (S.live[id] === 'asleep') S.live[id] = 'idle';   /* opening a sleeping Agent's chat wakes it up */
  renderLog(); paint(); mount($('#log-a'));
  $$('#chat-a .chat__head .face, #chat-b .empty__face .face').forEach((f) => play(f, 'greet'));
}

/* ================= moments section ================= */
function observeMoments() {
  const st = $('#mom-stage'); if (!st || !('IntersectionObserver' in window)) return;
  const o = new IntersectionObserver((ents) => {
    if (ents.some((e) => e.isIntersecting) && !S.bornOnce) { S.bornOnce = true; o.disconnect(); setTimeout(doBirth, 250); }
  }, { threshold: .6 });
  o.observe(st);
}
function doBirth() {
  const f = $('#mom-stage .face[data-ctx="new"]'); const lead = $('#mom-stage .face[data-agent="lead"]');
  if (!f) return;
  play(f, 'birth');
  if (lead && !S.reduced) {   /* Lead turns to watch the new Agent form */
    const a = lead.getBoundingClientRect(); const b = f.getBoundingClientRect();
    const sx = Math.sign((b.left + b.width / 2) - (a.left + a.width / 2)) * .75;
    gaze(lead, sx, .2); lead._busy = true;
    setTimeout(() => { ungaze(lead); lead._busy = false; }, 1800);
  }
}

/* ================= paint: sync controls, words and faces to the state ================= */
function paintLive() {
  const st = S.live[S.sel] || 'idle'; const name = info(S.sel).name;
  $$('[data-bind="status"]').forEach((n) => { n.innerHTML = `<span class="dot dot--${st}" aria-hidden="true"></span>${esc(L(ST[st].ar, ST[st].en))}`; });
  $$('.head-pill').forEach((b) => b.setAttribute('aria-label', `${name} · ${L(ST[st].ar, ST[st].en)}`));
  $$('.agent-tile').forEach((t) => {
    const id = t.dataset.id; const A = AGENT[id]; const s = S.live[id] || 'idle';
    if (id === S.sel) t.setAttribute('aria-current', 'true'); else t.removeAttribute('aria-current');
    t.setAttribute('aria-label', [A.name, A.main ? L('الرئيسي', 'Main') : '', A.fresh ? L('جديد', 'New') : '', L(ST[s].ar, ST[s].en)].filter(Boolean).join(' · '));
  });
  ['a', 'b'].forEach(updateSend);
}
function paint() {
  const root = document.documentElement;
  root.dataset.theme = S.theme;
  root.classList.toggle('is-reduced', S.reduced);
  const I = info(S.sel);
  const setRadio = (name, v) => $$(`input[name="${name}"]`).forEach((i) => { i.checked = i.value === v; });
  setRadio('lang', S.lang); setRadio('theme', S.theme); setRadio('agent', S.sel); setRadio('shape', I.shape); setRadio('preset', I.preset); setRadio('feelagent', S.feelAgent);
  $('#sw-reduced').setAttribute('aria-checked', String(S.reduced));
  $('#sw-grey').setAttribute('aria-checked', String(S.grey));
  $('#team').classList.toggle('is-grey', S.grey);
  $$('[data-bind="name"]').forEach((n) => { n.textContent = I.name; });
  $$('[data-bind="ask"]').forEach((n) => { n.innerHTML = L(`اسأل ${nameHTML(S.sel)} عن أي حاجة`, `Ask ${nameHTML(S.sel)} anything`); });
  $$('[data-bind="ask-p"]').forEach((n) => { n.textContent = L('اكتب طلبك وهو هيسمعك، ولما يخلص هيقولك.', "Type your request; it listens, and tells you when it's done."); });
  $$('[data-bind="name-p"]').forEach((n) => { n.innerHTML = nameHTML(S.sel); });
  $$('.composer__ta').forEach((ta) => { const ph = L(`اكتب لـ ${I.name}…`, `Write to ${I.name}…`); ta.placeholder = ph; ta.setAttribute('aria-label', ph); });
  const lbl = `${L(PRESET[I.preset].ar, PRESET[I.preset].en)} · ${L(SHAPE[I.shape].ar, SHAPE[I.shape].en)}`;
  $('[data-bind="meta"]').textContent = I.auto ? L(`تلقائي: ${lbl}`, `Automatic: ${lbl}`) : L(`اتختار: ${lbl}`, `Chosen: ${lbl}`);
  $('[data-act="reset"]').disabled = I.auto;
  /* feelings */
  const fs = S.feelState; const showSt = fs === 'pressed' ? 'idle' : fs;
  $('#feel-st').innerHTML = fs === 'pressed' ? esc(L(ST.pressed.ar, ST.pressed.en)) : `<span class="dot dot--${showSt}" aria-hidden="true"></span>${esc(L(ST[fs].ar, ST[fs].en))}`;
  $('#feel-desc').textContent = L(ST[fs].dar, ST[fs].den);
  $$('[data-act="feel-state"]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.v === fs)));
  /* the newborn */
  const N = info('new');
  $('#new-name').innerHTML = `<bdi>${esc(N.name)}</bdi>`;
  $('#new-derived').textContent = L(`طبعه: ${TEMPERS[N.tk].ar} · لونه: ${PRESET[N.preset].ar}`, `${TEMPERS[N.tk].en} · ${PRESET[N.preset].en}`);
  /* O1 keeps the same Agent's colours */
  $$('.o1').forEach((o) => { const p = PRESET[I.preset].c; o.style.setProperty('--c1', p[0]); o.style.setProperty('--c2', p[1]); o.style.setProperty('--c3', p[2]); });
  $$('.face').forEach((f) => applyFace(f));
  paintLive();
}

/* ================= events ================= */
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  if (act === 'tile') openChat(b.dataset.id);
  else if (act === 'press') play($('.face', b), 'press');
  else if (act === 'press-in') play($('.face--live', b), 'press');
  else if (act === 'feel-state') {
    const v = b.dataset.v; S.feelState = v;
    const f = $('.feel__stage .face');
    if (v === 'pressed') { f.dataset.st = 'idle'; applyFace(f); paint(); play(f, 'press'); return; }
    if (f.dataset.st === v && v === 'done') { setState(f, 'idle'); }
    f.dataset.st = v; paint(); applyFace(f, false);
  }
  else if (act === 'moment') {
    const v = b.dataset.v; const f = $('#mom-stage .face[data-ctx="new"]');
    if (v === 'birth') doBirth(); else play(f, v);
  }
  else if (act === 'send') send(b.dataset.chat);
  else if (act === 'mention') pickMention(b.dataset.id);
  else if (act === 'reset') { delete S.looks[S.sel]; paint(); play($('.look__preview .face'), 'press'); $('input[name="shape"]:checked').focus(); }
  else if (act === 'reduced') { S.reduced = !S.reduced; $$('.face').forEach(clearMoment); paint(); queueLook(); }
  else if (act === 'grey') { S.grey = !S.grey; paint(); }
});
document.addEventListener('change', (e) => {
  const i = e.target; if (!(i instanceof HTMLInputElement) || i.type !== 'radio') return;
  const v = i.value;
  if (i.name === 'lang') { S.lang = v; closeMenu(); buildPage(); paint(); $('input[name="lang"]:checked').focus(); return; }
  if (i.name === 'theme') S.theme = v;
  else if (i.name === 'feelagent') { S.feelAgent = v; paint(); play($('.feel__stage .face'), 'greet'); return; }
  else if (i.name === 'agent') { S.sel = v; renderLog(); paint(); mount($('#log-a')); play($('.look__preview .face'), 'greet'); return; }
  else if (i.name === 'shape' || i.name === 'preset') {
    const cur = info(S.sel);
    S.looks[S.sel] = { preset: cur.preset, shape: cur.shape, [i.name]: v };
    paint(); play($('.look__preview .face'), 'press'); return;
  }
  paint();
});
document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.classList && t.classList.contains('composer__ta')) onType(t);
  else if (t.id === 'new-name-in') { S.newName = t.value; paint(); }
});
document.addEventListener('keydown', (e) => {
  const t = e.target;
  if (t.classList && t.classList.contains('composer__ta')) {
    if (S.menu && S.menu.which === t.dataset.chat) {
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault(); const n = S.menu.ids.length;
        S.menu.idx = (S.menu.idx + (e.key === 'ArrowDown' ? 1 : -1) + n) % n;
        $$(`#menu-${S.menu.which} .menu__i`).forEach((b, i) => b.setAttribute('aria-selected', String(i === S.menu.idx)));
        return;
      }
      if (e.key === 'Enter' || e.key === 'Tab') { e.preventDefault(); pickMention(S.menu.ids[S.menu.idx]); return; }
      if (e.key === 'Escape') { e.preventDefault(); closeMenu(); return; }
    }
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(t.dataset.chat); }
  }
});
document.addEventListener('focusout', (e) => {
  const t = e.target;
  if (t.classList && t.classList.contains('composer__ta')) setTimeout(() => { if (!document.activeElement || !document.activeElement.closest('.composer')) closeMenu(); }, 120);
});
document.addEventListener('keyup', (e) => { if (e.target.classList && e.target.classList.contains('composer__ta') && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) updateMenu(e.target); });
mqReduce.addEventListener('change', (m) => { S.reduced = m.matches; paint(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) VIS.forEach((f) => { f._nb = 0; f._ng = 0; }); });

buildPage();
paint();
})();
</script>
</body>
</html>
