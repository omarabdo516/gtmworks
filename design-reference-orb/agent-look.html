<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>غيّر شكل الوكيل · O3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap" rel="stylesheet">
<style>
/* OD-LAYOUT-PRIMITIVES v1 — structure only: display, flex/grid, overflow, wrapping, ratio, geometry.
   Put this @layer first; product CSS outside the layer wins ordinary layout rules.
   Native hidden and closed-dialog states take precedence over component display rules. */
@layer od-layout {
  [hidden]:not([hidden="until-found" i]) { display: none !important; }
  dialog:not([open]) { display: none !important; }
  :where(.od-stack,.od-row,.od-row-top,.od-cluster,.od-grid,.od-field,.od-stat,.od-cell,.od-tile) > :where(*) { min-width: 0; }
  .od-stack   { display: flex; flex-direction: column; gap: var(--od-gap, 8px); }
  .od-row     { display: flex; align-items: center; gap: var(--od-gap, 8px); }
  .od-cluster { display: flex; flex-wrap: wrap; align-items: center; gap: var(--od-gap, 8px); }
  .od-fill    { flex: 1 1 0; min-width: 0; }
  .od-fixed   { flex: none; }
  .od-stat, .od-field, .od-cell { display: grid; gap: var(--od-gap, 2px); }
  :where(.od-stat,.od-field,.od-cell) > :where(*) { display: block; }
  .od-icon { display: inline-block; inline-size: var(--od-icon-size, 1em); block-size: var(--od-icon-size, 1em); flex: none; }
  .od-truncate { display: block; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .od-nowrap  { white-space: nowrap; }
}
:root [hidden]:where(:not([hidden="until-found" i])) { display: none; }
/* /OD-LAYOUT-PRIMITIVES v1 */

/* ================= gtmworks tokens (tokens.css) ================= */
:root {
  --bg-chrome: #FCFCFC; --bg-sidebar: #F5F5F5; --bg-pane: #FFFFFF; --bg-elevated: #FFFFFF;
  --bg-hover: #1C1C1C0F; --bg-active: #1C1C1C14; --bg-tertiary: #1C1C1C0F; --bg-subtle: #1C1C1C08;
  --bg-secondary-hover: #1C1C1C1A; --bg-elevated-hover: #F1F1F1; --bg-active-solid: #E9E9E9; --bg-scrim: #00000066;
  --text-1: #1C1C1C; --text-2: #1C1C1CB8; --text-3: #1C1C1CA3; --text-4: #1C1C1C80;
  --border-1: #1C1C1C3D; --border-2: #1C1C1C1F; --border-3: #1C1C1C14;
  --primary: #1C1C1C; --primary-hover: #363636; --on-primary: #FCFCFC; --primary-disabled: #1C1C1C26;
  --btn-secondary-bg: #1C1C1C0F; --btn-secondary-ring: transparent; --btn-secondary-hover: #1C1C1C1A;
  --bubble-agent: #1C1C1C0F; --bubble-user: #1C1C1C; --on-bubble-user: #FFFFFF;
  --accent: #0F766E; --focus: #0F766E; --wait: #DA830E; --wait-text: #985500; --wait-bg: #F5931217;
  --danger-text: #CD2834; --idle-dot: #B5B5B5;
  --shadow-pill: #1C1C1C14 0 4px 12px -1px, #1C1C1C0A 0 1px 2px;
  --shadow-composer: #0000000D 0 2px 8px -1px, #00000008 0 1px 2px;
  --shadow-card: #1C1C1C1F 0 0 0 0.5px, #1C1C1C09 0 2px 8px;
  --shadow-popover: #1C1C1C1A 0 10px 20px -3px, #1C1C1C14 0 4px 6px -4px;
  --bubble-ring: #1C1C1C0F 0 0 0 0.5px inset;
  --font: "IBM Plex Sans Arabic", "Noto Sans Arabic", Tahoma, system-ui, sans-serif;
  --w-regular: 400; --w-strong: 600;
  --fs-xs: 12px; --fs-sm: 13px; --fs-base: 14px; --fs-msg: 15px; --fs-lg: 17px; --fs-xl: 22px; --fs-2xl: 28px;
  --lh-ar: 1.7; --lh-ui: 1.5;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px; --s6: 24px; --s8: 32px; --s10: 40px; --s12: 48px; --s16: 64px;
  --r-xs: 6px; --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-bubble: 18px; --r-composer: 22px; --r-card: 24px; --r-full: 9999px;
  --dur-fast: 150ms; --dur: 200ms; --dur-slow: 280ms;
  --ease-out: cubic-bezier(0.2, 0, 0, 1); --ease-in: cubic-bezier(0.4, 0, 1, 1);
  color-scheme: light;
  /* face knobs, light canvas: soft glow, gentle rim, a real shadow under the orb */
  --glow-k: .2; --rim-k: .42; --sh-l: .4; --sh-d: 0; --o1-glow: .2; --o1-rd: 0; --o1-rl: 1;
}
/* the same light values again, so a light panel can sit inside a dark page */
[data-theme="light"] {
  --bg-chrome: #FCFCFC; --bg-sidebar: #F5F5F5; --bg-pane: #FFFFFF; --bg-elevated: #FFFFFF;
  --bg-hover: #1C1C1C0F; --bg-active: #1C1C1C14; --bg-tertiary: #1C1C1C0F; --bg-subtle: #1C1C1C08;
  --bg-secondary-hover: #1C1C1C1A; --bg-elevated-hover: #F1F1F1; --bg-active-solid: #E9E9E9;
  --text-1: #1C1C1C; --text-2: #1C1C1CB8; --text-3: #1C1C1CA3; --text-4: #1C1C1C80;
  --border-1: #1C1C1C3D; --border-2: #1C1C1C1F; --border-3: #1C1C1C14;
  --primary: #1C1C1C; --primary-hover: #363636; --on-primary: #FCFCFC; --primary-disabled: #1C1C1C26;
  --btn-secondary-bg: #1C1C1C0F; --btn-secondary-ring: transparent; --btn-secondary-hover: #1C1C1C1A;
  --bubble-agent: #1C1C1C0F; --bubble-user: #1C1C1C; --on-bubble-user: #FFFFFF;
  --accent: #0F766E; --focus: #0F766E; --wait: #DA830E; --wait-text: #985500; --wait-bg: #F5931217; --idle-dot: #B5B5B5;
  --shadow-pill: #1C1C1C14 0 4px 12px -1px, #1C1C1C0A 0 1px 2px;
  --shadow-composer: #0000000D 0 2px 8px -1px, #00000008 0 1px 2px;
  --shadow-card: #1C1C1C1F 0 0 0 0.5px, #1C1C1C09 0 2px 8px;
  --shadow-popover: #1C1C1C1A 0 10px 20px -3px, #1C1C1C14 0 4px 6px -4px;
  --bubble-ring: #1C1C1C0F 0 0 0 0.5px inset;
  color-scheme: light;
  --glow-k: .2; --rim-k: .42; --sh-l: .4; --sh-d: 0; --o1-glow: .2; --o1-rd: 0; --o1-rl: 1;
}
[data-theme="dark"] {
  --bg-chrome: #121212; --bg-sidebar: #0E0E0E; --bg-pane: #161616; --bg-elevated: #1F1F1F;
  --bg-hover: #F5F5F50F; --bg-active: #F5F5F514; --bg-tertiary: #F5F5F50F; --bg-subtle: #F5F5F505;
  --bg-secondary-hover: #F5F5F51A; --bg-elevated-hover: #2C2C2C; --bg-active-solid: #262626; --bg-scrim: #000000B2;
  --text-1: #F5F5F5; --text-2: #F5F5F5B8; --text-3: #F5F5F599; --text-4: #F5F5F58A;
  --border-1: #F5F5F538; --border-2: #F5F5F51A; --border-3: #F5F5F50F;
  --primary: #F5F5F5; --primary-hover: #DBDBDB; --on-primary: #121212; --primary-disabled: #F5F5F521;
  --btn-secondary-bg: #F5F5F524; --btn-secondary-ring: #F5F5F55C; --btn-secondary-hover: #F5F5F533;
  --bubble-agent: #F5F5F50F; --bubble-user: #F5F5F52E; --on-bubble-user: #FFFFFF;
  --accent: #2CC3AE; --focus: #5EE0CC; --wait: #E8962A; --wait-text: #F0A443; --wait-bg: #F694121F;
  --danger-text: #FF6463; --idle-dot: #5C5C5C;
  --shadow-pill: #F5F5F51A 0 0 0 0.5px; --shadow-composer: #F5F5F51A 0 0 0 0.5px; --shadow-card: #F5F5F51A 0 0 0 0.5px;
  --shadow-popover: #000000 0 10px 20px -3px, #F5F5F51A 0 0 0 0.5px;
  --bubble-ring: #F5F5F50F 0 0 0 0.5px inset;
  color-scheme: dark;
  /* face knobs, dark canvas: the glow carries the light, the rim is a bright hairline,
     and the floor shows a coloured pool of light instead of a dark shadow */
  --glow-k: .5; --rim-k: 1; --sh-l: .7; --sh-d: .34; --o1-glow: .55; --o1-rd: 1; --o1-rl: 0;
}

/* ================= base ================= */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: var(--font); font-size: var(--fs-base); line-height: 1.6; font-weight: var(--w-regular);
  color: var(--text-1); background: var(--bg-chrome); -webkit-font-smoothing: antialiased;
}
html[lang="en"] body { font-family: "IBM Plex Sans", var(--font); }
bdi { unicode-bidi: isolate; }
button, input, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
[data-theme] { color: var(--text-1); }

.page { max-width: 1200px; margin: 0 auto; padding: var(--s8) var(--s8) var(--s16); }
@media (max-width: 1023px) { .page { padding-inline: var(--s5); } }
@media (max-width: 767px) { .page { padding: var(--s6) var(--s4) var(--s12); } }

/* ---------- top bar ---------- */
.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: var(--s5) var(--s8); padding-bottom: var(--s6); border-bottom: 0.5px solid var(--border-2); }
.top__k { margin: 0 0 var(--s1); font-size: var(--fs-xs); color: var(--text-3); }
.top__t { margin: 0; font-size: var(--fs-xl); font-weight: var(--w-strong); line-height: 1.4; }
.top__sub { margin: var(--s1) 0 0; max-width: 64ch; color: var(--text-2); line-height: var(--lh-ar); }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s3) var(--s5); }
.ctl { display: flex; align-items: center; gap: var(--s2); }
.ctl__label { font-size: var(--fs-xs); color: var(--text-3); white-space: nowrap; }
.seg { display: inline-flex; gap: 2px; padding: 2px; border-radius: var(--r-full); background: var(--bg-pane); box-shadow: var(--border-2) 0 0 0 0.5px inset; border: 0; margin: 0; min-width: 0; }
.seg label { position: relative; display: inline-flex; align-items: center; justify-content: center; min-height: 36px; padding: 0 14px; border-radius: var(--r-full); font-size: var(--fs-sm); color: var(--text-2); cursor: pointer; white-space: nowrap; transition: background-color var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out); }
.seg input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.seg label:has(input:checked) { background: var(--bg-tertiary); color: var(--text-1); font-weight: var(--w-strong); }
.seg label:has(input:focus-visible) { outline: 2px solid var(--focus); outline-offset: 2px; }
@media (hover: hover) { .seg label:hover { color: var(--text-1); } }

.switch { display: inline-flex; align-items: center; width: 32px; height: 20px; padding: 2px; flex: none; border-radius: var(--r-full); background: var(--border-1); transition: background-color var(--dur-fast) var(--ease-out); }
.switch::after { content: ""; width: 16px; height: 16px; border-radius: 50%; background: #FFFFFF; box-shadow: #1C1C1C1F 0 1px 3px; transition: transform var(--dur) var(--ease-out); }
.switch[aria-checked="true"] { background: var(--primary); }
.switch[aria-checked="true"]::after { transform: translateX(-12px); background: var(--bg-pane); }
[dir="ltr"] .switch[aria-checked="true"]::after { transform: translateX(12px); }
[data-theme="dark"] .switch[aria-checked="true"]::after { background: #121212; }
.sw-hit { display: inline-flex; align-items: center; gap: var(--s2); min-height: 40px; cursor: pointer; font-size: var(--fs-sm); color: var(--text-1); }

/* ---------- sections ---------- */
.sec { padding-top: var(--s12); }
.sec__head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: var(--s3) var(--s6); margin-bottom: var(--s4); }
.sec__n { display: block; font-size: var(--fs-xs); color: var(--text-3); }
.sec__t { margin: 0; font-size: var(--fs-msg); font-weight: var(--w-strong); line-height: 1.5; }
.sec__sub { margin: 2px 0 0; max-width: 70ch; font-size: var(--fs-sm); line-height: var(--lh-ar); color: var(--text-2); }
.sub-h { margin: var(--s8) 0 var(--s3); font-size: var(--fs-base); font-weight: var(--w-strong); }
.pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s4); }
@media (max-width: 767px) { .pair { grid-template-columns: minmax(0, 1fr); } }
.canvas { background: var(--bg-sidebar); border-radius: var(--r-lg); box-shadow: var(--border-3) 0 0 0 0.5px inset; padding: var(--s4); --ring: var(--bg-sidebar); min-width: 0; }
.canvas__tag { margin: 0; font-size: var(--fs-xs); color: var(--text-3); }

/* buttons (gtmworks 6.1) */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 36px; padding: 0 16px; border-radius: var(--r-full); font-size: var(--fs-base); font-weight: var(--w-strong); white-space: nowrap; transition: background-color var(--dur-fast) var(--ease-out); }
.btn--primary { background: var(--primary); color: var(--on-primary); }
.btn--secondary { background: var(--btn-secondary-bg); color: var(--text-1); box-shadow: var(--btn-secondary-ring) 0 0 0 1px inset; }
@media (hover: hover) { .btn--primary:hover { background: var(--primary-hover); } .btn--secondary:hover { background: var(--btn-secondary-hover); } }
.link-btn { min-height: 32px; padding: 2px 8px; border-radius: var(--r-xs); font-size: var(--fs-sm); color: var(--text-2); }
@media (hover: hover) { .link-btn:hover:not(:disabled) { background: var(--bg-hover); color: var(--text-1); } }
.link-btn:disabled { color: var(--text-4); cursor: default; }

/* chips (gtmworks 6.2): pressed = solid ink */
.chips { display: flex; flex-wrap: wrap; gap: var(--s2); }
.chip { position: relative; display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding-inline: 12px 14px; border-radius: var(--r-full); background: var(--bg-pane); box-shadow: var(--border-2) 0 0 0 0.5px inset; font-size: var(--fs-sm); white-space: nowrap; cursor: pointer; --ring: var(--bg-pane); transition: background-color var(--dur-fast) var(--ease-out); }
.chip--face { padding-inline: 6px 14px; }
.chip input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
@media (hover: hover) { .chip:hover { background: var(--bg-elevated-hover); --ring: var(--bg-elevated-hover); } }
.chip[aria-pressed="true"], .chip:has(input:checked) { background: var(--primary); color: var(--on-primary); box-shadow: none; --ring: var(--primary); }
@media (hover: hover) { .chip[aria-pressed="true"]:hover, .chip:has(input:checked):hover { background: var(--primary-hover); --ring: var(--primary-hover); } }
.chip:has(input:focus-visible) { outline: 2px solid var(--focus); outline-offset: 2px; }

/* status dots (gtmworks 6.2), one look per product state */
.dot { position: relative; display: inline-block; width: 8px; height: 8px; flex: none; border-radius: 50%; background: var(--idle-dot); }
.dot--thinking, .dot--working { background: var(--accent); }
.dot--working::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: var(--accent); animation: dotPing 1.6s var(--ease-out) infinite; }
@keyframes dotPing { 0% { transform: scale(1); opacity: .55; } 80%, 100% { transform: scale(2.4); opacity: 0; } }
.dot--done { background: var(--text-1); }
.dot--waiting { background: var(--wait); }
.dot--stuck { background: var(--ring, var(--bg-chrome)); box-shadow: inset 0 0 0 2px var(--text-1); }
.dot--asleep { background: var(--ring, var(--bg-chrome)); box-shadow: inset 0 0 0 2px var(--idle-dot); }
.fw { position: relative; display: inline-flex; flex: none; }
.fw > .dot { position: absolute; bottom: 1px; inset-inline-end: 1px; z-index: 4; box-shadow: 0 0 0 2.5px var(--ring, var(--bg-chrome)); }
.fw > .dot--stuck { box-shadow: inset 0 0 0 2px var(--text-1), 0 0 0 2.5px var(--ring, var(--bg-chrome)); }
.fw > .dot--asleep { box-shadow: inset 0 0 0 2px var(--idle-dot), 0 0 0 2.5px var(--ring, var(--bg-chrome)); }
.fw--lg > .dot { width: 12px; height: 12px; bottom: 4px; inset-inline-end: 4px; box-shadow: 0 0 0 3px var(--ring, var(--bg-chrome)); }
.fw--lg > .dot--stuck { box-shadow: inset 0 0 0 2.5px var(--text-1), 0 0 0 3px var(--ring, var(--bg-chrome)); }
.fw--lg > .dot--asleep { box-shadow: inset 0 0 0 2.5px var(--idle-dot), 0 0 0 3px var(--ring, var(--bg-chrome)); }
.face-btn { display: inline-flex; border-radius: 50%; }

/* =====================================================================
   THE FACE
   Layers, outside in: floor shadow · act (one-off moments) · pose (state posture)
   · breath (personality loop) · glow · glass body (deep gradient, flowing colour,
   inner light, volume shade, swirl, veil, specular, rim) · eyes.
   Only transform and opacity animate. Under 24px: a still orb with eyes.
   ===================================================================== */
.face {
  --ew: max(2px, calc(var(--s) * var(--eW, .088)));
  --eh: max(4px, calc(var(--s) * var(--eH, .2)));
  /* expression knobs: states and moments only change these */
  --lk: .6; --gk: 1; --sx: 0; --sy: var(--sy0, 0);
  --eSX: 1; --eSY: 1; --eOpen: 1; --eHappy: 0; --eSleep: 0;
  --clL: var(--clL0, polygon(-40% -40%, 140% -40%, 140% 140%, -40% 140%));
  --clR: var(--clR0, polygon(-40% -40%, 140% -40%, 140% 140%, -40% 140%));
  --core: 1; --gs: 1; --swk: 0; --veil: 0; --veilc: #2B2E3A;
  position: relative; display: block; flex: none; width: var(--s); height: var(--s);
  direction: ltr; transition: transform var(--dur) var(--ease-out);
}
.face .l, .face i { position: absolute; display: block; pointer-events: none; }
.f-act, .f-pose, .f-breath { position: absolute; inset: 0; }
.f-pose { transform-origin: 50% 90%; transition: transform 360ms var(--ease-out); }
.f-breath { transform-origin: 50% 92%; animation: var(--bn, fBreath) var(--br, 5s) ease-in-out var(--d, 0s) infinite; }
@keyframes fBreath {
  0%, 100% { transform: translateY(0) rotate(calc(var(--sw, 0) * -1deg)) scale(1, 1); }
  50% { transform: translateY(calc(var(--s) * var(--bb, .01) * -1)) rotate(calc(var(--sw, 0) * 1deg)) scale(calc(1 + var(--ba, .02) * .5), calc(1 + var(--ba, .02))); }
}
@keyframes fBounce {
  0%, 100% { transform: translateY(0) scale(1.025, .975); }
  14% { transform: translateY(0) scale(1, 1); }
  46% { transform: translateY(calc(var(--s) * var(--bb, .04) * -1)) scale(.99, 1.02); }
  78% { transform: translateY(0) scale(1, 1); }
  88% { transform: translateY(0) scale(1.03, .97); }
}

/* floor: a dark contact shadow on light, a coloured pool of light on dark */
.f-shadow { left: 17%; right: 17%; top: 97%; height: 15%; }
.f-shadow::before, .f-shadow::after { content: ""; position: absolute; border-radius: 50%; }
.f-shadow::before { inset: 0; background: radial-gradient(closest-side, color-mix(in srgb, var(--c4) 55%, #000) 0%, color-mix(in srgb, var(--c4) 20%, transparent) 60%, transparent 100%); opacity: var(--sh-l); }
.f-shadow::after { inset: -40% -18%; background: radial-gradient(closest-side, var(--c2) 0%, color-mix(in srgb, var(--c2) 30%, transparent) 55%, transparent 100%); opacity: var(--sh-d); }

.f-glow {
  inset: calc(-30% * var(--pres, 1)); border-radius: 50%;
  background: radial-gradient(closest-side, var(--c2) 50%, color-mix(in srgb, var(--c2) 45%, transparent) 64%, transparent 100%);
  opacity: calc(var(--glow-k) * var(--gs) * var(--pres, 1));
  transition: opacity 500ms var(--ease-out);
}
@keyframes glowPulse { from { transform: scale(.94); } to { transform: scale(1.1); } }

.f-body { position: absolute; inset: 0; overflow: hidden; border-radius: 50%; background: var(--c3); isolation: isolate; }
.face:not([data-shape="circle"]) .f-body { border-radius: 0; -webkit-mask: var(--mask) center / 100% 100% no-repeat; mask: var(--mask) center / 100% 100% no-repeat; }
.face[data-shape="squircle"] { --mask: var(--mask-squircle); }
.face[data-shape="blob"] { --mask: var(--mask-blob); }
.f-base { inset: 0; background: linear-gradient(158deg, var(--c1) 8%, var(--c2) 42%, var(--c3) 72%, var(--c4) 100%); }
/* flowing colour: one oversized layer carries a light blob (top) and a deep blob (bottom) and turns slowly,
   so the colour moves inside the glass with a single cheap animation */
.f-flows { inset: -25%; border-radius: 50%;
  background:
    radial-gradient(30% 30% at 24% 20%, color-mix(in srgb, var(--c1) 86%, #fff) 0%, color-mix(in srgb, var(--c1) 60%, transparent) 45%, transparent 100%),
    radial-gradient(34% 34% at 76% 80%, var(--c4) 0%, color-mix(in srgb, var(--c4) 55%, transparent) 45%, transparent 100%),
    radial-gradient(26% 26% at 82% 30%, color-mix(in srgb, var(--c2) 80%, var(--c1)) 0%, transparent 100%);
  opacity: calc(.55 + var(--flk, .55) * .45);
  animation: fFlow var(--fl, 12s) ease-in-out var(--d, 0s) infinite alternate both; }
@keyframes fFlow { from { transform: translate(-6%, -3%) rotate(-24deg); } to { transform: translate(6%, 5%) rotate(34deg); } }
/* inner light: glows up from the lower core, like light caught inside glass */
.f-core { inset: 0; background: radial-gradient(62% 34% at 50% 98%, color-mix(in srgb, var(--c1) 55%, #fff) 0%, color-mix(in srgb, var(--c1) 70%, transparent) 38%, transparent 100%), radial-gradient(46% 40% at 50% 62%, color-mix(in srgb, var(--c1) 50%, transparent) 0%, transparent 100%); opacity: calc(.62 * var(--core) * var(--pres, 1)); transition: opacity 500ms var(--ease-out); }
.f-shade { inset: 0; background: radial-gradient(circle at 40% 30%, transparent 58%, color-mix(in srgb, var(--c4) 32%, transparent) 84%, color-mix(in srgb, var(--c4) 62%, transparent) 100%); }
.f-swirl { inset: 5%; border-radius: 50%; opacity: var(--swk); transition: opacity 420ms var(--ease-out);
  background: conic-gradient(from 0deg, transparent 0 8%, color-mix(in srgb, var(--c1) 70%, #fff) 24%, transparent 40% 58%, var(--c1) 76%, transparent 92%);
  -webkit-mask: radial-gradient(closest-side, transparent 30%, #000 54%, #000 68%, transparent 94%); mask: radial-gradient(closest-side, transparent 30%, #000 54%, #000 68%, transparent 94%); }
.f-veil { inset: 0; background: var(--veilc); opacity: var(--veil); transition: opacity 500ms var(--ease-out); }
/* specular: leans a little toward the pointer, like a light source */
.f-specs { position: absolute; inset: 0; transform: translate(calc(var(--lx, 0) * var(--s) * .07), calc(var(--ly, 0) * var(--s) * .05)); transition: transform 420ms var(--ease-out); }
.f-spec { top: 3%; left: 12%; width: 62%; height: 30%; border-radius: 50%; background: radial-gradient(closest-side, rgba(255,255,255,.34), rgba(255,255,255,.1) 60%, rgba(255,255,255,0)); transform: rotate(-16deg); }
.f-spec2 { top: 11%; left: 27%; width: 13%; height: 7%; border-radius: 50%; background: radial-gradient(closest-side, rgba(255,255,255,.95), rgba(255,255,255,0)); transform: rotate(-24deg); }
.f-rim { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.f-rim use { fill: none; stroke: url(#rimLight); stroke-width: 2; opacity: var(--rim-k); }
.face--big .f-rim use { stroke-width: 3; }

/* eyes: all feeling lives here */
.f-eyes {
  position: absolute; left: var(--eX, 50%); top: var(--eYp, 41%); width: 0; height: 0; z-index: 2;
  transform: translate(
    calc((var(--lx, 0) * var(--lk) + var(--gx, 0) * var(--gk) + var(--sx)) * var(--s) * .065),
    calc((var(--ly, 0) * var(--lk) + var(--gy, 0) * var(--gk) + var(--sy)) * var(--s) * .06));
  transition: transform var(--gd, 300ms) var(--ease-out);
}
.f-gaze { position: absolute; left: 0; top: 0; width: 0; height: 0; }
.f-eye { position: absolute; top: calc(var(--eh) / -2); width: var(--ew); height: var(--eh); }
.f-eye--l { left: calc(var(--s) * var(--eG, .185) * -1 - var(--ew) / 2); }
.f-eye--r { left: calc(var(--s) * var(--eG, .185) - var(--ew) / 2); }
.e-open {
  position: absolute; inset: 0; border-radius: var(--eR, 999px); background: #FFFFFF; opacity: var(--eOpen);
  box-shadow: 0 0 calc(var(--s) * .05) color-mix(in srgb, var(--c4) 45%, transparent);
  transition: transform 260ms var(--ease-out), clip-path 260ms var(--ease-out), opacity 140ms linear;
}
.f-eye--l .e-open { transform: rotate(var(--eT, 0deg)) scale(var(--eSX), var(--eSY)); clip-path: var(--clL); }
.f-eye--r .e-open { transform: rotate(calc(var(--eT, 0deg) * -1)) scale(var(--eSX), var(--eSY)); clip-path: var(--clR); }
.e-arc { position: absolute; left: 50%; top: 50%; width: max(5px, calc(var(--ew) * 2.1)); height: max(5px, calc(var(--ew) * 2.1)); transform: translate(-50%, -50%); overflow: visible; }
.e-arc path { fill: none; stroke: #FFFFFF; stroke-width: 5; stroke-linecap: round; transition: opacity 140ms linear; }
.e-happy { opacity: var(--eHappy); }
.e-sleep { opacity: var(--eSleep); }

/* moments: birth light and done sparkle */
.f-gather { display: none !important; inset: -46%; border-radius: 50%; opacity: 0; background: radial-gradient(closest-side, transparent 50%, color-mix(in srgb, var(--c1) 70%, #fff) 63%, color-mix(in srgb, var(--c2) 40%, transparent) 72%, transparent 86%); }
.face.is-birth .f-gather { display: block !important; }
.f-spark { position: absolute; inset: -20%; pointer-events: none; }
.f-spark i { width: 16%; height: 16%; opacity: 0; background: linear-gradient(135deg, #FFFFFF 10%, var(--c1) 90%); clip-path: polygon(50% 0, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0 50%, 39% 39%); }
.f-spark i:nth-child(1) { top: 2%; right: 8%; }
.f-spark i:nth-child(2) { top: 26%; right: -4%; width: 10%; height: 10%; }
.f-spark i:nth-child(3) { top: 0; left: 14%; width: 11%; height: 11%; }

/* ---------- states: each one is a set of knob values plus a posture ---------- */
.face[data-state="listening"] { --lk: .15; --gk: 0; --sy: .62; --eSX: 1.14; --eSY: 1.16; --core: 1.2; --gs: 1.25; }
.face[data-state="listening"] .f-pose { transform: translateY(4%) scale(1.06); }
.face[data-state="thinking"] { --lk: 0; --gk: 0; --sy: -.78; --eSX: .92; --eSY: .92; --swk: .55; --core: 1.25; --gs: 1.4; }
.face[data-state="thinking"] .f-gaze { animation: gazeDrift 2.6s ease-in-out infinite alternate; }
.face[data-state="thinking"] .f-swirl { animation: spin 3.4s linear infinite; }
.face[data-state="working"] { --lk: 0; --gk: 0; --sy: .22; --eSX: 1.06; --eSY: .86; --swk: .8; --core: 1.5; --gs: 2.1;
  --clL: polygon(-40% 20%, 140% 24%, 140% 140%, -40% 140%); --clR: polygon(-40% 24%, 140% 20%, 140% 140%, -40% 140%); }
.face[data-state="working"] .f-swirl { animation: spin 1.5s linear infinite; }
.face[data-state="working"] .f-glow { animation: glowPulse 1.3s ease-in-out infinite alternate; }
.face[data-state="done"] { --lk: .4; --gk: 0; --eOpen: 0; --eHappy: 1; --core: 1.3; --gs: 1.6; }
.face[data-state="waiting"] { --lk: 0; --gk: 0; --sx: 0; --sy: 0; --eSX: 1.08; --eSY: 1.08; --gs: 1.2; }
.face[data-state="waiting"] .f-pose { animation: nudge 3.6s ease-in-out infinite; }
.face[data-state="stuck"] { --lk: 0; --gk: 0; --sy: .32; --eSX: .96; --eSY: .94; --veil: .34; --veilc: #2B2E3A; --core: .55; --gs: .45;
  --clL: polygon(-40% 46%, 140% 0%, 140% 140%, -40% 140%); --clR: polygon(-40% 0%, 140% 46%, 140% 140%, -40% 140%); }
.face[data-state="stuck"] .f-pose { transform: rotate(-6deg) translateY(3%); }
.face[data-state="asleep"] { --lk: 0; --gk: 0; --sy: .22; --eOpen: 0; --eSleep: 1; --veil: .26; --veilc: #8E93A8; --core: .5; --gs: .3; }
.face[data-state="asleep"] .f-pose { transform: translateY(5%) scale(.985, .96); }
@keyframes gazeDrift { from { transform: translate(calc(var(--s) * -.035), 0); } to { transform: translate(calc(var(--s) * .035), calc(var(--s) * -.014)); } }
@keyframes spin { to { transform: rotate(1turn); } }
@keyframes nudge {
  0%, 72%, 100% { transform: none; }
  78% { transform: translateY(-9%) scale(.97, 1.04); }
  84% { transform: translateY(0) scale(1.05, .95); }
  90% { transform: translateY(-3%) scale(1, 1); }
  95% { transform: none; }
}
/* moment overlays, set briefly by script (they win over the state) */
.face.is-wide { --eSX: 1.22; --eSY: 1.24; }
.face.is-look { --lk: 0; --gk: 0; --sx: 0; --sy: 0; }
.face.is-up { --sy: -.32; }
.face.is-squint { --eOpen: 0; --eHappy: 1; --eSleep: 0; }
.face.is-shut { --eOpen: 0; --eHappy: 0; --eSleep: 1; }

/* under 24px: still orb with eyes, no glow, no motion */
.face--still, .face--still * { animation: none !important; }
.face--still .f-eyes { transition: none; }
/* faces off screen stop moving */
.face--live:not(.is-vis) * { animation-play-state: paused !important; }
/* reduced motion: nothing moves; expressions still change as still frames */
.is-reduced .face, .is-reduced .face *, .is-reduced .o1 * { animation: none !important; transition: none !important; }
.is-reduced .dot--working::after { animation: none; display: none; }
.is-reduced .breathe { animation: none !important; }

/* =====================================================================
   O3 · «غيّر الشكل»: the dialog and the places that open it.
   Everything below comes from the approved prototype (index.html): the same
   tokens, radii, buttons, toast, details panel, made-Agent card, settings rows
   and motion. The face above is O2, unchanged.
   ===================================================================== */
:root, [data-theme="light"] { --shadow-modal: #1C1C1C1A 0 20px 32px -5px, #1C1C1C1A 0 8px 12px -6px; --sys-fg: #17181a; }
[data-theme="dark"] { --shadow-modal: #000000 0 20px 32px -5px, #F5F5F51A 0 0 0 0.5px; --sys-fg: #F5F5F5; }
:root { --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px); }
html.is-embed { --safe-t: 50px; --safe-b: 29px; scrollbar-width: none; }
html.is-embed::-webkit-scrollbar, html.is-embed .lk-body::-webkit-scrollbar { display: none; }
html.is-embed .lk-body { scrollbar-width: none; }
.page { max-width: 1280px; }
html.is-embed .page { padding-top: calc(var(--safe-t) + var(--s2)); }
html.is-embed .sec:first-child { padding-top: var(--s4); }

/* motion, from index.html */
@keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@keyframes modalOut { to { opacity: 0; transform: translateY(4px); } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, 4px); } to { opacity: 1; transform: translate(-50%, 0); } }
@keyframes toastOut { to { opacity: 0; transform: translate(-50%, -4px); } }
@keyframes spot { 0%, 45% { box-shadow: 0 0 0 2px var(--text-1); } 100% { box-shadow: 0 0 0 2px transparent; } }
@keyframes sheetUp { from { transform: translateY(100%); } to { transform: none; } }
@keyframes sheetDown { to { transform: translateY(100%); } }

/* buttons from index.html */
.btn { height: 36px; min-height: 0; padding: 0 var(--s4); }
.btn--sm { height: 30px; padding: 0 var(--s3); font-size: var(--fs-sm); }
.btn--primary:disabled, .btn--secondary:disabled { background: var(--primary-disabled); color: var(--text-4); box-shadow: none; cursor: default; }
.link-btn { display: inline-flex; align-items: center; gap: 4px; --od-icon-size: 14px; }
.circle-btn { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; flex: none; border-radius: var(--r-full); background: var(--bg-pane); box-shadow: var(--border-3) 0 0 0 0.5px inset, var(--border-3) 0 0 0 0.5px; color: var(--text-1); --od-icon-size: 18px; transition: background-color var(--dur-fast) var(--ease-out); }
@media (hover: hover) { .circle-btn:hover { background: var(--bg-elevated-hover); } }
.ib { position: relative; display: inline-flex; align-items: center; justify-content: center; min-width: 36px; height: 36px; padding: 0 9px; flex: none; border-radius: var(--r-full); color: var(--text-2); --od-icon-size: 18px; transition: background-color var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out); }
.ib::before { content: ""; position: absolute; inset: -4px; }
@media (hover: hover) { .ib:hover { background: var(--bg-hover); color: var(--text-1); } }
.badge { display: inline-flex; align-items: center; gap: 6px; align-self: flex-start; height: 22px; padding: 0 var(--s2); border-radius: var(--r-full); font-size: var(--fs-xs); background: var(--bg-tertiary); color: var(--text-1); --od-icon-size: 13px; white-space: nowrap; }
.badge--made { background: var(--primary); color: var(--on-primary); font-weight: var(--w-strong); }
/* keyboard rings only after keys; a click or tap keeps just the chosen look */
html[data-input="pointer"] :is(.lk, .places, .lk-dlg) :focus-visible { outline: none; }

/* frame: the page's own controls (as O2) */
.controls .seg { flex: none; }
.sw-hit { white-space: nowrap; }

@media (max-width: 599px) { .ctl--width { display: none; } .sec__head .chips { justify-content: flex-start; } }
.cap { display: flex; align-items: center; justify-content: space-between; gap: var(--s2); min-height: 32px; margin: 0; font-size: var(--fs-xs); color: var(--text-3); }
.cap .link-btn { font-size: var(--fs-xs); }

/* ================= the places ================= */
.places { display: grid; grid-template-columns: minmax(0, 656px) minmax(0, 1fr); gap: var(--s6) var(--s4); align-items: start; }
.place { display: grid; gap: var(--s2); min-width: 0; align-content: start; }
.places__col { display: grid; gap: var(--s6); min-width: 0; align-content: start; }
.dp-pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s4); }
@media (max-width: 1120px) { .places { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 699px) { .dp-pair { grid-template-columns: minmax(0, 1fr); } }

/* details panel (index.html · details) */
.dp { background: var(--bg-chrome); border-radius: var(--r-lg); box-shadow: var(--border-2) 0 0 0 0.5px inset; --ring: var(--bg-chrome); min-width: 0; padding-bottom: var(--s4); }
.dp-top { display: flex; align-items: center; justify-content: flex-end; height: var(--s16); padding: var(--s3); }
.dp-id { display: flex; flex-direction: column; align-items: center; gap: var(--s3); padding: var(--s1) var(--s4) var(--s3); text-align: center; }
.dp-id > div { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; max-width: 100%; }
.dp-id__name { display: inline-flex; align-items: center; gap: var(--s2); font-size: var(--fs-lg); font-weight: var(--w-strong); line-height: 1.4; max-width: 100%; }
.dp-id__name bdi { min-width: 0; overflow-wrap: anywhere; }
.dp-id__badge { font-weight: var(--w-regular); }
.dp-id__role { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 0 4px; font-size: var(--fs-sm); line-height: 1.5; color: var(--text-2); }
.dp-face { position: relative; margin-bottom: var(--s1); }
.dp-face::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; }
/* the Owner's pencil: always there, at the corner across from the state dot */
.fw > .pen { position: absolute; bottom: 2px; inset-inline-start: 2px; z-index: 4; display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 50%; background: var(--bg-pane); color: var(--text-1); box-shadow: 0 0 0 2.5px var(--ring, var(--bg-chrome)), var(--border-1) 0 0 0 0.5px inset; --od-icon-size: 13px; pointer-events: none; }
.segmented { display: flex; justify-content: center; gap: 2px; padding: var(--s1) var(--s4) 10px; }
.segmented > span { padding: 4px 10px; border-radius: var(--r-full); font-size: var(--fs-sm); line-height: 18px; color: var(--text-2); white-space: nowrap; }
.segmented > .is-on { background: var(--bg-tertiary); color: var(--text-1); }
.dp-sections { display: flex; flex-direction: column; gap: 10px; padding: 10px var(--s4) 0; }
.dp-label { margin: 0; padding-inline: var(--s3) 6px; font-size: var(--fs-sm); color: var(--text-2); }
.panel-card { display: flex; flex-direction: column; padding: 4px; border-radius: var(--r-md); background: var(--bg-pane); border: 0.5px solid var(--border-3); margin: 0; }
.panel-row { display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 6px var(--s2); border-radius: var(--r-sm); }
.panel-row__text { display: flex; flex-direction: column; flex: 1 1 0; min-width: 0; }
.panel-row__t { font-size: var(--fs-sm); line-height: 1.5; color: var(--text-1); overflow-wrap: anywhere; }
.panel-row__d { font-size: var(--fs-xs); line-height: 1.5; color: var(--text-3); }

/* chat with the made-Agent card (index.html · chat, cards) */
.chatm { display: grid; background: var(--bg-chrome); border-radius: var(--r-lg); box-shadow: var(--border-2) 0 0 0 0.5px inset; --ring: var(--bg-chrome); min-width: 0; }
.chatm__head { display: flex; justify-content: center; align-items: center; height: var(--s16); padding: 0 var(--s4); }
.head-pill { display: inline-flex; align-items: center; gap: var(--s2); max-width: 100%; min-height: 44px; padding-inline: 7px 14px; border-radius: var(--r-full); background: var(--bg-pane); box-shadow: var(--border-3) 0 0 0 0.5px inset, var(--shadow-pill); font-size: var(--fs-base); --ring: var(--bg-pane); }
.head-pill__name { font-weight: var(--w-strong); white-space: nowrap; }
.chatm__log { display: flex; flex-direction: column; gap: var(--s6); padding: var(--s2) var(--s6) var(--s6); min-width: 0; }
@media (max-width: 599px) { .chatm__log { padding-inline: var(--s4); } }
.divider { align-self: center; font-size: var(--fs-xs); color: var(--text-3); }
.turn { display: flex; flex-direction: column; align-items: flex-start; gap: var(--s2); width: 100%; min-width: 0; }
.turn--user { align-items: flex-end; }
.sender { display: flex; align-items: center; gap: 6px; padding-inline-start: 4px; font-size: var(--fs-xs); line-height: 16px; color: var(--text-2); }
.bubble { max-width: min(460px, 100%); padding: 8px 14px; border-radius: var(--r-bubble); font-size: var(--fs-msg); line-height: var(--lh-ar); box-shadow: var(--bubble-ring); overflow-wrap: anywhere; }
.bubble--agent { background: var(--bubble-agent); color: var(--text-1); border-end-start-radius: 6px; }
.bubble--user { background: var(--bubble-user); color: var(--on-bubble-user); border-end-end-radius: 6px; box-shadow: none; }
.card { width: 100%; max-width: 100%; background: var(--bg-pane); border-radius: var(--r-card); box-shadow: var(--shadow-card); display: flex; flex-direction: column; overflow: clip; --ring: var(--bg-pane); }
.hcard__top { padding: var(--s4) var(--s4) 0; }
.card__head { display: flex; align-items: center; gap: var(--s3); padding: var(--s3) var(--s4) var(--s1); }
.card__titles { display: flex; flex-direction: column; flex: 1 1 0; min-width: 0; padding: 2px 0; }
.card__title { font-size: var(--fs-base); font-weight: var(--w-strong); line-height: 1.5; }
.card__sub { font-size: var(--fs-sm); line-height: 1.6; color: var(--text-2); }
.kv { margin: var(--s3) var(--s4) 0; padding: 2px 0; border-top: 1px solid var(--border-3); border-bottom: 1px solid var(--border-3); }
.kv__row { display: grid; grid-template-columns: 116px minmax(0, 1fr); gap: var(--s3); padding: var(--s2) 0; font-size: var(--fs-sm); line-height: 1.7; }
.kv__row + .kv__row { border-top: 1px solid var(--border-3); }
.kv dt { color: var(--text-2); }
.kv dd { margin: 0; color: var(--text-1); overflow-wrap: anywhere; }
@media (max-width: 599px) { .kv__row { grid-template-columns: 96px minmax(0, 1fr); } }
.ac-never { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.ac-never li { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 var(--s2); border-radius: var(--r-full); background: var(--bg-tertiary); font-size: var(--fs-xs); color: var(--text-1); --od-icon-size: 13px; }
.ac-never .od-icon { color: var(--text-2); }
.card__actions { display: flex; align-items: center; flex-wrap: wrap; gap: var(--s2) var(--s3); padding: 14px var(--s4) var(--s4); }
.ac-actions .btn { flex: 0 1 auto; padding-inline: var(--s5); }
.ac-look { min-height: 36px; padding-inline: var(--s2); }
.ac-tip { display: flex; align-items: center; gap: 6px; margin: -6px 0 0; padding: 0 var(--s4) var(--s4); font-size: var(--fs-xs); line-height: 1.5; color: var(--text-3); --od-icon-size: 13px; }

/* settings · the Agent's page (index.html · settings overlay) */
.setm { background: var(--bg-chrome); border-radius: var(--r-lg); box-shadow: var(--border-2) 0 0 0 0.5px inset; overflow: hidden; --ring: var(--bg-pane); }
.setm.is-spot { animation: spot 1.6s var(--ease-out); }
.sov-bar { display: flex; align-items: center; gap: var(--s2); min-height: 56px; padding-block: var(--s2); padding-inline: var(--s6) var(--s3); border-bottom: 0.5px solid var(--border-3); }
.sov-crumbs ol { display: flex; align-items: center; gap: var(--s2); margin: 0; padding: 0; list-style: none; min-width: 0; font-size: var(--fs-base); line-height: 1.5; }
.sov-crumbs li { display: flex; align-items: center; gap: var(--s2); min-width: 0; color: var(--text-3); white-space: nowrap; }
.sov-crumbs li + li::before { content: "/"; color: var(--text-4); }
.sov-crumb__cur { margin: 0; font-size: var(--fs-base); font-weight: var(--w-strong); line-height: 1.5; color: var(--text-1); }
.sov-crumb__cur:focus { outline: none; }
.setm__page { width: min(720px, 100%); margin-inline: auto; padding: var(--s6) var(--s6) var(--s8); display: flex; flex-direction: column; gap: var(--s6); }
.sov-tabs { justify-content: flex-start; padding: 0; }

const VIS = new Set();

function blinkGap(t) {

    soft:    [[side * .5, .3, 1300]],
    up:      [[side * .35, -.95, 2000]],

const MOT = { mx: null, my: null, raf: 0 };

  const rects = faces.map((f) => f.getBoundingClientRect());
  faces.forEach((f, i) => {

        ${seg(L('الدور', 'Role'), 'role', [['owner', L('المالك', 'Owner')], ['other', L('عضو تاني', 'Other')]])}
        ${sw('sw-reduced', 'reduced', L('من غير حركة', 'Reduced motion'))}
        ${sw('sw-fail', 'fail', L('الحفظ الجاي يفشل', 'Next save fails'))}
      </div>
    </header>`;
}
function bodyHTML() {
  const chips = `<div class="chips">${AGENTS.map((A) => `<label class="chip chip--face">${faceHTML(A.id, 20)}<input type="radio" name="sel" value="${A.id}">${nameB(A.id)}</label>`).join('')}</div>`;
  return `
    <section class="sec" aria-labelledby="h1s">
      ${sec(1, 'h1s', L('الأماكن اللي بتفتحه', 'Where it opens from'), L('دوس على الوش أو على «غيّر». أي اختيار في الحوار بيغيّر الوش هنا ورا الحوار.', 'Press the face or «Change». Every pick in the dialog changes the face here, behind it.'), chips)}
      <div class="places">
        <div class="places__col">
          <div class="dp-pair" id="dp-pair">
            <div class="place"><p class="cap">${L('لوحة التفاصيل · المالك', 'Details panel · Owner')}</p>${dpHTML(true)}</div>
            <div class="place"><p class="cap">${L('لوحة التفاصيل · أي دور تاني', 'Details panel · any other Role')}</p>${dpHTML(false)}</div>
          </div>
          <div class="place" id="place-set"><p class="cap">${L('الإعدادات · صفحة الوكيل', 'Settings · the Agent’s page')}</p>${setHTML()}</div>
        </div>
        <div class="place" id="place-chat"><p class="cap"><span>${L('الشات · بعد ما Lead يعمل وكيل', 'Chat · after Lead makes an Agent')}</span><button type="button" class="link-btn" data-act="birth">${L('شغّل الولادة تاني', 'Play the birth again')}</button></p>${chatHTML()}</div>
      </div>
    </section>
    <section class="sec" aria-labelledby="h2s">
      ${sec(2, 'h2s', L('الحوار لكل وكيل', 'The dialog for each Agent'), L('نفس الحوار للستة. بص على العينين والنَّفَس في صف الطبع قبل ما تختار.', 'The same dialog for all six. Watch the eyes and the breath in the temperament row before you pick.'))}
      <div class="canvas cmp">${AGENTS.map((A) => panelHTML(A.id, `c-${A.id}`, false)).join('')}</div>
    </section>`;
}
function phoneHTML() {
  return `<div class="phone-stage"><div class="phone-frame">
      <span class="hardware-button volume" aria-hidden="true"></span><span class="hardware-button power" aria-hidden="true"></span>
      <div class="phone-screen">
        <iframe class="phone-ifr" title="${esc(L('الصفحة على موبايل 390×844', 'The page on a 390×844 phone'))}"></iframe>
        <div class="status-bar" aria-hidden="true"><span class="status-time">9:41</span><span></span><span class="status-icons">
          <svg class="connectivity" viewBox="0 0 15 12"><path d="M1.5 10.5v-2m4 2v-4.5m4 4.5v-7m4 7v-9"/></svg>
          <svg class="wifi" viewBox="0 0 16 12"><path d="M1.5 4.7a9.2 9.2 0 0 1 13 0M4.2 7.3a5.4 5.4 0 0 1 7.6 0M6.9 10a1.55 1.55 0 0 1 2.2 0"/></svg>
          <svg class="battery" viewBox="0 0 20 11"><rect x=".75" y="1.25" width="16.5" height="8.5" rx="2"/><path d="M18.5 4v3M3.2 3.4h10.4v4.2H3.2z" fill="currentColor" stroke="none"/></svg></span></div>
        <span class="camera-dot" aria-hidden="true"></span><span class="gesture-indicator" aria-hidden="true"></span>
      </div></div></div>`;
}
function embedDoc() {
  const cfg = { lang: S.lang, theme: S.theme, reduced: S.reduced, role: S.role, fail: S.fail, sel: S.sel, looks: S.looks, names: S.names };
  const js = JSON.stringify(cfg).replace(/</g, '\\u003c');
  return SRC.replace('<head>', `<head><script>window.__EMBED=${js};<\/script>`);
}
function buildPage() {
  const html = document.documentElement;
  html.lang = S.lang; html.dir = S.lang === 'ar' ? 'rtl' : 'ltr';
  html.classList.toggle('is-embed', !!EMB);
  document.title = L('غيّر شكل الوكيل · O3', 'Change an Agent’s look · O3');
  closeNow();
  VIS.clear(); if (io) { io.disconnect(); io = null; }
  const phone = !EMB && S.width === 'phone' && !mqPhone.matches;
  $('#app').innerHTML = `<main class="page">${EMB ? '' : topHTML()}${phone ? phoneHTML() : bodyHTML()}</main>`;
  if (phone) { const f = $('.phone-ifr'); f.srcdoc = embedDoc(); }
  mount(document);
  observeBirth();
}

/* ================= paint: words, choices and faces follow the state ================= */
function paint() {
  const root = document.documentElement;
  root.dataset.theme = S.theme;
  root.classList.toggle('is-reduced', S.reduced);
  const setRadio = (name, v) => $$(`input[name="${name}"]`).forEach((i) => { i.checked = i.value === v; });
  setRadio('lang', S.lang); setRadio('theme', S.theme); setRadio('width', S.width); setRadio('role', S.role); setRadio('sel', S.sel);
  const r = $('#sw-reduced'); if (r) r.setAttribute('aria-checked', String(S.reduced));
  const fl = $('#sw-fail'); if (fl) fl.setAttribute('aria-checked', String(S.fail));
  $$('[data-name]').forEach((n) => { n.textContent = info(resolve(n.dataset.name)).name; });
  $$('input[data-f]').forEach((i) => { const I = info(resolve(i.dataset.a)); i.checked = I[i.dataset.f] === i.value; });
  $$('[data-bind="pname"]').forEach((n) => { const I = info(resolve(n.dataset.a)); n.textContent = L(PRESET[I.preset].ar, PRESET[I.preset].en); });
  $$('[data-bind="say"]').forEach((n) => { const I = info(resolve(n.dataset.a)); n.textContent = L(SAY[I.tk][0], SAY[I.tk][1]); });
  $$('[data-bind="words"]').forEach((n) => { n.textContent = wordsOf(resolve(n.dataset.a)); });
  $$('[data-act="reset"]').forEach((b) => { b.disabled = info(resolve(b.dataset.a)).auto; });
  const sel = S.sel; const st = S.live[sel] || 'idle';
  $$('[data-bind="role"]').forEach((n) => { n.textContent = `${L(ROLE[sel][0], ROLE[sel][1])} · ${L(ST[st].ar, ST[st].en)}`; });
  $$('[data-bind="role-only"]').forEach((n) => { n.textContent = L(ROLE[sel][0], ROLE[sel][1]); });
  $$('[data-bind="did"]').forEach((n) => { n.textContent = L(DID[sel][0], DID[sel][1]); });
  $$('[data-bind="main"]').forEach((n) => { n.hidden = !AGENT[sel].main; });
  $$('[data-bind="gear-label"]').forEach((b) => b.setAttribute('aria-label', L(`إعدادات ${info(sel).name}`, `Settings for ${info(sel).name}`)));
  $$('[data-act="dp-face"]').forEach((b) => b.setAttribute('aria-label', b.dataset.owner === '1' ? changeLabel(sel) : L(`${info(sel).name} · دوس على الوش`, `${info(sel).name} · press the face`)));
  $$('[data-act="open-look"]').forEach((b) => b.setAttribute('aria-label', changeLabel(resolve(b.dataset.a))));
  const nm = $('#set-name'); if (nm && document.activeElement !== nm) nm.value = info(sel).name;
  $$('.face').forEach((f) => applyFace(f));
}

/* ================= open and close ================= */
function openDlg(a, opener) {
  const d = $('#lk-dlg'); if (!d || d.open) return;
  S.dlgA = a; S.opener = opener || null; S.returnTo = null;
  d.innerHTML = panelHTML(a, 'dlg', true);
  d.setAttribute('aria-labelledby', 'lk-t-dlg');
  mount(d); paint();
  d.classList.remove('is-closing');
  d.showModal();
  /* first focus on the chosen shape, once the dialog has finished appearing */
  const first = () => { if (!d.open) return; const c = $('input[data-f="shape"]:checked', d) || $('input[data-f]', d); if (c) c.focus(); };
  if (S.reduced) first(); else setTimeout(first, 290);
}
function closeDlg() {
  const d = $('#lk-dlg'); if (!d || !d.open || d.classList.contains('is-closing')) return;
  if (S.reduced) { d.close(); return; }
  d.classList.add('is-closing');
  setTimeout(() => { d.classList.remove('is-closing'); if (d.open) d.close(); }, 190);
}
function closeNow() { const d = $('#lk-dlg'); if (d && d.open) { S.opener = null; S.returnTo = null; d.classList.remove('is-closing'); d.close(); } }
function onClosed() {
  const d = $('#lk-dlg');
  const host = $('#toast-host'); if (host && host.parentElement !== document.body) document.body.appendChild(host);
  d.innerHTML = ''; S.dlgA = null;
  const o = S.opener; const go = S.returnTo; S.opener = null; S.returnTo = null;
  if (go) go();
  else if (o && o.isConnected) o.focus();
}

/* ================= picking saves at once; a failed save puts the pick back ================= */
function commit(a, root, revert) {
  paint();
  if (root) play($('.lk-prev .face', root), 'press');
  const fail = S.fail;
  if (fail) { S.fail = false; paint(); }
  sync();
  if (!fail) return;   /* success: nothing but the face changing */
  setTimeout(() => {
    if (revert() === false) return;
    const ae = document.activeElement;
    paint(); sync();
    if (ae && ae.matches && ae.matches('input[data-f]') && !ae.checked) { const c = $(`input[name="${ae.name}"]:checked`); if (c) c.focus(); }
    toast(L('ما اتحفظش. جرّب تاني.', 'Couldn’t save. Try again.'));
  }, 700);
}
function pick(i) {
  const a = i.dataset.a; const f = i.dataset.f; const v = i.value;
  const before = info(a); const prev = lookOf(a);
  S.looks[a] = { ...prev, [f]: v };
  commit(a, i.closest('.lk'), () => {
    if (info(a)[f] !== v) return false;   /* already changed again */
    const back = { ...lookOf(a), [f]: prev[f] };
    if (before.auto && isAutoLook(a, back)) delete S.looks[a]; else S.looks[a] = back;
    return true;
  });
}
function resetLook(b) {
  const root = b.closest('.lk'); const a = root.dataset.lk; if (info(a).auto) return;
  const prev = lookOf(a);
  delete S.looks[a];
  commit(a, root, () => { if (S.looks[a]) return false; S.looks[a] = prev; return true; });
  const c = $('input[data-f="shape"]:checked', root); if (c) c.focus();
}

/* ================= toast (index.html) ================= */
let toastTimer = 0;
function toast(text, ic = 'x') {
  const host = $('#toast-host');
  const top = $$('dialog[open]').pop(); const home = top || document.body;
  if (host.parentElement !== home) home.appendChild(host);
  host.innerHTML = `<div class="toast">${icon(ic)}<span>${esc(text)}</span></div>`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    const el = host.firstElementChild;
    if (!el || S.reduced) { host.innerHTML = ''; return; }
    el.classList.add('is-leaving');
    setTimeout(() => { if (host.firstElementChild === el) host.innerHTML = ''; }, 140);
  }, 2800);
}

/* ================= going places ================= */
function toSettings(a, fromDlg) {
  const go = () => {
    S.sel = a; paint();
    const box = $('#setm'); if (!box) return;
    box.scrollIntoView({ block: 'center', behavior: S.reduced ? 'auto' : 'smooth' });
    const h = $('#set-cur'); if (h) h.focus({ preventScroll: true });
    box.classList.remove('is-spot'); void box.offsetWidth; box.classList.add('is-spot');
  };
  if (fromDlg) { S.returnTo = go; closeDlg(); } else go();
}
function openAgent(a) {
  S.sel = a; paint();
  const p = $('#dp-pair'); if (p) p.scrollIntoView({ block: 'center', behavior: S.reduced ? 'auto' : 'smooth' });
  $$('.dp-face .face').forEach((f) => play(f, 'greet'));
}
/* the newborn on the card: the approved birth, once, when the card comes into view */
function observeBirth() {
  const card = $('.ac-card'); if (!card || !('IntersectionObserver' in window)) return;
  const o = new IntersectionObserver((ents) => {
    if (ents.some((e) => e.isIntersecting) && !S.bornOnce) { S.bornOnce = true; o.disconnect(); setTimeout(doBirth, 250); }
  }, { threshold: .6 });
  o.observe(card);
}
function doBirth() {
  const f = $('.ac-card .face[data-ctx="born"]'); const lead = $('#chat-lead .face');
  if (!f) return;
  play(f, 'birth');
  if (lead && !S.reduced) { gaze(lead, 0, .7); lead._busy = true; setTimeout(() => { ungaze(lead); lead._busy = false; }, 1800); }
}

/* ================= the phone frame: the same page at 390 × 844 ================= */
function sync() { if (EMB && window.parent !== window) window.parent.postMessage({ type: 'o3-sync', looks: S.looks, names: S.names, fail: S.fail, sel: S.sel }, '*'); }
function postCfg() { const f = $('.phone-ifr'); if (f && f.contentWindow) f.contentWindow.postMessage({ type: 'o3-cfg', cfg: { theme: S.theme, reduced: S.reduced, fail: S.fail } }, '*'); }
window.addEventListener('message', (e) => {
  const m = e.data; if (!m || typeof m !== 'object') return;
  if (m.type === 'o3-sync' && !EMB) { S.looks = m.looks || {}; S.names = m.names || {}; S.fail = !!m.fail; S.sel = m.sel || S.sel; paint(); }
  else if (m.type === 'o3-cfg' && EMB) { Object.assign(S, m.cfg); $$('.face').forEach(clearMoment); paint(); queueLook(); }
});

/* ================= events ================= */
document.addEventListener('pointerdown', () => { document.documentElement.dataset.input = 'pointer'; }, true);
document.addEventListener('keydown', (e) => { if (!e.metaKey && !e.ctrlKey && !(e.target instanceof HTMLInputElement && e.target.type === 'text')) document.documentElement.dataset.input = 'key'; }, true);
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  if (act === 'press') play($('.face', b), 'press');
  else if (act === 'dp-face') { play($('.face', b), 'press'); if (b.dataset.owner === '1') setTimeout(() => openDlg(S.sel, b), S.reduced ? 0 : 160); }
  else if (act === 'open-look') openDlg(resolve(b.dataset.a), b);
  else if (act === 'close') closeDlg();
  else if (act === 'reset') resetLook(b);
  else if (act === 'all') toSettings(b.closest('.lk').dataset.lk, !!b.closest('dialog'));
  else if (act === 'to-settings') toSettings(S.sel, false);
  else if (act === 'ac-open') openAgent('training');
  else if (act === 'birth') doBirth();
  else if (act === 'reduced') { S.reduced = !S.reduced; $$('.face').forEach(clearMoment); paint(); queueLook(); postCfg(); }
  else if (act === 'fail') { S.fail = !S.fail; paint(); postCfg(); }
});
document.addEventListener('change', (e) => {
  const i = e.target; if (!(i instanceof HTMLInputElement) || i.type !== 'radio') return;
  if (i.dataset.f) { pick(i); return; }
  const v = i.value;
  if (i.name === 'sel') { S.sel = v; paint(); $$('.dp-face .face').forEach((f) => play(f, 'greet')); return; }
  if (i.name === 'theme') { S.theme = v; paint(); postCfg(); return; }
  if (i.name === 'lang') S.lang = v; else if (i.name === 'role') S.role = v; else if (i.name === 'width') S.width = v;
  buildPage(); paint();
  const back = $(`input[name="${i.name}"]:checked`); if (back) back.focus();
});
/* arrow keys walk one group, the same way in both directions of reading; Tab moves to the next group */
document.addEventListener('keydown', (e) => {
  const i = e.target;
  if (!(i instanceof HTMLInputElement) || !i.dataset.f) return;
  const list = $$(`input[name="${i.name}"]`); const k = list.indexOf(i); const n = list.length;
  const rtl = document.documentElement.dir === 'rtl';
  const step = { ArrowDown: 1, ArrowUp: -1, ArrowRight: rtl ? -1 : 1, ArrowLeft: rtl ? 1 : -1 }[e.key];
  let to = null;
  if (step) to = (k + step + n) % n; else if (e.key === 'Home') to = 0; else if (e.key === 'End') to = n - 1;
  if (to == null) return;
  e.preventDefault();
  const t = list[to]; t.focus();
  if (!t.checked) { t.checked = true; t.dispatchEvent(new Event('change', { bubbles: true })); }
});
/* feel a temperament before picking it: hovering or focusing its little face plays its look and a blink */
function sample(tile) {
  const f = $('.face', tile); if (!f || S.reduced || !f._t || f._busy) return;
  blink(f); glance(f, f._t); f._ng = performance.now() + f._t.glance * 1000;
}
document.addEventListener('pointerover', (e) => {
  if (e.pointerType === 'touch') return;
  const t = e.target.closest('.lk-tiles--t .lk-tile'); if (!t || t.contains(e.relatedTarget)) return;
  sample(t);
});
document.addEventListener('focusin', (e) => { const t = e.target.closest && e.target.closest('.lk-tiles--t .lk-tile'); if (t) sample(t); });
document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.id === 'set-name') { S.names[S.sel] = t.value.trim(); if (!S.names[S.sel]) delete S.names[S.sel]; paint(); sync(); }
});
const dlg = $('#lk-dlg');
dlg.addEventListener('cancel', (e) => { e.preventDefault(); closeDlg(); });
dlg.addEventListener('close', onClosed);
dlg.addEventListener('click', (e) => { if (e.target === dlg) closeDlg(); });
mqReduce.addEventListener('change', (m) => { S.reduced = m.matches; paint(); postCfg(); });
mqPhone.addEventListener('change', () => { if (S.width === 'phone') { buildPage(); paint(); } });
document.addEventListener('visibilitychange', () => { if (!document.hidden) VIS.forEach((f) => { f._nb = 0; f._ng = 0; }); });

buildPage();
paint();

})();
</script>
</body>
</html>
