server {
    listen 8080;
    resolver 127.0.0.11 valid=5s;
    client_max_body_size 51m;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # A client's own X-Forwarded-Host must not name the host Auth writes into an emailed link: empty drops it (issue #40).
    proxy_set_header X-Forwarded-Host "";
    location /auth/v1/ { set $auth auth:9999; rewrite ^/auth/v1/(.*)$ /$1 break; proxy_pass http://$auth; }
    location /rest/v1/ { set $rest rest:3000; rewrite ^/rest/v1/(.*)$ /$1 break; proxy_pass http://$rest; }
    location /storage/v1/ { set $storage storage:5000; rewrite ^/storage/v1/(.*)$ /$1 break; proxy_pass http://$storage; }
    location / { set $web web:3000; proxy_pass http://$web; }
}
