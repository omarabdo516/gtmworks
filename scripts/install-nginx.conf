server {
    listen 8080;
    resolver 127.0.0.11 valid=5s;
    client_max_body_size 51m;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Behind an HTTPS proxy every visitor arrives from one address. This file, written when the gateway starts
    # (scripts/install-gateway-real-ip.sh), believes X-Forwarded-For only from the install network's bridge gateway, the
    # address every connection from the install machine arrives from, and then makes $remote_addr the last address in it:
    # the one the proxy wrote, not one a client put before it. From any other peer $remote_addr stays the connection.
    include /etc/nginx/gtmworks-real-ip.conf;
    # A client's own X-Forwarded-Host must not name the host Auth writes into an emailed link: empty drops it (issue #40).
    proxy_set_header X-Forwarded-Host "";
    # Auth counts its rate limits per value of this header (GOTRUE_RATE_LIMIT_HEADER): the visitor's address, written here
    # and never a client's own value, so a client cannot pick a fresh allowance for each wrong password (issue #41).
    proxy_set_header X-Real-IP $remote_addr;
    # No other address a client claims goes on either (scripts/forged-identity.mjs): the chain starts at this connection.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Forwarded "";
    proxy_set_header Sb-Forwarded-For "";
    proxy_set_header True-Client-IP "";
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header X-Client-IP "";
    proxy_set_header X-Cluster-Client-IP "";
    proxy_set_header Fastly-Client-IP "";
    location /auth/v1/ { set $auth auth:9999; rewrite ^/auth/v1/(.*)$ /$1 break; proxy_pass http://$auth; }
    location /rest/v1/ { set $rest rest:3000; rewrite ^/rest/v1/(.*)$ /$1 break; proxy_pass http://$rest; }
    location /storage/v1/ { set $storage storage:5000; rewrite ^/storage/v1/(.*)$ /$1 break; proxy_pass http://$storage; }
    location / { set $web web:3000; proxy_pass http://$web; }
}
