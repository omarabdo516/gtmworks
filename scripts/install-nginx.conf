# The default log writes the full request line and Referer. The setup link carries its one-time code in the query string
# (issue #50) and emailed sign-in links carry tokens there, so the gateway logs the path alone.
log_format path_only '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent "$http_user_agent"';
server {
    listen 8080;
    access_log /var/log/nginx/access.log path_only;
    resolver 127.0.0.11 valid=5s;
    client_max_body_size 51m;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # A client's own X-Forwarded-Host must not name the host Auth writes into an emailed link: empty drops it (issue #40).
    proxy_set_header X-Forwarded-Host "";
    location /auth/v1/ { set $auth auth:9999; rewrite ^/auth/v1/(.*)$ /$1 break; proxy_pass http://$auth; }
    location /rest/v1/ { set $rest rest:3000; rewrite ^/rest/v1/(.*)$ /$1 break; proxy_pass http://$rest; }
    location /storage/v1/ { set $storage storage:5000; rewrite ^/storage/v1/(.*)$ /$1 break; proxy_pass http://$storage; }
    # The app, for the two locations below.
    set $web web:3000;
    # The error log's format is fixed: on an upstream error it writes the request line and Referer, query string and
    # all. The setup link logs no error, and its page sends no Referer, so no later request's error line carries the code.
    location = /first-run { error_log /var/log/nginx/error.log emerg; add_header Referrer-Policy no-referrer always; proxy_pass http://$web; }
    location / { proxy_pass http://$web; }
}
