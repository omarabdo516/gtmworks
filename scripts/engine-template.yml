# One Company's Engine (ADR 0018): the pinned official Hermes image, unmodified, with its own data volume, its own key
# and its own network. scripts/install.sh writes .engines/first/.env and runs this file as its own Compose project, and
# `gtmworks company add` (#382) writes another engine folder and runs the same file, so every Engine is made the same
# way. The image is the one place the Engine release is pinned; tests/bundled-hermes.test.mjs and the driver check it.
#
# The Company's work sandbox (#393) is in the same project: the second container every Agent's terminal, files and code
# run in, on a network of its own with the Engine beside it. Its names come from the Engine's folder (scripts/install.sh),
# never from this file or the install's environment, so a restore brings them back without a second record.
services:
  engine:
    # The one place the Engine release is pinned, by tag and digest; every Engine of an install runs it, and nothing
    # overrides it.
    image: nousresearch/hermes-agent:v0.23.0@sha256:adb7890916de63245523492be8f68f9d2095fecbec4e2a6dab7960381f0fc002
    restart: unless-stopped
    container_name: ${ENGINE_NAME:?Run scripts/install.sh}
    # The key is required: an Engine with no key must refuse to start rather than serve an API with none. The temp folder
    # (TMPDIR below) is made next, before the gateway, the Engine's user's alone: a fresh volume has none, and Python
    # passes over a TMPDIR that is not there. So is the board's attachments folder (#843), which the sandbox mounts by its
    # path in this volume once the Engine is healthy (below): a mount of a folder that is not there does not start.
    command: [sh, -ec, 'test -n "$${API_SERVER_KEY}" || { echo "The Engine has no key: run scripts/install.sh" >&2; exit 1; }; mkdir -p -m 0700 "$${TMPDIR}"; mkdir -p -m 0755 "$${HERMES_HOME}/kanban/attachments"; exec hermes gateway run']
    # No ports and no env file: the Run API and the management listener are on this Engine's own network only, and only
    # this Engine's own key reaches it. No gtmworks secret is passed to an Engine. The file tools write only under the
    # work folder, which is the sandbox's (#390), so an Agent's file never lands on the Engine's own disk.
    environment:
      API_SERVER_PORT: 8642
      API_SERVER_KEY: ${ENGINE_KEY:?Run scripts/install.sh}
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_SESSION_TOKEN: ${ENGINE_KEY:?Run scripts/install.sh}
      # The dashboard refuses a Host header that is not the address it bound to (DNS-rebinding guard), and the app and
      # the worker reach it by this Engine's container name: the name is declared here as its public host, so the
      # listener still binds the install network's address alone and the name answers there.
      HERMES_DASHBOARD_PUBLIC_URL: http://${ENGINE_NAME:?Run scripts/install.sh}:9119
      HERMES_WRITE_SAFE_ROOT: /work
      # The Screen's driver (#711): the Engine offers computer_use only when it finds cua-driver on its own disk
      # (tools/computer_use/cua_backend_driver.py, resolve_cua_driver_cmd), though with the Screen in the sandbox the one
      # it runs is the sandbox's, over ssh. The screen-driver service below copies the sandbox image's own pinned driver
      # here before the Engine starts, so the Engine never downloads one.
      HERMES_CUA_DRIVER_CMD: /opt/data/screen-driver/cua-driver
      # One short temp folder for every process of the Engine (#833): a board worker runs re-homed to its Agent's
      # profile, and Hermes points TMPDIR at that profile's cache/scratch unless one is set
      # (hermes_constants.apply_scratch_tmp_env). The ssh backend keeps its control socket under it
      # (tools/environments/ssh.py), and under a profile named ag- or co- and 32 hex the socket's path ran past Linux's
      # 108 bytes for a Unix socket, so the worker's first command failed (CI run 45854207378). This is the root
      # profile's own scratch, the one the gateway's Conversations already use, so only the workers move.
      TMPDIR: /opt/data/cache/scratch
      # A cont-init hook that fails stops the container (s6-overlay's default carries on): an Engine never serves without
      # the file-sync patch or its listener address (#393).
      S6_BEHAVIOUR_IF_STAGE2_FAILS: 2
    volumes:
      - data:/opt/data
      # The Company's work folder, read-only (#395): the Library lists an Agent's folder through the Engine's own file
      # routes, which serve only under /opt/data, and the Engine can never write into it. Not at /work: the file tools'
      # write root (HERMES_WRITE_SAFE_ROOT) stays a path the Engine itself does not hold, as the probe measured it.
      - work:/opt/data/work:ro
      # The backend the Engine's terminal, file and code tools use, pinned so no profile and no Settings write can move
      # them back onto the Engine's own disk (ADR 0018).
      - ./engine-managed.yml:/etc/hermes/config.yaml:ro
      # The ssh backend's file sync, off (#393): a hook before s6 starts any service patches the Engine's own copy to take
      # the terminal.ssh_sync_files key the managed configuration sets, and fails the start if the pinned text moved.
      - ./engine-ssh-sync-files.sh:/etc/cont-init.d/06-engine-ssh-sync-files:ro
      # A ChatGPT sign-in from Settings adds its account beside the Company's others and never overwrites one (#618): a
      # hook before s6 starts any service patches the Engine's own copy, and fails the start if the pinned text moved.
      - ./engine-codex-accounts.sh:/etc/cont-init.d/07-engine-codex-accounts:ro
      # A request that runs out of one subscription account goes on, in the Owner's order, on the next account of its kind
      # left switched on, and the Engine records each move (#621): the same kind of hook, which fails the start if the
      # pinned text moved.
      - ./engine-pool-order.sh:/etc/cont-init.d/08-engine-pool-order:ro
      # The one way the listeners learn the address the install network gave this Engine: a hook that runs before s6
      # starts any service writes it into the container's environment, so the gateway and the dashboard bind there and
      # never to the wildcard address the sandbox's network could reach (#390).
      - ./engine-listener-address.py:/etc/hermes/listener-address.py:ro
      - ./engine-listener-address.sh:/etc/cont-init.d/05-engine-listener-address:ro
    depends_on:
      screen-driver:
        condition: service_completed_successfully
    networks:
      engine:
      work:
    healthcheck:
      test: [CMD, /opt/hermes/.venv/bin/python, /etc/hermes/listener-address.py, --health]
      interval: 5s
      timeout: 10s
      start_period: 120s
      retries: 60

  screen-driver:
    # The Screen's driver for the Engine (#711): a one-off run of the work sandbox image, at every start of the Engine,
    # copies the image's own pinned cua-driver into the Engine's data volume, where HERMES_CUA_DRIVER_CMD names it, and
    # exits; the Engine starts once it has. An updated sandbox image brings its driver to the Engine the same way, and an
    # unchanged one is not copied again. It runs as root with only the right to write into the Engine's folder, no
    # network and nothing else of the Engine's: the Engine's user owns the volume and the sandbox's user is not that one.
    image: ${SANDBOX_IMAGE:-gtmworks-work-sandbox:local}
    # Named from the Engine's folder as the sandbox and the exit are (scripts/install.sh), never gtmworks-engine-…,
    # which names Engines only; the container stays after it exits and goes with its Engine.
    container_name: ${SCREEN_DRIVER_NAME:-gtmworks-screen-driver}
    restart: "no"
    user: "0:0"
    network_mode: none
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    entrypoint:
      - sh
      - -ec
      - |
        driver=$$(readlink -f "$$(command -v cua-driver)")
        folder=/opt/data/screen-driver
        mkdir -p "$$folder"
        cmp -s "$$driver" "$$folder/cua-driver" && exit 0
        cp "$$driver" "$$folder/cua-driver.new"
        chmod 0755 "$$folder/cua-driver.new"
        mv -f "$$folder/cua-driver.new" "$$folder/cua-driver"
    volumes:
      - data:/opt/data

  sandbox:
    # A source install builds this image (scripts/install.sh work_sandbox_image) and a release pins it by digest; every
    # Company's sandbox of the install runs the same one.
    image: ${SANDBOX_IMAGE:-gtmworks-work-sandbox:local}
    restart: unless-stopped
    container_name: ${SANDBOX_NAME:-gtmworks-sandbox}
    # The image's own ordinary user (pn, uid 1000), no capabilities and no new privileges: the container runs as that
    # user from its first process, and its sshd only ever becomes the user it already is.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # A process limit and shared memory large enough for Chromium (the base image's own browser, which the screen and a
    # rendered page run), and the RAM and CPU a sandbox gets. These defaults are the install's, set here and nowhere else
    # (#400), from measurements the install job repeats (`install-sizes`): one short render (60 frames of 1280x720 drawn
    # by Chromium, joined by ffmpeg) peaked at 337 MiB and took 13.7 s on 2 CPUs (run 44848354569), and the Company's
    # Screen awake with an ads page open peaked at 831 MiB (#711, measured with the pinned Engine's own launcher). A
    # Company has one awake Screen in its sandbox, shared by its Agents (vault decision 0068), so 2g holds it beside a
    # render or the Agents' own commands, and 2 CPUs keep a render to seconds. An update raises a Company's own lower limit to this default once (scripts/install.sh
    # raise_sandbox_memory) and never lowers one. A Company's own memory and CPU
    # limit (`company add --memory --cpus`, `company limits`, #396) is kept in its Engine's folder and replaces these two
    # through scripts/install.sh alone; no value in the shell reaches them, and the process limit and shared memory are
    # the same for every sandbox.
    pids_limit: 2048
    shm_size: 1gb
    mem_limit: ${SANDBOX_MEMORY:-2g}
    cpus: ${SANDBOX_CPUS:-2.0}
    # The disk a sandbox writes to (#507, ADR 0032): nothing on the server's own disk. Its root is read-only; its home and
    # the Company's work folder are on the Company's work disk, one filesystem of a fixed size and inode count that
    # scripts/install.sh makes and mounts (sandbox/work-disk); and the scratch folders the image's tools write are memory
    # of a fixed size, counted in the sandbox's memory limit. The disk's default is the label below, set here and nowhere
    # else: 10 GB holds a Company's files, renders and tool caches with room to spare, and the image file grows on the
    # server's disk only as far as the Company writes. A Company's own size (`company add --disk`, `company limits --disk`)
    # is kept in its Engine's folder as SANDBOX_DISK and replaces it through scripts/install.sh alone.
    labels:
      gtmworks.disk: ${SANDBOX_DISK:-10g}
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
      - /var/tmp:size=256m,mode=1777
    environment:
      # The public key that arrived when the container started; no private key is here, and a sandbox that gets none
      # accepts nobody.
      SSH_AUTHORIZED_KEY: ${SANDBOX_AUTHORIZED_KEY:-}
    volumes:
      # The Company's work folder: one named volume, written by the sandbox only (the Engine reads it, #395).
      - work:/work
      # The sandbox's home, kept on the Company's work disk beside the work folder: the Screen's one browser profile (its
      # sign-ins), the tools' settings and caches. Never in a backup, which takes the work folder only.
      - home:/home/pn
      # The host key is made once with the Engine's key pair and kept here, mounted read-only at the path sshd reads it
      # from, so a recreated container keeps the key its Engine's known_hosts is pinned to.
      - host-key:/home/pn/.ssh-host:ro
      # The Engine's Kanban attachments folder (spec #831, #843), read-only at the same path: the Engine keeps a person's
      # file on a Card there and names it to the Agent working the Card by that absolute path
      # (hermes_cli/kanban_db_context.py, _ctx_attachments: "remote terminal backends need the attachments dir
      # mounted"), and the Agent's terminal and files run here. Only that folder of the Engine's volume, never the rest
      # of it (the Engine's keys and sign-ins are there), and nothing in the sandbox can write in it (ADR 0018). It needs
      # Docker's volume subpath (Engine 26, Compose 2.26), and the folder made by the Engine's start, so the sandbox
      # starts once its Engine is healthy.
      - type: volume
        source: data
        target: /opt/data/kanban/attachments
        read_only: true
        volume:
          subpath: kanban/attachments
    depends_on:
      engine:
        condition: service_healthy
    networks:
      work:
        aliases:
          - sandbox
    healthcheck:
      test: [CMD, python3, -c, "import socket; socket.create_connection(('127.0.0.1',2222),3).close()"]
      interval: 5s
      timeout: 10s
      start_period: 30s
      retries: 30

  exit:
    # The sandbox's one way out (#394): an HTTP proxy that lets HTTP and HTTPS reach public addresses and refuses the
    # install's networks, private, shared, loopback, link-local and cloud metadata addresses, by the address a name
    # resolves to (sandbox/exit.py). It runs from the work sandbox image, so an install loads, pins and updates no second
    # image for it, and it is the one container on the work network with a network that routes out.
    image: ${SANDBOX_IMAGE:-gtmworks-work-sandbox:local}
    restart: unless-stopped
    container_name: ${EXIT_NAME:-gtmworks-exit}
    entrypoint: [python3, /usr/local/lib/gtmworks/exit.py]
    # It listens on its address beside the sandbox, so the sandbox is made first.
    depends_on:
      - sandbox
    # The image's ordinary user, no capability and no new privilege, and small limits: the exit holds nothing and keeps
    # nothing, and no key and no volume reach it.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 1.0
    networks:
      work:
        aliases:
          - exit
      outbound:
    healthcheck:
      test: [CMD, python3, /usr/local/lib/gtmworks/exit.py, --health]
      interval: 5s
      timeout: 10s
      start_period: 30s
      retries: 30

volumes:
  data:
    name: ${ENGINE_VOLUME:?Run scripts/install.sh}
  # Both bind a folder of the Company's work disk, which scripts/install.sh makes (#507): external, so Compose never makes
  # either as a plain volume on the server's own disk, and a sandbox or an Engine whose disk is not mounted does not start.
  work:
    name: ${WORK_VOLUME:-gtmworks-folder-first}
    external: true
  home:
    name: ${SANDBOX_HOME_VOLUME:-gtmworks-home-first}
    external: true
  host-key:
    name: ${SANDBOX_HOST_KEY_VOLUME:-gtmworks-sandbox-hostkey-first}

networks:
  engine:
    name: ${ENGINE_NETWORK:?Run scripts/install.sh}
  work:
    name: ${WORK_NETWORK:-gtmworks-work-first}
    # No route out: the sandbox reaches its Engine and its exit on this network and nothing else (#394).
    internal: true
  outbound:
    # The exit's own network, the one that routes out; only the exit is on it, and it listens on the work network alone.
    name: ${EXIT_NETWORK:-gtmworks-exit-first}
