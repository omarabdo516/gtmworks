  padding: 3cqw; border-radius: 1cqw; background: var(--bg-tertiary); color: var(--text-1); box-shadow: var(--border-2) 0 0 0 0.5px inset; font-size: 1.5em;
}
.scr__canvas--sm { width: auto; padding: 1.4cqw; font-size: 0.8em; }
.scr__canvas--sm.is-on { box-shadow: var(--text-1) 0 0 0 0.4cqw inset; }
.scr__mark { font-size: 0.55em; color: var(--text-3); }
.scr__trio { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1.6cqw; }
.scr__ok {
  position: absolute; top: 0.8cqw; inset-inline-end: 0.8cqw; display: inline-flex; align-items: center; justify-content: center;
  width: 3cqw; height: 3cqw; border-radius: 50%; background: var(--primary); color: var(--on-primary); --od-icon-size: 2cqw;
}
.scr__off {
  grid-column: 1 / -1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.6cqw;
  background: var(--bg-subtle); color: var(--text-3); font-size: 2.6cqw; --od-icon-size: 7cqw;
}
.scr.is-off .scr__bar { opacity: .6; }
.scr__wake { display: grid; gap: 1.4cqw; width: 34%; justify-items: center; }
.scr__off--waking > span:last-child { animation: breathe 1.4s ease-in-out infinite; }
.scr__layer { position: absolute; inset: 0; pointer-events: none; }
.scr__cursor {
  position: absolute; inset-block-start: 0; inset-inline-start: 0; width: 2.8cqw; height: auto; aspect-ratio: 16 / 22;
  transform: translate(calc(var(--x) * 1cqw), calc(var(--y) * 1cqh)); transition: transform 400ms var(--ease-out);
}

/* the card in the details «نشاط» tab */
.scr-st { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-xs); color: var(--text-2); }
.scr-st--wait { color: var(--wait-text); font-weight: var(--w-strong); }
.scr-card { padding: 6px; }
.scr-thumb { display: block; width: 100%; border-radius: var(--r-sm); cursor: pointer; }
.scr-info { display: grid; gap: 2px; padding: 10px 6px 2px; }
.scr-line { font-size: var(--fs-sm); line-height: 1.5; color: var(--text-1); overflow-wrap: anywhere; text-wrap: pretty; }
.scr-apps { font-size: var(--fs-xs); line-height: 1.6; color: var(--text-3); text-wrap: pretty; }
.scr-hand { display: flex; align-items: flex-start; gap: var(--s2); padding: var(--s2) 6px 0; }
.scr-hand .badge { flex: none; }
.scr-hand__t { font-size: var(--fs-xs); line-height: 1.6; color: var(--text-1); padding-top: 2px; }
.scr-acts { display: flex; gap: var(--s2); padding: 10px 6px 4px; }
.scr-acts .btn { flex: 1 1 0; --od-icon-size: 16px; }

/* the large live view */
.viewer { width: min(1180px, calc(100vw - 48px)); height: min(820px, calc(100dvh - 48px)); }
.vw { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; min-height: 0; }
.vw__head { display: flex; align-items: center; gap: var(--s3); padding: var(--s4) var(--s5); border-bottom: 0.5px solid var(--border-3); }
.vw__titles { flex: 1 1 0; min-width: 0; display: grid; }
.vw__title { margin: 0; font-size: var(--fs-lg); line-height: 1.5; }
.vw__sub { font-size: var(--fs-sm); line-height: 1.5; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vw-chip { align-self: center; height: 28px; padding: 0 var(--s3); font-size: var(--fs-sm); --od-icon-size: 14px; flex: none; }
.vw-chip--ctrl { background: var(--primary); color: var(--on-primary); font-weight: var(--w-strong); }
.vw__body { display: grid; grid-template-columns: minmax(0, 1fr) 300px; min-height: 0; }
.vw__stage { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--s3); padding: var(--s5); min-height: 0; overflow-y: auto; background: var(--bg-sidebar); }
.vw__screen, .vw-hand, .vw-off { width: 100%; max-width: min(100%, calc((100dvh - 380px) * 1.6)); }
.vw__screen { min-width: 280px; }
.vw-hand {
  display: flex; align-items: center; gap: var(--s3); padding: var(--s3) var(--s4); border-radius: var(--r-md);
  background: var(--bg-pane); box-shadow: var(--shadow-card); flex-wrap: wrap;
}
.vw-hand .badge { align-self: center; }
.vw-hand__t { flex: 1 1 240px; min-width: 0; display: grid; gap: 2px; }
.vw-hand__t b { font-size: var(--fs-base); line-height: 1.5; }
.vw-hand__t span { font-size: var(--fs-sm); line-height: 1.6; color: var(--text-2); }
.vw-off { display: flex; align-items: center; gap: var(--s3); flex-wrap: wrap; }
.vw-off p { flex: 1 1 260px; margin: 0; font-size: var(--fs-sm); line-height: 1.7; color: var(--text-2); }
.vw-off .btn { --od-icon-size: 16px; }
.vw__log { display: flex; flex-direction: column; gap: var(--s3); min-height: 0; overflow-y: auto; padding: var(--s5) var(--s4); border-inline-start: 0.5px solid var(--border-3); }
.vw__log-h { margin: 0; font-size: var(--fs-sm); font-weight: var(--w-regular); color: var(--text-2); }
.vw-steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.vw-step { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: var(--s2); align-items: start; padding: 6px 0; font-size: var(--fs-sm); line-height: 1.6; color: var(--text-3); overflow-wrap: anywhere; }
.vw-step.is-done { color: var(--text-2); }
.vw-step.is-now { color: var(--text-1); font-weight: var(--w-strong); }
.vw-step__m { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 22px; color: var(--text-2); --od-icon-size: 14px; }
.vw-step.is-now .vw-step__m { color: var(--text-1); }
.vw-step__ring { width: 8px; height: 8px; border-radius: 50%; box-shadow: var(--text-3) 0 0 0 1px inset; }
.vw-step__wait { color: var(--wait-text); font-weight: var(--w-strong); white-space: nowrap; }
.vw-note { margin: auto 0 0; display: flex; align-items: flex-start; gap: 6px; padding-top: var(--s3); border-top: 0.5px solid var(--border-3); font-size: var(--fs-xs); line-height: 1.6; color: var(--text-3); --od-icon-size: 14px; }
.vw-note .od-icon { margin-top: 2px; }
.vw__foot { display: flex; align-items: center; gap: var(--s4); padding: var(--s3) var(--s5); border-top: 0.5px solid var(--border-3); background: var(--bg-chrome); flex-wrap: wrap; }
.vw-mode { flex: 1 1 320px; min-width: 0; display: grid; gap: 2px; font-size: var(--fs-sm); line-height: 1.6; color: var(--text-2); }
.vw-mode b { color: var(--text-1); font-size: var(--fs-base); }
.vw-foot__acts { display: inline-flex; align-items: center; gap: var(--s3); flex-wrap: wrap; }
.vw-foot__acts .btn { --od-icon-size: 16px; }
.vw-take__d { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-xs); color: var(--text-2); --od-icon-size: 14px; white-space: nowrap; }

/* ---- «ربط التطبيقات» sheet ---- */
.apps-inner { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; min-height: 0; }
.apps-head { display: grid; gap: var(--s3); padding: var(--s4) var(--s5) var(--s3); border-bottom: 0.5px solid var(--border-3); background: var(--bg-chrome); }
.apps-head .sheet__top { align-items: center; }
.apps-head .tpl-cats { --od-rail-pad: 0px; }
.apps-count { align-self: center; --od-icon-size: 12px; color: var(--text-2); }
.apps-sub { margin: 0; font-size: var(--fs-sm); line-height: 1.6; color: var(--text-2); }
.apps-body { overflow-y: auto; min-height: 0; overscroll-behavior: contain; padding: var(--s4) var(--s5) var(--s6); display: flex; flex-direction: column; gap: var(--s5); }
.apps-sec { display: grid; gap: 10px; }
.apps-sec__h { margin: 0; padding-inline: 2px; font-size: var(--fs-sm); font-weight: var(--w-regular); color: var(--text-2); }
.apps-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s3); }
.app-card {
  display: flex; flex-direction: column; gap: 10px; padding: var(--s4); border-radius: var(--r-md); min-width: 0;
  background: var(--bg-pane); box-shadow: var(--border-3) 0 0 0 0.5px inset, var(--border-3) 0 0 0 0.5px;
}
.app__top { display: flex; align-items: center; gap: var(--s3); min-width: 0; }
.app__titles { display: grid; min-width: 0; }
.app__name { margin: 0; font-size: var(--fs-base); line-height: 1.5; }
.app__cat { font-size: var(--fs-xs); line-height: 1.5; color: var(--text-3); }
.app__use { margin: 0; font-size: var(--fs-sm); line-height: 1.6; color: var(--text-2); }
.app__foot { display: flex; align-items: center; gap: var(--s2); margin-top: auto; padding-top: 2px; }
.app__state { flex: 1 1 0; min-width: 0; display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-xs); color: var(--text-1); --od-icon-size: 14px; }
.app__state .fstack { margin-inline-start: 4px; }
.app__state--off, .app__none { color: var(--text-3); }
.apps-detail { gap: var(--s5); }
.app-hero { display: flex; align-items: flex-start; gap: var(--s3); }
.app-hero p { margin: 0; flex: 1 1 0; min-width: 0; font-size: var(--fs-msg); line-height: var(--lh-ar); color: var(--text-1); }
.app-kv { margin: 0; }
.app-off { display: grid; gap: var(--s2); padding: var(--s3); border-radius: var(--r-md); background: var(--bg-pane); box-shadow: var(--border-1) 0 0 0 1px inset; }
.app-off p { margin: 0; font-size: var(--fs-sm); line-height: 1.7; color: var(--text-1); }
.apps-sheet .modal__foot { padding-inline: var(--s5); }

/* ---- files library ---- */
.lib-chev { color: var(--text-3); --od-icon-size: 16px; }
.lib-hint { margin: 0; padding-inline: var(--s3); font-size: var(--fs-xs); line-height: 1.6; color: var(--text-3); }
.lib-crumbs { display: flex; align-items: center; gap: 2px; min-height: 22px; padding-inline: 6px; color: var(--text-3); --od-icon-size: 14px; }
.lib-crumbs .link-btn { margin-inline-start: -6px; }
.lib-crumbs__cur { margin: 0; padding: 2px 6px; font-size: var(--fs-sm); font-weight: var(--w-strong); color: var(--text-1); }
.lib-crumbs__cur .muted { font-weight: var(--w-regular); }
.panel-row.lib-file { gap: 4px; padding: 0; }
.lib-file__main { display: flex; align-items: center; gap: 10px; flex: 1 1 0; min-width: 0; min-height: 52px; padding: 6px var(--s2); border-radius: var(--r-sm); text-align: start; transition: background-color var(--dur-fast) var(--ease-out); }
@media (hover: hover) { .lib-file__main:hover { background: var(--bg-hover); } }
.lib-file__main .panel-row__text { display: grid; min-width: 0; flex: 1 1 0; }
.lib-1l { display: block; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lib-thumb {
  width: 36px; height: 36px; flex: none; display: inline-flex; align-items: center; justify-content: center; overflow: hidden;
  border-radius: var(--r-xs); background: var(--bg-tertiary); color: var(--text-2); --od-icon-size: 18px;
}
.lib-thumb img { display: block; max-width: 100%; max-height: 100%; width: auto; height: auto; }
.lib-thumb--lg { width: 44px; height: 44px; border-radius: var(--r-sm); --od-icon-size: 22px; }
.lib-dl { width: 32px; height: 32px; margin-inline-end: 6px; --od-icon-size: 16px; }
.lib-empty { display: grid; justify-items: center; gap: 6px; padding: var(--s5) var(--s3); text-align: center; color: var(--text-3); --od-icon-size: 22px; }
.lib-empty p { margin: 0; font-size: var(--fs-sm); line-height: 1.6; max-width: 32ch; }

/* file preview */
.pv { width: min(760px, calc(100vw - 32px)); height: min(820px, calc(100dvh - 48px)); }
.pv__inner { grid-template-rows: auto minmax(0, 1fr) auto; }
.pv-title { overflow-wrap: anywhere; }
.pv__body { overflow-y: auto; min-height: 0; overscroll-behavior: contain; padding: var(--s2) var(--s6) var(--s6); display: flex; flex-direction: column; gap: var(--s4); }
.pv-h { margin: 0; font-size: var(--fs-msg); line-height: 1.5; }
.pv-copy { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--s3); }
.pv-copy li { display: grid; gap: 6px; padding: var(--s4); border-radius: var(--r-md); background: var(--bg-pane); box-shadow: var(--border-3) 0 0 0 0.5px inset, var(--border-3) 0 0 0 0.5px; }
.pv-copy__l { font-size: var(--fs-xs); color: var(--text-3); }
.pv-copy__t { margin: 0; font-size: var(--fs-msg); line-height: var(--lh-ar); white-space: pre-wrap; overflow-wrap: anywhere; }
.pv-copy .kv { margin: 4px 0 0; }
.pv-copy__n { display: flex; align-items: flex-start; gap: 6px; font-size: var(--fs-sm); line-height: 1.6; color: var(--text-2); --od-icon-size: 14px; }
.pv-copy__n .od-icon { margin-top: 3px; }
.pv-fig { margin: 0; display: grid; justify-items: center; gap: var(--s2); }
.pv-img { display: block; max-width: 100%; max-height: min(540px, calc(100dvh - 300px)); width: auto; height: auto; border-radius: var(--r-sm); box-shadow: var(--border-2) 0 0 0 0.5px; }
.pv-fig figcaption { font-size: var(--fs-xs); color: var(--text-3); }
.pv-article { max-width: 66ch; display: grid; gap: var(--s2); }
.pv-article__h { margin: 0; font-size: var(--fs-lg); line-height: 1.5; }
.pv-article__meta { margin: 0 0 var(--s2); font-size: var(--fs-xs); line-height: 1.6; color: var(--text-3); }
.pv-article h4 { margin: var(--s3) 0 0; font-size: var(--fs-msg); line-height: 1.5; }
.pv-article p { margin: 0; font-size: var(--fs-msg); line-height: var(--lh-ar); }
.pv-article .pv-article__more { margin-top: var(--s3); font-size: var(--fs-sm); color: var(--text-3); }
.pv-stats { --od-cols: 3; --od-gap: var(--s3); }
.pv-stat { padding: var(--s4); border-radius: var(--r-md); background: var(--bg-pane); border: 0.5px solid var(--border-3); --od-gap: 4px; }
.pv-stat__l { font-size: var(--fs-sm); color: var(--text-2); }
.pv-stat__v { font-size: var(--fs-xl); font-weight: var(--w-strong); line-height: 1.25; white-space: nowrap; }
.pv-chart { display: grid; gap: var(--s2); }
.pv-legend { margin-inline-start: 0; }
.pv .demo-note { margin: 0; }

@media (max-width: 1023px) {
  .vw__body { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto; overflow-y: auto; }
  .vw__stage { overflow: visible; }
  .vw__log { border-inline-start: 0; border-top: 0.5px solid var(--border-3); overflow: visible; }
  .vw__screen, .vw-hand, .vw-off { max-width: 100%; }
}
@media (max-width: 599px) {
  .viewer, .pv { width: 100vw; height: 100dvh; border-radius: 0; }
  .vw__head, .vw__foot { padding-inline: var(--s4); }
  .vw__stage { padding: var(--s3); }
  .vw__screen { min-width: 0; }
  .apps-grid { grid-template-columns: minmax(0, 1fr); }
  .apps-head, .apps-body { padding-inline: var(--s4); }
  .pv__body { padding-inline: var(--s4); }
  .pv-stats { --od-cols: 1; }
}
@media (prefers-reduced-motion: reduce) { .scr__cursor { transition: none; } .dot--waking, .scr__off--waking > span:last-child { animation: none; } }

/* ================= responsive ================= */
@media (max-width: 1279px) {
  :root { --sidebar-w: 264px; --details-w: 300px; }
  .kpis { --od-cols: 2; }
  .head-pill { max-width: calc(100% - 320px); }
}
@media (max-width: 1023px) {
  :root { --sidebar-w: 248px; }
  .app { grid-template-columns: var(--sidebar-w) minmax(0, 1fr); }
  .details {
    position: fixed; top: 0; bottom: 0; inset-inline-end: 0; z-index: 40; width: min(340px, 92vw);
    box-shadow: var(--shadow-modal); transform: translateX(-105%); transition: transform var(--dur) var(--ease-out); visibility: hidden;
  }
  .details.is-open { transform: none; visibility: visible; }
  .dash-row { grid-template-columns: minmax(0, 1fr); }
  .page-head, .board-tools, .dash__inner, .board-cols { padding-inline: var(--s5); }
}
@media (max-width: 1023px) { .tpl-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 599px) {
  .tpl-grid { grid-template-columns: minmax(0, 1fr); padding-inline: var(--s4); }
  .modal { width: 100vw; height: 100dvh; border-radius: 0; }
  .modal__head, .modal__tools, .modal__foot, .modal__body { padding-inline: var(--s4); }
  .cr-kinds { grid-template-columns: minmax(0, 1fr); }
  .modal__foot-t { display: none; }
}
@media (max-width: 767px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
  .mobilebar { display: flex; align-items: center; gap: var(--s2); min-height: 56px; padding: 0 var(--s3); background: var(--bg-chrome); }
  .mobilebar__t { font-weight: var(--w-strong); font-size: var(--fs-base); flex: 1 1 0; }
  .sidebar {
    position: fixed; top: 0; bottom: 0; inset-inline-start: 0; z-index: 50; width: min(300px, 86vw);
    transform: translateX(105%); transition: transform var(--dur) var(--ease-out); visibility: hidden; box-shadow: var(--shadow-modal);
  }
  .sidebar.is-open { transform: none; visibility: visible; }
  .scrim { position: fixed; inset: 0; background: var(--bg-scrim); z-index: 45; }
  .kpis { --od-cols: 1; }
  .suggest { grid-template-columns: minmax(0, 1fr); }
  .transcript { padding: 72px var(--s3) var(--s5); }
  .chat .transcript { padding-top: calc(var(--head-h) + var(--s4)); }
  .board-nav__pos { display: none; }
  .composer-area { padding: 0 var(--s3) var(--s3); }
  .page-head { padding: var(--s5) var(--s4) var(--s3); }
  .dash__inner { padding: 0 var(--s4) var(--s8); }
  .board-tools, .board-cols { padding-inline: var(--s4); }
  :root { --col-w: 264px; }
  .head-pill { max-width: calc(100% - 150px); }
  .corner-pill__lbl { display: none; }
  .corner-pill { padding: 0 var(--s3); }
  .empty-chat h2 { font-size: var(--fs-lg); }
  .bubble { max-width: 100%; }
}

/* ---------- motion: friendly and state-driven (faces, press, drag, counters) ---------- */
:root { --ease-spring: cubic-bezier(0.34, 1.45, 0.64, 1); }

/* faces: the features follow the pointer, the eyes blink, a click makes the face hop and smile */
.face__f { transform: translate(var(--fx, 0px), var(--fy, 0px)); transition: transform 240ms var(--ease-out); }
.face__eye { transform-box: fill-box; transform-origin: center; transition: transform 90ms var(--ease-in); }
.face.is-blink .face__eye { transform: scaleY(0.12); }
.face.is-happy { animation: faceHop 460ms var(--ease-spring); }
.face.is-happy .face__eye { transform: scaleY(0.45); transition-duration: 120ms; }
@keyframes faceHop { 0% { transform: none; } 35% { transform: translateY(-4px) scale(1.07); } 100% { transform: none; } }
.agent-tile .face, .head-pill > .face { transition: transform var(--dur) var(--ease-out); }
@media (hover: hover) {
  .agent-tile:hover .face { transform: translateY(-2px); }
  .head-pill:hover > .face { transform: translateY(-1px); }
}
/* an agent at work: eyes scan, three dots think, the dot turns teal and breathes; when it ends, a check */
.face.is-thinking .face__f { animation: faceScan 2.4s ease-in-out infinite; }
@keyframes faceScan { 0%, 100% { transform: translate(-1.4px, 0); } 45%, 55% { transform: translate(1.4px, -0.4px); } }
.face-wrap .think {
  position: absolute; top: -6px; inset-inline-start: -6px; display: inline-flex; align-items: center; gap: 2px;
  height: 14px; padding: 0 4px; border-radius: var(--r-full); background: var(--bg-pane);
  box-shadow: var(--border-2) 0 0 0 0.5px inset, var(--shadow-pill); animation: thinkIn var(--dur) var(--ease-out);
}
.face-wrap .think i { width: 3px; height: 3px; border-radius: 50%; background: var(--text-2); animation: thinkDot 1.2s ease-in-out infinite; }
.face-wrap .think i:nth-child(2) { animation-delay: 150ms; }
.face-wrap .think i:nth-child(3) { animation-delay: 300ms; }
@keyframes thinkDot { 0%, 60%, 100% { transform: translateY(0); opacity: .45; } 30% { transform: translateY(-2px); opacity: 1; } }
@keyframes thinkIn { from { opacity: 0; transform: translateY(3px) scale(.8); } }
.face-wrap.is-thinking > .dot { background: var(--accent); }
.face-wrap.is-thinking > .dot::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: var(--accent); animation: dotPing 1.6s var(--ease-out) infinite; }
@keyframes dotPing { 0% { transform: scale(1); opacity: .55; } 80%, 100% { transform: scale(2.4); opacity: 0; } }
.face-wrap .done-ck {
  position: absolute; bottom: -2px; inset-inline-end: -2px; width: 16px; height: 16px; border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center; background: var(--primary); color: var(--on-primary);
  box-shadow: 0 0 0 2px var(--bg-sidebar); --od-icon-size: 11px; animation: ckPop 320ms var(--ease-spring);
}
.face-wrap--lg .done-ck { width: 20px; height: 20px; box-shadow: 0 0 0 3px var(--bg-chrome); --od-icon-size: 13px; }
.face-wrap .done-ck .od-icon path { stroke-width: 2.6; stroke-dasharray: 40; stroke-dashoffset: 40; animation: drawCheck 360ms var(--ease-out) 140ms forwards; }
@keyframes ckPop { from { transform: scale(.4); opacity: 0; } }
@keyframes drawCheck { to { stroke-dashoffset: 0; } }

/* press: everything you can press gives a little under the finger */
:is(.btn, .circle-btn, .chip, .agent-tile, .head-pill, .corner-pill, .composer__btn, .link-btn, .steps__toggle, .kcard, .opt, .panel-row, .sb-item, .menu__item) {
  transition-property: background-color, box-shadow, color, border-color, transform;
  transition-duration: var(--dur-fast); transition-timing-function: var(--ease-out);
}
:is(.btn, .circle-btn, .chip, .agent-tile, .head-pill, .corner-pill, .composer__btn):active:not(:disabled):not([aria-disabled="true"]) { transform: scale(0.96); }
:is(.kcard, .opt, .panel-row, .sb-item, .menu__item, .link-btn, .steps__toggle):active:not(:disabled) { transform: scale(0.985); }
.opt.is-chosen:active, .panel-row:not(button):active { transform: none; }
.switch::after { transition: transform 320ms var(--ease-spring), background-color var(--dur) var(--ease-out); }

/* send: the arrow takes off, the button's new icon pops in */
.send-fly {
  position: fixed; z-index: 130; display: inline-flex; align-items: center; justify-content: center; pointer-events: none;
  color: var(--text-1); --od-icon-size: 16px; animation: sendFly 380ms var(--ease-in) forwards;
}
@keyframes sendFly { to { transform: translateY(-28px) scale(.8); opacity: 0; } }
.od-icon.is-morph { animation: iconIn 240ms var(--ease-spring); }
@keyframes iconIn { from { transform: scale(.5) rotate(-30deg); opacity: 0; } }
.toast.is-leaving { animation: toastOut 140ms var(--ease-in) forwards; }
@keyframes toastOut { to { opacity: 0; transform: translate(-50%, -4px); } }

/* live line: each new step fades in */
.thinking .shimmer { display: inline-block; }
.is-swap { animation: lineIn 240ms var(--ease-out), breathe 1.4s ease-in-out 240ms infinite; }
@keyframes lineIn { from { opacity: 0; transform: translateY(4px); } }
/* tool steps arrive one after another, each check draws itself */
.step__state { display: inline-flex; align-items: center; gap: 3px; }
.step__ck { --od-icon-size: 12px; }
.steps__list.is-just .step { animation: rise 240ms var(--ease-out) both; animation-delay: calc(var(--i, 0) * 45ms); }
.steps__list.is-just .step__ck path { stroke-dasharray: 40; stroke-dashoffset: 40; animation: drawCheck 320ms var(--ease-out) forwards; animation-delay: calc(var(--i, 0) * 45ms + 160ms); }
/* an answered card settles, its check draws */
.card.is-just { animation: settle 320ms var(--ease-out); }
@keyframes settle { from { opacity: .55; transform: scale(.985); } }
.card.is-just .opt.is-chosen .opt__key { animation: ckPop 320ms var(--ease-spring); }
.card.is-just .opt__check path, .card.is-just .card__outcome .od-icon path { stroke-dasharray: 40; stroke-dashoffset: 40; animation: drawCheck 380ms var(--ease-out) 140ms forwards; }

/* board: pick a card up, carry it, drop it */
.kcard { position: relative; cursor: grab; }
@media (hover: hover) { .kcard:hover { transform: translateY(-1px); } }
.kcard.is-drag-src { opacity: .35; transform: none; background: transparent; box-shadow: inset 0 0 0 1px var(--border-1); }
body.is-dragging, body.is-dragging * { cursor: grabbing !important; user-select: none; }
.kcard--ghost {
  position: fixed; z-index: 120; margin: 0; pointer-events: none; transform-origin: 50% 30%; will-change: transform;
  box-shadow: var(--border-2) 0 0 0 0.5px, var(--shadow-modal);
}
.col { transition: box-shadow var(--dur-fast) var(--ease-out), background-color var(--dur-fast) var(--ease-out); }
.col.is-over { background: var(--bg-active); box-shadow: inset 0 0 0 1.5px var(--text-1); }
.col.is-blocked { box-shadow: inset 0 0 0 1.5px var(--border-1); }
.col.is-blocked .col__body { opacity: .5; }
.kcard.is-drop-before::before { content: ""; position: absolute; top: -5px; inset-inline: var(--s2); height: 2px; border-radius: var(--r-full); background: var(--text-1); }
.col__body.is-drop-end::after { content: ""; flex: none; height: 2px; margin-inline: var(--s2); border-radius: var(--r-full); background: var(--text-1); }
.kcard.is-landing { box-shadow: 0 0 0 2px var(--text-1); }
.board--enter .bar__fill { animation: barGrow 700ms var(--ease-out) both; }
@keyframes barGrow { from { transform: scaleX(0); } }
.badge--wait.is-new, .corner-pill.is-new { animation: nudge 520ms var(--ease-out); }
@keyframes nudge { 0%, 100% { transform: none; } 20% { transform: translateX(-3px) rotate(-2deg); } 40% { transform: translateX(3px) rotate(2deg); } 60% { transform: translateX(-2px); } 80% { transform: translateX(1px); } }
.sb-count.is-pop { animation: countPop 360ms var(--ease-spring); }
@keyframes countPop { from { transform: scale(.6); } }

/* dashboard chart: bars rise, a crosshair reads any day */
.chart-wrap { position: relative; }
.chart .bar-g { transition: opacity var(--dur-fast) var(--ease-out); }
.chart.is-hover .bar-g:not(.is-on) { opacity: .4; }
.chart__hair { stroke: var(--text-3); stroke-dasharray: 3 3; opacity: 0; transition: opacity var(--dur-fast) var(--ease-out); }
.chart.is-hover .chart__hair { opacity: 1; }
.chart.is-enter .bar-g rect { transform-box: fill-box; transform-origin: 50% 100%; animation: barUp 380ms var(--ease-out) both; animation-delay: calc(var(--i, 0) * 16ms); }
@keyframes barUp { from { transform: scaleY(0); } }
.chart-tip {
  position: absolute; top: 0; left: 0; z-index: 2; min-width: 132px; padding: var(--s2) var(--s3); border-radius: var(--r-md);
  background: var(--bg-pane); border: 0.5px solid var(--border-2); box-shadow: var(--shadow-popover);
  display: grid; gap: 2px; font-size: var(--fs-xs); line-height: 1.5; color: var(--text-2); pointer-events: none;
  transition: transform 120ms var(--ease-out); animation: fadeIn var(--dur-fast) var(--ease-out);
}
.chart-tip__d { color: var(--text-3); }
.chart-tip__tot { font-size: var(--fs-sm); font-weight: var(--w-strong); color: var(--text-1); }
.chart-tip__row { display: flex; align-items: center; gap: 6px; }
.chart-tip__row i { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.chart-tip__row .num { margin-inline-start: auto; color: var(--text-1); }

@media (prefers-reduced-motion: reduce) {
  .face__f { transform: none !important; }
  .face.is-thinking .face__f, .face-wrap .think i, .face-wrap.is-thinking > .dot::after { animation: none !important; }
  .kcard:hover { transform: none; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; }
  .caret, .shimmer, .rec-dot { animation: none; }
  .wave__bar { transition: none; }
}

/* ================= interface language =================
   English (left-to-right) is the default interface; Arabic (right-to-left) is chosen from Sara's workspace menu.
   Layout uses logical properties throughout; the rules below cover the few physical motions and masks,
   and keep Arabic chat content reading right-to-left inside the English interface. */
:root[lang="en"] { --font: "IBM Plex Sans", "IBM Plex Sans Arabic", "Noto Sans Arabic", system-ui, sans-serif; }
.kpi__unit--pre { margin-inline-start: 0; margin-inline-end: 4px; }

[dir="ltr"] .switch[aria-checked="true"]::after { transform: translateX(12px); }
[dir="ltr"] .sheet[open] { animation-name: sheetInLtr; }
[dir="ltr"] .sheet.is-closing { animation-name: sheetOutLtr; }
@keyframes sheetInLtr { from { transform: translateX(24px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes sheetOutLtr { to { transform: translateX(24px); opacity: 0; } }
[dir="ltr"] .board-cols.has-more-end { -webkit-mask-image: linear-gradient(to left, transparent 0, #000 var(--s12)); mask-image: linear-gradient(to left, transparent 0, #000 var(--s12)); }
[dir="ltr"] .board-cols.has-more-start { -webkit-mask-image: linear-gradient(to right, transparent 0, #000 var(--s12)); mask-image: linear-gradient(to right, transparent 0, #000 var(--s12)); }
[dir="ltr"] .board-cols.has-more-start.has-more-end {
  -webkit-mask-image: linear-gradient(to right, transparent 0, #000 var(--s12), #000 calc(100% - var(--s12)), transparent 100%);
  mask-image: linear-gradient(to right, transparent 0, #000 var(--s12), #000 calc(100% - var(--s12)), transparent 100%);
}
@media (max-width: 1023px) {
  [dir="ltr"] .details { transform: translateX(105%); }
  [dir="ltr"] .details.is-open { transform: none; }
}
@media (max-width: 767px) {
  [dir="ltr"] .sidebar { transform: translateX(-105%); }
  [dir="ltr"] .sidebar.is-open { transform: none; }
}

/* Arabic content (thread and card titles, routine names, notes) inside the English interface:
   each line takes its direction from its own text, so «حملة Meta: المحاسب الشامل» reads right-to-left
   while English rows stay left-to-right. Short labels keep the interface's left edge. */
[dir="ltr"] :is(.panel-row__t, .panel-row__d, .kcard__title, .kcard__t, .head-pill__title, .thread-item .od-truncate,
  .card__title, .card__sub, .kv__row dd, .feed__t, .vw-hand__t, .vw__sub, .table td:first-child, .app__name, .scr__tx, .scr__input) {
  unicode-bidi: plaintext; text-align: left;
}
[dir="ltr"] :is(.note > span, .handoff__t, .handoff__d, .dp-id__name, .empty-chat h2, .ck-label, .wait-empty span, .try-one__btn) { unicode-bidi: plaintext; }
[dir="ltr"] .suggest :is(b, span) { unicode-bidi: plaintext; text-align: left; }
/* longer Arabic text reads as a right-aligned paragraph */
[dir="ltr"] :is(.mem-note__t, .rv-note, .ck-quote, .set-input, textarea, input[type="search"], input[type="text"]) { unicode-bidi: plaintext; }
[dir="ltr"] .bubble { text-align: start; }
/* fields you write to the agents in Arabic start right-to-left (their examples are Arabic too) */
[dir="ltr"] :is(.composer__input, #set-instr, #mem-new, #rt-new, #idea-title):placeholder-shown { direction: rtl; }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="mobilebar">
    <button type="button" class="circle-btn" data-action="open-sidebar" aria-label="Open menu" aria-controls="sidebar" aria-expanded="false" id="mobile-menu"></button>
    <span class="mobilebar__t" id="mobile-title">Chats</span>
  </header>

  <aside class="sidebar" id="sidebar" aria-label="Main menu">
    <div class="sb-top">
      <div class="ws">
        <svg class="ws__mark" viewBox="0 0 32 32" width="28" height="28" role="img" aria-label="gtmworks logo">
          <rect width="32" height="32" rx="9" fill="var(--accent)"/>
          <path d="M21.5 11.5a7 7 0 1 0 1 7.5h-6.5" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div class="od-field">
          <bdi class="ws__name">gtmworks</bdi>
        </div>
      </div>
      <div class="sb-icons">
        <button type="button" class="circle-btn" data-action="toggle-search" id="btn-search" aria-label="Search chats" aria-controls="sb-search" aria-expanded="false"></button>
        <button type="button" class="circle-btn" data-action="new-chat" id="btn-newchat" aria-label="New chat" title="New chat (N)"></button>
      </div>
    </div>
    <div class="sb-search" id="sb-search" hidden>
      <label class="sr-only" for="sb-q">Search chats</label>
      <input type="search" id="sb-q" autocomplete="off" placeholder="Search chats" dir="auto">
    </div>
    <nav class="sb-scroll" aria-label="Navigation">
      <div class="sb-nav" id="sb-nav"></div>
      <section class="sb-sec" aria-labelledby="lbl-agents">
        <h2 class="sb-label" id="lbl-agents">Agents</h2>
        <div class="agent-grid" id="sb-agents" role="list"></div>
      </section>
      <section class="sb-sec" id="sb-recent" aria-label="Recent chats">
        <div id="sb-threads"></div>
      </section>
    </nav>
    <div class="sb-foot">
      <button type="button" class="sb-item sb-apps" data-action="open-apps" id="btn-apps" aria-haspopup="dialog"></button>
      <!-- Sara's account: opens the workspace settings menu (interface language lives here) -->
      <div class="menu me-menu" id="me-menu" role="menu" aria-labelledby="btn-me" hidden></div>
      <button type="button" class="me" data-action="me-menu" id="btn-me" aria-haspopup="menu" aria-expanded="false" aria-controls="me-menu">
        <span class="me__av" aria-hidden="true">S</span>
        <span class="me__text">
          <span class="me__name od-truncate">Sara Mansour</span>
          <span class="me__role od-truncate">Marketing manager</span>
        </span>
        <span class="me__chev" id="me-chev" aria-hidden="true"></span>
      </button>
      <button type="button" class="circle-btn" data-action="toggle-theme" id="btn-theme" aria-label="Light mode" aria-pressed="true"></button>
    </div>
  </aside>
  <div class="scrim" id="scrim" data-action="close-overlays" hidden></div>

  <main class="main" id="main">
    <section class="view" id="view-chat" aria-label="Chat"></section>
    <section class="view" id="view-board" aria-label="Marketing board" hidden></section>
    <section class="view" id="view-dashboard" aria-label="Numbers" hidden></section>
  </main>

  <aside class="details" id="details" aria-label="Agent details"></aside>
</div>

<dialog class="sheet" id="sheet" aria-labelledby="sheet-title">
  <div class="sheet__inner" id="sheet-inner"></div>
</dialog>

<dialog class="modal" id="modal" aria-labelledby="modal-title">
  <div class="modal__inner" id="modal-inner"></div>
</dialog>

<!-- the agent's screen, large and read-only («شاشة الوكيل») -->
<dialog class="modal viewer" id="viewer" aria-labelledby="viewer-title">
  <div class="vw" id="viewer-inner"></div>
</dialog>

<!-- «ربط التطبيقات»: the apps catalogue, docked like the board sheet -->
<dialog class="sheet apps-sheet" id="apps" aria-labelledby="apps-title">
  <div class="apps-inner" id="apps-inner"></div>
</dialog>

<!-- a file from an agent's library, read-only -->
<dialog class="modal pv" id="preview" aria-labelledby="preview-title">
  <div class="modal__inner pv__inner" id="preview-inner"></div>
</dialog>

<input type="file" id="file-input" multiple hidden tabindex="-1" aria-hidden="true">
<div id="toast-host" aria-live="polite" role="status"></div>

<script src="app.js"></script>
</body>
</html>
